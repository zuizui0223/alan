name: ALAN tier07 27507 original independent island observation photo groups
on:
  push:
    branches: [analysis/alan-tier07-27507-warm1024-pilot-20261108]
    paths:
      - .github/workflows/alan-tier07-27507-source-1024group-freeze.yml
      - scripts/acquisition/alan_tier07_27507_photo_source_schedule_20261108.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze-original-source-blind-to-photo-colour:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore original 27507 new source photo UUIDs without images
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3
          python -m py_compile scripts/acquisition/alan_tier07_27507_photo_source_schedule_20261108.py
          mkdir -p signed
          gh run download 42457757440 --repo zuizui0223/alan --name alan-93m-tier07-1p2m-new-island-observation-source-only --dir signed
          echo 'e38161652d3ec85928fa0f4fad91d70c123a7cb2af32f65f199f42504f76e056  signed/all_tier07_new_independent_island_photo_opportunities.csv.gz' | sha256sum -c -
      - name: Freeze 27507 true original observation photo UUIDs to source-blind 1024-photo groups
        run: |
          set -euo pipefail
          python -m scripts.acquisition.alan_tier07_27507_photo_source_schedule_20261108 --master signed/all_tier07_new_independent_island_photo_opportunities.csv.gz --out source_plan
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('source_plan/ALAN_tier07_27507_original_photo_source_schedule_receipt.json').read_text())
          assert j['schema']=='ALAN_tier07_27507_new_original_island_1024photo_source_schedule_v1'
          assert j['original_source_accepted_new_observation_UUIDs']==27507
          assert j['disjoint_genuine_source_groups']==27
          assert j['full_groups_of_1024_original_images']==26
          assert j['last_partial_source_group_size']==883
          assert j['first_1024_prespecified_blind_source']['combined_precolour_5photo_3accepted_taxon_sites']>=70
          assert j['source_photo_selection_did_not_use_colour'] and j['original_new_image_bytes_downloaded']==0
          print('ALAN_TIER07_27507_SOURCE_FIRST1024_FROZEN',j['first_1024_prespecified_blind_source'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-tier07-27507-original-island-precolour-1024photo-groups
          path: source_plan/
          retention-days: 90
          if-no-files-found: error
