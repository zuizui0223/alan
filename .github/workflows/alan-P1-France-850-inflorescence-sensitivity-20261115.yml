name: ALAN P1 source-grounded small fruit inflorescence LOIO and conservative bootstrap
on:
  push:
    branches:
      - analysis/alan-floral-timing-dependence-20261115
    paths:
      - scripts/analysis/alan_P1_smallfruit_inflorescence_sensitivity_20261115.py
      - tests/test_alan_P1_smallfruit_inflorescence_sensitivity_20261115.py
      - .github/workflows/alan-P1-France-850-inflorescence-sensitivity-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original group and bootstrap guard logic
        run: python -m unittest discover -s tests -p 'test_alan_P1_smallfruit_inflorescence_sensitivity_20261115.py' -v
      - name: Fetch SHA-verified Figshare fruit table and run 20k descriptive bootstrap
        run: python scripts/analysis/alan_P1_smallfruit_inflorescence_sensitivity_20261115.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-P1-France-850-inflorescence-sensitivity
          path: results/alan_P1_B1_smallfruit_inflorescence_sensitivity_20261115.json
          if-no-files-found: ignore
          retention-days: 30
