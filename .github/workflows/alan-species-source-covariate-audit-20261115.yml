name: ALAN species-level source covariate audit
on:
  push:
    branches: [analysis/alan-species-slopes-firststage-20261115]
    paths:
      - .github/workflows/alan-species-source-covariate-audit-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-covariate-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover source-authenticated site-year table and identify measured confounder columns
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3
          mkdir -p source verified
          gh run download 42624285048 --repo zuizui0223/alan --name alan-full93m-actual-PCNL1992-2024-moth-positive-macro --dir source
          echo '440a8313d71168e0a4dfd2f41a7bef45623abb068b07e3282026f1c35dccbd2c  source/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz' | sha256sum -c -
          python - <<'PY'
          import pandas as pd, json
          p='source/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz'
          d=pd.read_csv(p)
          audit={
            'source':'SIGNED_ORIGINAL_SITE_YEAR_85318',
            'n_original_sites':len(d),
            'all_columns':list(d.columns),
            'column_nonnull_count':{x:int(d[x].notna().sum()) for x in d.columns},
            'numeric_column_min_max':{x:[float(d[x].min()),float(d[x].max())] for x in d.select_dtypes('number').columns if not any(y in x.lower() for y in ('lat','lon','island','id'))},
            'no_raw_site_or_species_rows_exported':True}
          open('verified/source_covariate_audit.json','w').write(json.dumps(audit,indent=2,allow_nan=False)+'\n')
          print('SOURCE_COVARIATE_AUDIT',json.dumps(audit,allow_nan=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-species-covariate-audit-20261115
          path: verified/
          retention-days: 90
