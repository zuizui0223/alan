name: ALAN genuine global GBIF moth butterfly point-in-polygon 0.05deg pilot
on:
  push:
    branches: [analysis/alan-global-moth-source-census-20261110]
    paths:
      - scripts/analysis/alan_gbif_fourfamily_original_global_island_cell_stream_20261110.py
      - .github/workflows/alan-gbif-global-fourfamily-island-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-source-geographic-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        family: [Noctuidae, Nymphalidae]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q pyarrow==21.0.0 pandas==2.2.3 numpy==2.1.3 scipy==1.15.2 \
            geopandas==1.1.2 shapely==2.1.2 pyproj==3.7.2 statsmodels==0.14.5
          python -m py_compile scripts/analysis/alan_gbif_fourfamily_original_global_island_cell_stream_20261110.py
          mkdir -p original/coast original/schema
          gh run download 42780706666 --repo zuizui0223/alan \
            --name alan-authentic-worldwide-lepidoptera-202608-Parquet-rowgroup-schemas --dir original/schema
          gh run download 42175243391 --repo zuizui0223/mois \
            --name mois-GSHHG-2.3.7-high-L1-L2-SHA-source-no-images --dir original/coast
          python -m scripts.analysis.alan_gbif_fourfamily_original_global_island_cell_stream_20261110 \
            --family ${{ matrix.family }} \
            --manifest original/schema/gbif_2026_08_worldwide_moth_source_parquet_footer.json \
            --coast original/coast --max-row-groups 2 \
            --out true-global-island-test
          python - <<'PY'
          import json
          from pathlib import Path
          p=next(Path('true-global-island-test').glob('*_GBIF_202608_real_island_source_audit.json'))
          d=json.loads(p.read_text())
          assert d['source_actual_scan']['source_original_row_groups_read']==2
          assert not d['source_scan_complete_all_files_all_row_groups']
          assert d['source_coordinates_not_exported_only_coarse_0p05bins']
          print("ALAN_TRUE_GBIF_GEO_ISLAND_ORIGINAL_SOURCE_PILOT_OK",
                json.dumps({k:d[k] for k in (
                 'source_original_family',
                 'source_actual_scan',
                 'original_GSHHG_islands_ge_20km2',
                 'actual_observed_source_islands')},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-Gbif-original-202608-real-geolocated-pilot-${{ matrix.family }}
          path: true-global-island-test/
          retention-days: 90
          if-no-files-found: warn
