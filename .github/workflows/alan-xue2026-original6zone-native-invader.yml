name: ALAN Xue original six light zones invasive native biomass divergence

on:
  push:
    branches:
      - analysis/alan-xue2026-zonelevel-native-invader-20261120
    paths:
      - scripts/analysis/alan_xue2026_original6zone_native_invader_divergence.py
      - tests/test_alan_xue2026_original6zone_native_invader_divergence.py
      - .github/workflows/alan-xue2026-original6zone-native-invader.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-six-light-zones:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source analysis math
        run: python -m pip install -q numpy==2.1.3 pandas==2.2.3
      - name: Test original 24 source zone species cells and no pseudo replication
        run: python -m unittest discover -s tests -p 'test_alan_xue2026_original6zone_native_invader_divergence.py' -v
      - name: Calculate actual 3 lit 3 dark original zone performance ratios and exact labels
        run: |
          python -m scripts.analysis.alan_xue2026_original6zone_native_invader_divergence \
            --out /tmp/alan_xue2026_original_zone_invasive_native.json
      - name: Source-proof and physical-unit gate
        run: |
          python - <<'PY'
          import json
          z=json.load(open('/tmp/alan_xue2026_original_zone_invasive_native.json'))
          assert z['schema']=='alan_Xue2026_original6lightingzone_invasive_vs3native_monoculture_v1'
          assert z['independent_experimental_light_units']==6
          assert z['original_3lit_3dark_77surviving_cylinders']
          assert z['same_original_four_species_24_zone_means']
          assert z['no_binary_moisture_wet_vs_drier_moderator_in_four_aquatic_species']
          assert z['not_a_verified_mechanism_for_discovery_era_macro_moist_decliners']
          a=z['primary_relative_source_zone_result']
          assert a['exact_exchangeable_three_of_six_zone_assignments']==20
          assert a['exact_zone_label_two_sided_p_if_exchangeable']>=.1-1e-10
          assert a['monoculture_not_direct_species_competition']
          b=z['different_mixed_community_no_source_light_zone_id']
          assert b['underlying_real_independent_lamp_count_UNRESOLVED']
          print('XUE_TRUE_ORIGINAL_ZONE_SOURCE_PASS_NO_77_PSEUDOREPLICATION')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-Xue2026-source6zone-native-invader
          path: /tmp/alan_xue2026_original_zone_invasive_native.json
          if-no-files-found: error
          retention-days: 75
