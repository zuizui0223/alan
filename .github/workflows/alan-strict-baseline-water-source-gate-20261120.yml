name: ALAN matched-source baseline-water strict caliper falsification
on:
  push:
    branches: [analysis/alan-baseline-water-caliper-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-sample-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original matching libraries
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
      - name: Test outcome-blind water-caliper matching
        run: python -m unittest discover -s tests -p test_alan_strict_baseline_water_20261120.py -v
      - name: Run genuine fixed-source baseline-water strict common-support test
        run: python scripts/analysis/alan_strict_baseline_water_20261120.py --out /tmp/alan_strict_baseline_water_20261120.json
      - name: Archive original numerical evidence
        uses: actions/upload-artifact@v4
        with:
          name: alan-strict-baseline-water-original-source
          path: /tmp/alan_strict_baseline_water_20261120.json
          retention-days: 30
