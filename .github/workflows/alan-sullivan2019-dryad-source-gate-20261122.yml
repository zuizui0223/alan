name: ALAN Sullivan 2019 original wetland lighting source gate

on:
  push:
    branches: [analysis/alan-arthropod-search-expansion-20261122]
    paths:
      - 'scripts/acquisition/alan_sullivan2019_dryad_experiment_source_gate.py'
      - 'tests/test_alan_sullivan2019_dryad_source_gate_20261122.py'
      - 'tests/test_alan_sullivan2019_frozen_20261122.py'
      - 'database/alan_experiments/arthropod_expansion_20261122/sullivan2019_source_reanalysis/**'
      - '.github/workflows/alan-sullivan2019-dryad-source-gate-20261122.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-author-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check strict study independence and source safety
        run: |
          python -m unittest discover -s tests -p 'test_alan_sullivan2019_dryad_source_gate_20261122.py' -v
          python -m unittest discover -s tests -p 'test_alan_sullivan2019_frozen_20261122.py' -v
      - name: Verify the original public Dryad source metadata
        run: python scripts/acquisition/alan_sullivan2019_dryad_experiment_source_gate.py --output results/alan_sullivan2019_dryad_source_gate_20261122.json
      - name: Recheck frozen derived results against the newly retrieved source
        run: python -m unittest discover -s tests -p 'test_alan_sullivan2019_frozen_20261122.py' -v
      - name: Archive only the source audit, not individual records
        uses: actions/upload-artifact@v4
        with:
          name: alan-sullivan2019-dryad-source-gate
          path: results/alan_sullivan2019_dryad_source_gate_20261122.json
