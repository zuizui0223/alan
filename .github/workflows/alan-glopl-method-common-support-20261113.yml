name: ALAN GloPL method x selfing original within-study and regional common-support audit
on:
  push:
    branches: [analysis/alan-glopl-method-common-support-20261113]
    paths:
      - .github/workflows/alan-glopl-method-common-support-20261113.yml
      - scripts/analysis/alan_GloPL_original_method_autonomy_common_support_20261113.py
      - tests/test_alan_GloPL_original_method_autonomy_common_support_20261113.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-inference-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5
          python -m py_compile scripts/analysis/alan_GloPL_original_method_autonomy_common_support_20261113.py
          python -m unittest discover -s tests -p test_alan_GloPL_original_method_autonomy_common_support_20261113.py -v
  true-reproductive-experiment-source:
    needs: source-inference-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore 1419 original pollen-supplementation experiment-year-linked real PCNL and species-DIRECT reproductive traits
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5
          mkdir -p original/glopl original/traits
          gh run download 42754948691 --repo zuizui0223/alan --name alan-realGloPL-1419-experiments-1992-2014-true-priorPCNL-exposure --dir original/glopl
          test -s original/glopl/joined/GloPL_experimental_PL1993_2015_priorPCNL1992_2014.csv.gz
          test -s original/glopl/joined/original_GloPL_PCNLPrior_join_receipt.json
          gh run download 34191508045 --repo zuizui0223/island --name source-scale-batch-integration-34191508045 --dir original/traits
          echo '7e86170218814abe2845da9a0282aecfdc930819b9d0c439bae8df4a0679c577  original/traits/direct_species_trait_ledger.csv.gz' | sha256sum -c -
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('original/glopl/joined/GloPL_experimental_PL1993_2015_priorPCNL1992_2014.csv.gz')
          r=json.loads(Path('original/glopl/joined/original_GloPL_PCNLPrior_join_receipt.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['output_sha256']
          assert r['source_experiment_rows']==1419
          assert r['original_PCNLP_years_verified']==23
          assert r['historical_light_never_future_experiment']
          print('REAL_GLOPL_PL_PRIORLIGHT_YEAR_AND_SOURCE_SHA_VERIFIED')
          PY
      - name: Independently audit research design intersection on authenticated original GloPL
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p aggregate_design
          python -m scripts.analysis.alan_GloPL_original_method_autonomy_common_support_20261113 \
            --joined original/glopl/joined/GloPL_experimental_PL1993_2015_priorPCNL1992_2014.csv.gz \
            --receipt original/glopl/joined/original_GloPL_PCNLPrior_join_receipt.json \
            --ledger original/traits/direct_species_trait_ledger.csv.gz \
            --out aggregate_design/alan_GloPL_method_autonomy_source_overlap_20261113.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("aggregate_design/alan_GloPL_method_autonomy_source_overlap_20261113.json").read_text())
          assert s["status"]=="AUTHENTIC_SOURCE_METHOD_HETEROGENEITY_NOT_WITHIN_STUDY_IDENTIFIED"
          assert abs(s["source"]["original_1419_reproduced_light_beta"]-.010715792632233193)<1e-8
          h=s["results"]["high_medium"]
          assert h["source_study_and_protocol_overlap"]["research_unit_overlap"]["studies_with_BOTH_methods"]==3
          assert h["source_study_and_protocol_overlap"]["research_unit_overlap"]["study_species_experimentyear_groups_with_BOTH_methods"]==0
          assert h["joint_spatial_and_light_exposure_common_support"]["10degree"]["regions_with_all_four_method_x_selfing_source_cells"]==1
          assert h["joint_spatial_and_light_exposure_common_support"]["10degree"]["regions_with_all_four_AND_positive_exposure_interval_overlap"]==0
          print("ORIGINAL_GLOPL_METHOD_SELFING_REGIONAL_COMMON_SUPPORT_AUDITED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-GloPL-725-real-method-selfing-overlap-20261113
          path: aggregate_design/alan_GloPL_method_autonomy_source_overlap_20261113.json
          retention-days: 90
          if-no-files-found: warn
