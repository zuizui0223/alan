name: ALAN true repeated gecko skink island photo grid and year-fixed source light test
on:
  push:
    branches: [analysis/alan-gecko-reptile-detection-controlled-20261110]
    paths:
      - scripts/analysis/alan_gecko_scink_repeated_photo_cell_temporalFE_20261110.py
      - tests/test_alan_gecko_skink_repeated_source_cell_temporalFE_20261110.py
      - .github/workflows/alan-gecko-skink-repeated-original-siteyear-FE.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-temporal-source-GSHHG-photorecords:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate within-site year fixed-effect source implementation
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 \
            rasterio==1.4.3 geopandas==1.1.2 shapely==2.1.2 pyproj==3.7.2 \
            statsmodels==0.14.5 pyarrow==21.0.0
          python -m py_compile scripts/analysis/alan_gecko_scink_repeated_photo_cell_temporalFE_20261110.py
          python -m unittest discover -s tests -p test_alan_gecko_skink_repeated_source_cell_temporalFE_20261110.py -v
      - name: Restore exact original 13 historical PCNL-years matched gecko versus skink photographic source
        run: |
          set -euo pipefail
          mkdir -p source prior-model
          gh run download 42796502910 --repo zuizui0223/alan \
            --name alan-original-101399-gecko-scink-photo-13year-historical-PCNL-all-islands \
            --dir source
          gh run download 42797211231 --repo zuizui0223/alan \
            --name alan-actual-gecko-vs-scink-both-documented-light-niche-priorPCNL \
            --dir prior-model
          echo '03aa855c9e7691855bfee4baa099f0d3a31db8d53066ec36a95afda48c3ba339  source/gecko_scink_true_2013_2025_original_island_photo_cells_priorPCNL.csv.gz' | sha256sum -c -
      - name: Estimate genuine repeated-source same-grid-cell × calendar-year panel or report no statistical positivity
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_gecko_scink_repeated_photo_cell_temporalFE_20261110 \
            --source source/gecko_scink_true_2013_2025_original_island_photo_cells_priorPCNL.csv.gz \
            --receipt source/gecko_scink_original_13prior_PCNL_source_receipt.json \
            --out source-temporal/ALAN_true_repeated_gecko_scink_photo_grid_vs_historical_PCNL.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('source-temporal/ALAN_true_repeated_gecko_scink_photo_grid_vs_historical_PCNL.json')
          r=json.loads(p.read_text())
          assert r['source_photo_record_share_not_reptile_true_occupancy']
          assert r['not_a_causal_longitudinal_gecko_light_treatment']
          print('ALAN_TRUE_REPEATED_GECKO_SKINK_PHOTOSOURCE_TEMPORAL_FE',
                json.dumps(r,sort_keys=True),flush=True)
          q=json.loads(Path('prior-model/ALAN_gecko_vs_scink_both_documented_photos_priorPCNL_FE.json').read_text())
          assert q['schema']=='ALAN_2026_11_gecko_v_scink_GBIF_photo_records_prior_PCNL_same_islandyear_v1'
          for name,v in q['all_source_13year_observational_model_variants'].items():
              if name=='independently_10km_spaced_source_photo_cells':
                  for sub,submodel in v.items():
                      r=submodel.get('source_regression',{})
                      print('ALAN_TRUE_REPTILE_LIGHT_NICHE_ALL_VARIANTS',
                            json.dumps({'analysis':name+'/'+sub,
                               'eligible_source_islands':submodel['original_source_eligibility']['source_retained_independent_islands'],
                               'photo_event_source_cells':submodel['original_source_eligibility']['source_retained_grid_cell_years'],
                               'light':r.get('terms',{}).get('prior_log1p_PCNL'),
                               'status':r.get('status')},sort_keys=True),flush=True)
              else:
                  r=v.get('source_regression',{})
                  print('ALAN_TRUE_REPTILE_LIGHT_NICHE_ALL_VARIANTS',
                        json.dumps({'analysis':name,
                          'eligible_source_islands':v.get('original_source_eligibility',{}).get('source_retained_independent_islands'),
                          'photo_event_source_cells':v.get('original_source_eligibility',{}).get('source_retained_grid_cell_years'),
                          'light':r.get('terms',{}).get('prior_log1p_PCNL'),
                          'status':r.get('status')},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-real-gecko-v-scink-repeated-photo-cellyear-two-way-FE-source
          path: source-temporal/ALAN_true_repeated_gecko_scink_photo_grid_vs_historical_PCNL.json
          retention-days: 90
          if-no-files-found: warn
