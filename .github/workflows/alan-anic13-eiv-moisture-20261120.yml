name: ALAN original Anic 13 species biomass x wet-habitat affinity EIV
on:
  push:
    branches: [analysis/alan-predator-guild-switch-edi-20261118]
    paths:
      - "scripts/analysis/alan_anic2022_13species_eiv_moisture_lightcode_source_gate_20261120.py"
      - "scripts/analysis/alan_anic2022_13plant_eiv_name_support_audit_20261120.py"
      - "tests/test_alan_anic2022_13species_eiv_moisture_lightcode_20261120.py"
      - ".github/workflows/alan-anic13-eiv-moisture-20261120.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-original-13species-source-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source and numerical parsers
        run: |
          python -m pip install -q pypdf==6.1.0 pandas==2.2.3 numpy==2.1.3 scipy==1.15.2
      - name: Test exact EIV matching, no zero imputation and maxT structure
        run: python -m unittest discover -s tests -p 'test_alan_anic2022_13species_eiv_moisture_lightcode_20261120.py' -v
      - name: Download exact independent European MOIST EIV source
        run: |
          curl -fL --retry 3 --max-time 240 \
            https://www.sci.muni.cz/botany/juice/NET/sources/EIV_Europe.csv \
            -o /tmp/ALAN_Original_EIV_Europe.csv
          echo 'ffeb2a5f45c95886625f970734e431098587c65baad7def786d35364a761dbba  /tmp/ALAN_Original_EIV_Europe.csv' | sha256sum -c -
      - name: Re-read original author Figshare numeric biomass PDF and fit all 13 plant trait diagnostics
        run: |
          python -m scripts.analysis.alan_anic2022_13species_eiv_moisture_lightcode_source_gate_20261120 \
            --eiv /tmp/ALAN_Original_EIV_Europe.csv \
            --out /tmp/ALAN_Anic2022_13plants_moisture_source_gate.json
      - name: Check unscored original plant names against literal EIV source labels
        run: |
          python -m scripts.analysis.alan_anic2022_13plant_eiv_name_support_audit_20261120 \
            --source /tmp/ALAN_Anic2022_13plants_moisture_source_gate.json \
            --eiv /tmp/ALAN_Original_EIV_Europe.csv \
            --out /tmp/ALAN_Anic2022_EIV_unmatched_taxa_source_labels.json
      - name: Guard experimental light treatments and do not claim causal wet-specific ALAN
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ALAN_Anic2022_13plants_moisture_source_gate.json'))
          assert d['schema']=='alan_Anic2022_13plant_exact_EIV_MOIST_x_unmapped_light_codes_v1'
          assert d['original_physical_troughs']==54 and d['original_species']==13
          assert d['source_light_codes_L1_L2_L3_NOT_mapped_to_dark_amber_white']
          assert not d['no_original_independent_true_seed_pollination_outcomes']==False
          assert d['wet_species_macro_effect_not_estimated']
          print('ANIC13_SOURCE_MOISTURE_INFERENCE_STATUS',d['effect_modifier_inference_gate']['status'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-original-Anic13-54trough-MOIST-x-light-code-source
          path: |
            /tmp/ALAN_Anic2022_13plants_moisture_source_gate.json
            /tmp/ALAN_Anic2022_EIV_unmatched_taxa_source_labels.json
          if-no-files-found: error
          retention-days: 45
