name: ALAN Li2026 exact field taxon round common-support test
on:
  push:
    branches: [analysis/alan-floral-timing-dependence-20261115]
    paths:
      - scripts/analysis/alan_Li2026_matched_field_taxon_round_20261115.py
      - tests/test_alan_Li2026_matched_field_taxon_round_20261115.py
      - .github/workflows/alan-Li2026-matched-field-taxon-round-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Offline unit tests
        run: python -m unittest discover -s tests -p 'test_alan_Li2026_matched_field_taxon_round_20261115.py' -v
      - name: Original Git blob verified field x species x round analysis
        run: python -m scripts.analysis.alan_Li2026_matched_field_taxon_round_20261115
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-Li-real79-field-taxon-round-support
          path: results/alan_Li2026_matched_site_species_round_seed_bud_20261115.json
          retention-days: 30
