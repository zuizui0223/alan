name: ALAN 24576 original photo source WCVP moth-visit vs pollen-evidence screening
on:
  push:
    branches: [analysis/alan-tier08-moth-evidence-guild-stratification-20261109]
    paths:
      - .github/workflows/alan-tier08-moth-evidence-positive-original-photo-audit.yml
      - scripts/analysis/alan_tier08_moth_positive_source_support_20261109.py
      - tests/test_alan_tier08_moth_positive_source_support_20261109.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  moth-only-source-verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run synthetic tests and verify no nocturnal/effectiveness imputation
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m unittest discover -s tests -p test_alan_tier08_moth_positive_source_support_20261109.py -v
          python -m py_compile scripts/analysis/alan_tier08_moth_positive_source_support_20261109.py
      - name: Restore precolour signed 24576 original photo IDs and independent public GloBI/WCVP accepted names
        timeout-minutes: 11
        run: |
          set -euo pipefail
          mkdir -p sources
          gh run download 42601418957 --repo zuizui0223/alan \
            --name alan-tier08-24576-genuine-original-source-192shard-precolour-3waves --dir sources
          gh run download 39225659840 --repo zuizui0223/mois \
            --name mois-real350399-Kew-WCVP-native-source-TDWG3-no-point-status --dir sources
          gh run download 41976552977 --repo zuizui0223/mois \
            --name mois-ALAN-GloBI-stage2-actual-records-2019-2024-supported-source --dir sources
          echo '5578cd2e02330ee951539d4b7d0a2e166b1c8b1ec6dc87f383f8625c7608098d  sources/precolour_24576_frozen_queue.csv.gz' | sha256sum -c -
          echo '9cd6aa7ca29f00c64283bcc08dcb778e212b644b837e64070051339b11d8b7b3  sources/mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz' | sha256sum -c -
          echo 'a6b97aa0941215d2f645e4c4fbf19490492b93680a7d7c0502814c7a66902994  sources/GloBI_stage2_signed_extension.csv.gz' | sha256sum -c -
      - name: Audit actual moth / GloBI pollinates / Walton direct night pollen source islands, never pretend measured ROI
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_tier08_moth_positive_source_support_20261109 \
            --queue sources/precolour_24576_frozen_queue.csv.gz \
            --accepted sources/mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz \
            --globi sources/GloBI_stage2_signed_extension.csv.gz \
            --out moth_24576_source_support
          python - <<'PY'
          from pathlib import Path
          import json
          s=json.loads(Path("moth_24576_source_support/alan_tier08_24576_moth_positive_original_photo_support.json").read_text())
          assert s["schema"]=="ALAN_original24576_island_GloBI_moth_pollination_evidence_source_support_v1"
          assert s["source_original_RGB_photo_attempts"]==24576
          assert s["source_GSHHG_islands"]==305
          assert s["source_photo_siteyears"]==3237
          assert s["tier_source_support"]["moth_record_positive"]["original_photo_attempts_not_ROI_success"]==8048
          assert s["tier_source_support"]["moth_database_pollinates"]["original_photo_attempts_not_ROI_success"]==3553
          assert s["tier_source_support"]["walton_direct_nocturnal_pollen_carriage"]["precolour_islands_with_any_such_5attempt_3species_site"]==3
          assert s["no_record_not_negative_moth_or_negative_butterfly_evidence"]
          assert s["three_predeclared_full_photo_RGB_waves_unaltered"]
          print("ALAN_TIER08_MOTH_RESTRICTED_SOURCE_SUPPORT_REAL_ORIGINAL_PHOTO_PROVENANCE_OK",
                 {k:{"photos":v["original_photo_attempts_not_ROI_success"],
                      "plant_species":v["recorded_plant_species"],
                      "potential_5attempt3species_islands":v["precolour_islands_with_any_such_5attempt_3species_site"]}
                  for k,v in s["tier_source_support"].items()},flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-tier08-moth-visitor-and-nocturnal-pollen-evidence-original-photo-support
          path: moth_24576_source_support/
          retention-days: 90
          if-no-files-found: warn
