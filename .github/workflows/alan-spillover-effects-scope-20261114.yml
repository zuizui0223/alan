name: ALAN original spillover reproductive effects and light-meta scope
on:
  push:
    branches: [analysis/alan-spillover-reproductive-effect-scope-20261114]
    paths:
      - scripts/analysis/alan_spillover_effects_20261114.py
      - tests/test_alan_spillover_effects_20261114.py
      - scripts/analysis/alan_pollution_meta_source_20261114.py
      - tests/test_alan_pollution_meta_source_20261114.py
      - scripts/analysis/alan_reproductive_meta_20261114.py
      - tests/test_alan_reproductive_meta_20261114.py
      - docs/ALAN_REPRODUCTIVE_META_SOURCE_AND_PAPER_DEPENDENCE_20261114.md
      - .github/workflows/alan-spillover-effects-scope-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install numerical solver and test effect, source and dependence guards
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 scipy==1.14.1
          python -m unittest discover -s tests -p test_alan_spillover_effects_20261114.py -v
          python -m unittest discover -s tests -p test_alan_pollution_meta_source_20261114.py -v
          python -m unittest discover -s tests -p test_alan_reproductive_meta_20261114.py -v
      - name: Read genuine primary tables and supplemental study inventory
        run: python -m scripts.analysis.alan_spillover_effects_20261114 --out new_source_effects
      - name: Verify original meta CSV and author code file hashes
        run: python -m scripts.analysis.alan_pollution_meta_source_20261114 --out new_source_effects
      - name: Fit only matched reproductive endpoints with papers as sampling units
        run: python -m scripts.analysis.alan_reproductive_meta_20261114 --out new_source_effects
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-spillover-original-coefficients-and-scope-20261114
          path: new_source_effects/
          retention-days: 90
          if-no-files-found: warn
