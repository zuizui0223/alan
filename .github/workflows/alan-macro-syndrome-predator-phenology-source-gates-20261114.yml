name: ALAN global condition-gated vulnerability mechanism source-audit
on:
  push:
    branches: [analysis/alan-macro-syndrome-predator-phenology-island-gates-20261114]
    paths:
      - config/alan_night_syndrome_multichannel_macro_sources_20261114.json
      - scripts/analysis/alan_macro_syndrome_predator_phenology_source_gates_20261114.py
      - tests/test_alan_macro_syndrome_predator_phenology_source_gates_20261114.py
      - .github/workflows/alan-macro-syndrome-predator-phenology-source-gates-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saved-source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run actual original archive-referenced source QA tests, no invented ecological measurements
        run: |
          set -euo pipefail
          python -m py_compile scripts/analysis/alan_macro_syndrome_predator_phenology_source_gates_20261114.py
          python -m unittest discover -s tests -p 'test_alan_macro_syndrome_predator_phenology_source_gates_20261114.py' -v
      - name: Write concrete macro-source support and missing-guild evidence audit
        run: |
          set -euo pipefail
          mkdir -p macro_verified
          python -m scripts.analysis.alan_macro_syndrome_predator_phenology_source_gates_20261114 \
            --repo . --out macro_verified/ALAN_macro_multi_channel_condition_gates_20261114.json
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path("macro_verified/ALAN_macro_multi_channel_condition_gates_20261114.json").read_text())
          assert z["status"]=="REAL_SAVED_AGGREGATE_SOURCE_QA_ONLY_NO_NEW_INTERACTION_BETA"
          assert z["original_source_aggregate_replay"]["island_macro_observed_photo_opportunity"]["independent_islands"]==562
          assert z["original_source_aggregate_replay"]["island_macro_observed_photo_opportunity"]["measured_real_day_night_source_species_in_photo_frame"]==52
          assert z["original_source_aggregate_replay"]["island_mainland_photo_alanspatial"]["island_siteyears"]==933
          assert z["original_source_aggregate_replay"]["animal_photo_predator_and_moth"]["matched_same_island_cell_years"]==15255
          assert all(x["status"].startswith(("NOT_ESTIMABLE","PARTIAL_")) for x in z["conditional_hypotheses_identification"])
          assert z["old_source_record_provenance_bug"]["prior_original_file_not_overwritten"]
          print("ALAN_GLOBAL_VULNERABILITY_MECHANISMS_SOURCE_GATED_NO_CROSS_SCALE_INFERENCE",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-macro-syndrome-predator-phenology-source-gates-20261114
          path: macro_verified/
          if-no-files-found: warn
          retention-days: 90
