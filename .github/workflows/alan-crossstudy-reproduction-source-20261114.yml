name: ALAN original cross-study reproductive evidence source intake
on:
  push:
    branches: [analysis/alan-crossstudy-reproduction-source-20261114]
    paths:
      - scripts/analysis/alan_crossstudy_source_intake_20261114.py
      - scripts/analysis/alan_crossstudy_scope_20261114.py
      - tests/test_alan_crossstudy_scope_20261114.py
      - docs/ALAN_CROSSSTUDY_SCOPE_AND_DARK_SPILLOVER_20261114.md
      - .github/workflows/alan-crossstudy-reproduction-source-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test reference identity, exposure scope and numerical transformations
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_alan_crossstudy_scope_20261114.py -v
      - name: Reacquire published review supplement and classify actual study memberships
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_crossstudy_source_intake_20261114 --out intake > intake_verbose.log
          python -m scripts.analysis.alan_crossstudy_scope_20261114 --source intake/source_tables.json --out intake/ALAN_scope_and_spillover_source.json
      - uses: actions/upload-artifact@v4
        with:
          name: alan-original-crossstudy-scope-and-spillover
          path: intake/*.json
          retention-days: 90
          if-no-files-found: error
