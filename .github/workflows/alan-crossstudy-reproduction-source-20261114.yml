name: ALAN original cross-study reproductive evidence source intake
on:
  push:
    branches: [analysis/alan-crossstudy-reproduction-source-20261114]
    paths:
      - scripts/analysis/alan_crossstudy_source_intake_20261114.py
      - .github/workflows/alan-crossstudy-reproduction-source-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify parser syntax and inspect original source tables
        run: |
          set -euo pipefail
          python -m py_compile scripts/analysis/alan_crossstudy_source_intake_20261114.py
          python -m scripts.analysis.alan_crossstudy_source_intake_20261114 --out intake
      - uses: actions/upload-artifact@v4
        with:
          name: alan-original-guenat2023-supplement-source-intake
          path: intake/source_tables.json
          retention-days: 90
          if-no-files-found: error
