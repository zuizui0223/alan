name: ALAN original cross-study reproductive evidence source intake
on:
  push:
    branches: [analysis/alan-crossstudy-reproduction-source-20261114]
    paths:
      - scripts/analysis/alan_crossstudy_source_intake_20261114.py
      - scripts/analysis/alan_crossstudy_scope_20261114.py
      - scripts/analysis/alan_ceiba2022_original_source_20261114.py
      - scripts/analysis/alan_ceiba2022_common_record_associations_20261114.py
      - scripts/analysis/alan_giavi2020_reported_contrasts_20261114.py
      - tests/test_alan_crossstudy_scope_20261114.py
      - tests/test_alan_crossstudy_followthrough_20261114.py
      - docs/ALAN_CROSSSTUDY_SCOPE_AND_DARK_SPILLOVER_20261114.md
      - .github/workflows/alan-crossstudy-reproduction-source-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test original source scope, same-record associations and contrast directions
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_alan_crossstudy_*20261114.py' -v
      - name: Reacquire original source memberships and spillover coefficients
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_crossstudy_source_intake_20261114 --out intake > intake_verbose.log
          python -m scripts.analysis.alan_crossstudy_scope_20261114 --source intake/source_tables.json --out intake/ALAN_scope_and_spillover_source.json > scope_verbose.log
          python -m scripts.analysis.alan_giavi2020_reported_contrasts_20261114 --source intake/ALAN_scope_and_spillover_source.json --out intake/ALAN_Giavi2020_published_contrasts.json
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('intake/ALAN_scope_and_spillover_source.json').read_text())
          print('SOURCE_SCOPE_COUNTS',z['review_scope']['counts'])
          print('SOURCE_META_SCOPE',z['review_scope']['original_broad_light_meta_model'])
          PY
      - name: Acquire and analyze authentic bat-pollinated tree CSV at identical record grain
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_ceiba2022_original_source_20261114 --out intake/ALAN_Ceiba2022_source_receipt.json > ceiba_source_verbose.log
          python -m scripts.analysis.alan_ceiba2022_common_record_associations_20261114 --out intake/ALAN_Ceiba2022_common_record_associations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-original-crossstudy-scope-and-spillover
          path: intake/*.json
          retention-days: 90
          if-no-files-found: error
