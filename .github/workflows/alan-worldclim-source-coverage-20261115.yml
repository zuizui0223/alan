name: ALAN actual WorldClim baseline source coverage and within-island variation
on:
  push:
    branches: [analysis/alan-worldclim-population-controls-20261115]
    paths:
      - scripts/analysis/alan_worldclim_original_climate_20261115.py
      - .github/workflows/alan-worldclim-source-coverage-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  worldclim-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 rasterio==1.4.3
          python -m py_compile scripts/analysis/alan_worldclim_original_climate_20261115.py
      - name: Fetch signed original Li-Cao PCNL 77,647 island photo sites
        run: |
          set -euo pipefail
          mkdir -p source worldclim verified
          gh run download 42624285048 --repo zuizui0223/alan \
            --name alan-full93m-actual-PCNL1992-2024-moth-positive-macro --dir source
          echo '440a8313d71168e0a4dfd2f41a7bef45623abb068b07e3282026f1c35dccbd2c  source/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz' | sha256sum -c -
      - name: Restore unmodified WorldClim 2.1 10m BIO official source via SHA-pinned FCP 2026-09 release
        timeout-minutes: 17
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 840 \
            https://github.com/zuizui0223/fcp/releases/download/fcp-worldclim-2.1-10m-20260925/wc2.1_10m_bio.zip \
            --output worldclim/wc2.1_10m_bio.zip
          echo '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf  worldclim/wc2.1_10m_bio.zip' | sha256sum -c -
          unzip -q worldclim/wc2.1_10m_bio.zip \
            wc2.1_10m_bio_1.tif wc2.1_10m_bio_12.tif wc2.1_10m_bio_15.tif -d worldclim/
          for i in 1 12 15; do test -s worldclim/wc2.1_10m_bio_${i}.tif; done
      - name: Actual original static climate source sampling (no year weather substitution)
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_worldclim_original_climate_20261115 \
            --sites source/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz \
            --raster_dir worldclim \
            --out verified/alan_worldclim_original_site_climate_20261115.json
          python - <<'PY'
          import json
          obj=json.load(open('verified/alan_worldclim_original_site_climate_20261115.json'))
          assert obj['original_alan_site_years']==77647
          assert obj['original_alan_islands']==562
          assert obj['source_is_10arcmin_static_1970_2000_normal_not_2019_2025_actual_weather']
          assert obj['climate_NODATA_retained']
          print('ALAN_WORLDCLIM_SOURCE_QUALITY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-worldclim-10m-original-climate-source-audit-20261115
          path: verified/
          retention-days: 90
          if-no-files-found: warn
