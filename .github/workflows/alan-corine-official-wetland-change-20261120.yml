name: ALAN official CORINE 2000–2018 inland wetland change polygons
on:
  push:
    branches: [analysis/alan-corine-wetland-official-cha-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-eea-change-data:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical/geospatial libraries
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 requests==2.32.5 shapely==2.0.7 pyproj==3.7.2
      - name: Test wetland change calculations and actual source ID
        run: python -m unittest discover -s tests -p test_alan_corine_official_wetland_change_20261120.py -v
      - name: Query EEA three official original CLC-Change sources at 17 sites
        run: python scripts/analysis/alan_corine_official_wetland_change_20261120.py --out /tmp/official_cha.json --csv /tmp/official_cha.csv
      - name: Archive original-source numerical result and site-level summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan-original-eea-3epoch-wetland-source
          path: |
            /tmp/official_cha.json
            /tmp/official_cha.csv
          retention-days: 30
          if-no-files-found: warn
