name: ALAN tier08 910 authentic ROI9 source crossarm exact photo-ID reuse and strict-site recheck
on:
  push:
    branches: [analysis/alan-tier08-balanced-independent-photo-source-20261109]
    paths:
      - .github/workflows/alan-tier08-910-crosssource-photoid-reuse-audit.yml
      - scripts/analysis/alan_tier08_910_exact_photoid_prior_crosssource_audit_20261109.py
      - tests/test_alan_tier08_910_exact_photoid_prior_crosssource_audit_20261109.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed-original-photoid-only-cross-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source-dedup synthetic tests
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m unittest discover -s tests -p test_alan_tier08_910_exact_photoid_prior_crosssource_audit_20261109.py -v
          python -m py_compile scripts/analysis/alan_tier08_910_exact_photoid_prior_crosssource_audit_20261109.py
      - name: Restore original SHA-verified historical canonical and separate tier06 tier07 source IDs
        timeout-minutes: 11
        run: |
          set -euo pipefail
          mkdir -p historical prior06 prior07
          gh run download 41007444495 --repo zuizui0223/mois \
            --name mois-nohuman-canonical-climate-joined-20261030 --dir historical
          gh run download 42447983019 --repo zuizui0223/alan \
            --name alan-source-8942-novel-island-UUID-disjoint256-batches --dir prior06
          gh run download 42466279952 --repo zuizui0223/alan \
            --name alan-tier07-27507-original-island-precolour-1024photo-groups --dir prior07
          echo 'f033661d76e07898a5c13199a55c5d0ce6e55353daa48b0058c456979e90644c  historical/canonical_observations_climate.csv.gz' | sha256sum -c -
          echo 'e64f77d91ab9c19db7e38861baf96753395de5f1189f2599a1ac5cf1f55d8acd  prior06/progressive_8942_new_island_source_schedule.csv.gz' | sha256sum -c -
          echo '7198455819f1ac260a6cbeacd9f4536c30d766595daa64dc5205c75e9d5a1c62  prior07/alan_tier07_all27507_new_island_original_photo_1024group_source.csv.gz' | sha256sum -c -
      - name: Restore real FCP original tier08 910 image-measured outcomes, no image bytes
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p measured
          gh run download 42585672818 --repo zuizui0223/alan \
            --name alan-tier08-910-authentic-original-ROI9-finished-and-source-SHA-receipts --dir measured
          echo '37a329e54b0bbced86e40ed16d45ca095e530aa4faa64b3aa674c29023f8c1f9  measured/finished/alan_tier08_new910_actual_original_photo_ROI9.csv.gz' | sha256sum -c -
      - name: Audit and source-only deduplicate exact original photo IDs against prior all-canonical arms
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_tier08_910_exact_photoid_prior_crosssource_audit_20261109 \
            --canonical historical/canonical_observations_climate.csv.gz \
            --tier06 prior06/progressive_8942_new_island_source_schedule.csv.gz \
            --tier07 prior07/alan_tier07_all27507_new_island_original_photo_1024group_source.csv.gz \
            --tier08 measured/finished/alan_tier08_new910_actual_original_photo_ROI9.csv.gz \
            --out tier08_photoid_crosssource_audit
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('tier08_photoid_crosssource_audit/ALAN_tier08_910_exact_photoid_prior_source_audit.json').read_text())
          a=r['audit']
          assert r['schema']=='ALAN_tier08_910_original_photoID_crosssource_reuse_audit_v1'
          assert a['new_original_tier08_real_photo_attempts_before_exact_photo_dedup']==910
          assert a['new_original_tier08_real_numeric_roi9_before_dedup']==330
          assert a['new_original_tier08_photo_attempts_after_exact_photo_dedup']+a['cross_source_photo_ID_overlap']['exact_photo_in_at_least_one_previous_arm']==910
          assert a['strict_site_support_before']['strict_cell_years']==43
          assert not a['original_numerical_photo_unknowns_not_cast_to_white'] is False
          print('ALAN_TIER08_AFTER_HISTORICAL_NEW_TWO_TIERS_PHOTO_ID_DEDUP_VERIFIED',
                a,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-tier08-910-source-only-priorall-photoid-overlap-recheck
          path: tier08_photoid_crosssource_audit/
          retention-days: 90
          if-no-files-found: warn
