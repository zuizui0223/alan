name: ALAN genuine Korean island moth 17-year pre-survey PCNL geospatial join
on:
  push:
    branches: [analysis/alan-korean-island-real-moth-nightlight-20261110]
    paths:
      - scripts/analysis/alan_korean_moth_prior_year_pcnl_17year_20261110.py
      - tests/test_alan_korean_moth_prior_year_pcnl_20261110.py
      - .github/workflows/alan-korean-moth-17year-prior-PCNL-source.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-and-chronology-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 rasterio==1.4.3 openpyxl==3.1.5
          python -m unittest discover -s tests -p test_alan_korean_moth_prior_year_pcnl_20261110.py -v
          python -m py_compile scripts/analysis/alan_korean_moth_prior_year_pcnl_17year_20261110.py
  original-PCNL-year-shard:
    needs: source-and-chronology-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GDAL_CACHEMAX: '128'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 rasterio==1.4.3 openpyxl==3.1.5
          python -m scripts.analysis.alan_korean_moth_prior_year_pcnl_17year_20261110 worker \
            --shard ${{ matrix.shard }} --out real-PCNL-shard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-korean-actual-priorpcnl-shard-${{ matrix.shard }}
          path: |
            real-PCNL-shard/*.csv.gz
            real-PCNL-shard/*.json
          retention-days: 90
          if-no-files-found: warn
  full-actual-site-year-join:
    needs: [source-and-chronology-tests, original-PCNL-year-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 rasterio==1.4.3 openpyxl==3.1.5
      - name: Verify all four independent annual-source shard artifacts
        run: |
          set -euo pipefail
          mkdir -p downloaded joined_shards
          gh run download "$GITHUB_RUN_ID" --repo zuizui0223/alan \
            --pattern 'alan-korean-actual-priorpcnl-shard-*' --dir downloaded
          test "$(find downloaded -name 'korean_moth_true_prior_year_pcnl_shard?.csv.gz' | wc -l)" -eq 4
          test "$(find downloaded -name 'korean_moth_true_prior_year_pcnl_shard?.json' | wc -l)" -eq 4
          find downloaded -name 'korean_moth_true_prior_year_pcnl_shard?.csv.gz' -exec cp {} joined_shards/ \;
          find downloaded -name 'korean_moth_true_prior_year_pcnl_shard?.json' -exec cp {} joined_shards/ \;
          python -m scripts.analysis.alan_korean_moth_prior_year_pcnl_17year_20261110 collect \
            --root joined_shards --out actual_30island_17year_PCNL
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("actual_30island_17year_PCNL/korean_30island_prior_PCNL_complete_source_receipt.json")
          r=json.loads(p.read_text())
          assert r["original_survey_site_years"]==377
          assert r["original_distinct_islands"]==30
          assert r["not_sameyear_future_exposure"]
          print("ALAN_TRUE_17YEAR_ISLAND_MOTH_PCNL_REPLAY",json.dumps(r,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-korea-moths-377siteyears-authentic-prior-PCNL-complete
          path: actual_30island_17year_PCNL/
          retention-days: 90
          if-no-files-found: warn
