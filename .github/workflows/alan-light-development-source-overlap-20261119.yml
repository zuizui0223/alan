name: ALAN light vs development matching source audit

on:
  push:
    branches:
      - analysis/alan-light-vs-development-overlap-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-matched-common-support:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed numerical requirements
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
      - name: Test outcome-blind matching
        run: python -m unittest discover -s tests -p test_alan_light_development_overlap_20261119.py -v
      - name: Match light change at similar development and assess overlap
        run: |
          python scripts/analysis/alan_light_development_overlap_20261119.py \
            --out /tmp/alan_light_development_overlap_20261119.json
      - name: Save numerical source evidence
        uses: actions/upload-artifact@v4
        with:
          name: alan-light-development-source-overlap
          path: /tmp/alan_light_development_overlap_20261119.json
          retention-days: 30
