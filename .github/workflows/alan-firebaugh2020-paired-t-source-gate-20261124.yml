name: ALAN Firebaugh 2020 paired plot density source t3 audit

on:
  push:
    branches: [analysis/alan-arthropod-search-expansion-20261122]
    paths:
      - 'database/alan_experiments/arthropod_expansion_20261122/cross_programme/firebaugh2020_paired_t_source_gate_20261124.py'
      - 'tests/test_alan_firebaugh2020_paired_t_source_gate_20261124.py'
      - '.github/workflows/alan-firebaugh2020-paired-t-source-gate-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-reported-four-plot-pair-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject two years or individual arthropods as additional lighting replicates
        run: python -m unittest discover -s tests -p test_alan_firebaugh2020_paired_t_source_gate_20261124.py -v
      - name: Recover only the reported four-pair differences and uncertainty from rounded author statistics
        run: |
          python database/alan_experiments/arthropod_expansion_20261122/cross_programme/firebaugh2020_paired_t_source_gate_20261124.py \
            --output results/alan_firebaugh2020_paired_t_source_audit_20261124.json
      - name: Retain author summary reconstruction, not raw individual data
        uses: actions/upload-artifact@v4
        with:
          name: alan-firebaugh2020-four-pair-source-audit
          path: results/alan_firebaugh2020_paired_t_source_audit_20261124.json
