name: ALAN verify and finalize all 34m original moth-linked photo IDs from prior 16 succeeded groups
on:
  push:
    branches: [analysis/alan-full93m-moth-positive-original-photo-IDs-extraction-20261109]
    paths: [.github/workflows/alan-full93m-moth-original-photoids-collector-only.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect-only-previous-16-successful-source-groups:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install and validate collector import only (do not download RGB / rerun 16 groups)
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3
          python -m py_compile scripts/acquisition/alan_full93m_extract_GloBI_moth_positive_original_photoIDs_20261109.py
          python -m unittest discover -s tests -p test_alan_full93m_extract_GloBI_moth_positive_original_photoIDs_20261109.py -v
      - name: Restore original source-only receipts from all 16 completed SHA-checked photo-ID extraction groups
        run: |
          set -euo pipefail
          mkdir -p receipts
          gh run download 42608966731 --repo zuizui0223/alan --pattern "alan-moth-full93m-extracted-receipt-group-*" --dir receipts
          test "$(find receipts -name 'original_moth_photoID_group??_verified_receipt.json' | wc -l)" -eq 16
          python -m scripts.acquisition.alan_full93m_extract_GloBI_moth_positive_original_photoIDs_20261109 collect --receipts $(find receipts -name 'original_moth_photoID_group??_verified_receipt.json' | sort) --out verified
      - name: Strictly assert 93,209,351 source photos, 34,346,428 moth-positive IDs, all 224 14x16 signed outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('verified/ALAN_full93m_moth_positive_all_original_photo_IDs_recovered_manifest.json').read_text())
          assert x['original_all_photo_IDs_exactly_inspected']==93209351
          assert x['moth_positive_all_original_photo_IDs_verified_and_materialized']==34346428
          assert x['source_group_receipts_completed']==16
          assert x['source_photo_tiers_verified']==224
          assert x['original_colour_ROI9_measured']==0
          assert x['raw_original_RGB_images_downloaded']==0
          print('ALAN_FULL93M_MOTH_ALL34346428_ORIGINAL_PHOTO_ID_SOURCE_PROVEN',x,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-93m-34346428-moth-visited-original-photo-ID-global-final-manifest
          path: verified/
          retention-days: 90
          if-no-files-found: warn
