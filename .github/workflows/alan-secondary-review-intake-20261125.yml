name: ALAN secondary review bibliography source gate
on:
  push:
    branches: [analysis/biotic-aquatic-visitor-support-20261124]
    paths:
      - scripts/analysis/alan_secondary_review_crosswalk_20261125.py
      - .github/workflows/alan-secondary-review-intake-20261125.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        source: [czarnecka, seymoure]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/analysis/alan_lewanzik_cluster_bounds_20261125.py
      - run: python scripts/analysis/alan_secondary_review_crosswalk_20261125.py --source ${{ matrix.source }} --fetch --out /tmp/review-intake
      - name: Upload source receipt and bibliography crosswalk if verified
        uses: actions/upload-artifact@v4
        with:
          name: review-intake-${{ matrix.source }}
          path: /tmp/review-intake/
          retention-days: 30
