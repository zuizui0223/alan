name: ALAN A Knop2017 original Extended Data Table3 public PDF audit
on:
  push:
    branches:
      - analysis/alan-floral-timing-dependence-20261115
    paths:
      - scripts/analysis/alan_A_knop_exttable3_pdf_check_20261115.py
      - tests/test_alan_A_knop_exttable3_pdf_check_20261115.py
      - .github/workflows/alan-A-knop2017-exttable3-audit-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text layer reader
        run: python -m pip install PyMuPDF==1.24.14
      - name: Validate source extractor and bounds
        run: python -m unittest discover -s tests -p 'test_alan_A_knop_exttable3_pdf_check_20261115.py' -v
      - name: Source-verify true original nature coefficient layout through public archive
        run: python scripts/analysis/alan_A_knop_exttable3_pdf_check_20261115.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-A-Knop2017-ExtendedDataTable3-source-receipt
          path: results/alan_A_knop2017_exttable3_public_pdf_receipt_20261115.json
          if-no-files-found: ignore
          retention-days: 30
