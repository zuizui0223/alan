name: ALAN true NPMS plant cover changes versus actual prior-year nighttime light
on:
  push:
    branches: [analysis/alan-npms-glopl-pl-observation-support-20261110]
    paths:
      - scripts/analysis/alan_npms_recorded_cover_vs_priorPCNL_plot_FE_20261110.py
      - tests/test_alan_npms_recorded_cover_prior_PCNL_FE_20261110.py
      - .github/workflows/alan-npms-true-positive-cover-priorPCNL-FE.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-NPMS-original-positive-cover-within-plot-FE:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify fixed-effect implementation and source-positive observation semantics
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          python -m py_compile scripts/analysis/alan_npms_recorded_cover_vs_priorPCNL_plot_FE_20261110.py
          python -m unittest discover -s tests -p test_alan_npms_recorded_cover_prior_PCNL_FE_20261110.py -v
      - name: Restore authentic NPMS method-season recorded-cover source with original DOMIN and annual prior PCNL
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download 42815428180 --repo zuizui0223/alan \
            --name alan-real-NPMS-sameplot-sameprotocol-positive-cover-pastlight-source \
            --dir source
          test -s source/NPMS_source_positive_comparable_plant_cover_plot_method_season_year.csv.gz
          test -s source/NPMS_2015to2025_repeated_plot_method_season_alanchanging_cover_source_receipt.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=Path('source/NPMS_source_positive_comparable_plant_cover_plot_method_season_year.csv.gz')
          b=json.loads(Path('source/NPMS_2015to2025_repeated_plot_method_season_alanchanging_cover_source_receipt.json').read_text())
          assert b['source_original_positive_cover_table_SHA256']==hashlib.file_digest(open(a,'rb'),'sha256').hexdigest()
          assert b['source_CRC_pinned_DOMIN_midPoint_unit']=="fraction of cover [0,1], not percent [0,100]"
          assert b['source_2015to2025_same_surveyID_season_eligible_unique_plots']==1203
          print('ALAN_REAL_NPMS_POSITIVE_COVER_YEAR_SRC_SHA_VERIFIED',flush=True)
          PY
      - name: Restore independent 2018 GloPL source for original species-level study history only
        run: |
          set -euo pipefail
          curl -L --fail --show-error --retry 3 --max-time 420 \
            https://raw.githubusercontent.com/idiv-biodiversity/pollen-limitation-data-descriptor/abbe193770981b2c61713e75a0f01e004bdded8e/Output/GloPL.csv \
            -o source/GloPL_original.csv
          echo '264ca8c2237f126b3c209fcba039e19b291324ddf6e7a96992dc8235a55984de  source/GloPL_original.csv' | sha256sum -c -
      - name: Estimate genuine source-positive plant cover change with original location-species, year and date controls
        timeout-minutes: 55
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_npms_recorded_cover_vs_priorPCNL_plot_FE_20261110 \
            --source source/NPMS_source_positive_comparable_plant_cover_plot_method_season_year.csv.gz \
            --receipt source/NPMS_2015to2025_repeated_plot_method_season_alanchanging_cover_source_receipt.json \
            --glopl source/GloPL_original.csv \
            --out analysis/NPMS_true_plant_positive_cover_vs_priorPCNL_2015to25.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('analysis/NPMS_true_plant_positive_cover_vs_priorPCNL_2015to25.json').read_text())
          assert a['source_primary_eligibility']['source_true_independent_NPMS_plots']>0
          assert a['source_primary_eligibility']['source_true_source_panel_plot_species_method_season_groups']>0
          assert a['source_original_plant_species_absence_not_imputed_from_nonrecord']
          assert a['not_measured_real_moth_pollination_or_causal_plant_decline']
          print('ALAN_TRUE_NPMS_REPEAT_COVER_ALAN_SOURCE_MODEL_VALIDATED',
                json.dumps({'source':a['source_primary_eligibility'],
                  'main':a['original_five_model_specifications_and_sampling_robustness'][
                    'primary_original_cover_percentage_pp_source_plot_equal_with_species_year_FE'],
                  'light_spans':a['source_light_range_sensitivity'],
                  'GloPL':a['external_GloPL_study_replication_scope']},
                sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-actual-NPMS-plant-sourcepositive-cover-vs-preALAN-two-way-FE
          path: analysis/NPMS_true_plant_positive_cover_vs_priorPCNL_2015to25.json
          if-no-files-found: warn
          retention-days: 90
