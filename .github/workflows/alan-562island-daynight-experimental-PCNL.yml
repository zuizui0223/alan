name: ALAN real day-night reproductive experiments vs historical light across 562 islands
on:
  push:
    branches: [analysis/alan-real-diel-functional-PCNL-global562-20261113]
    paths:
      - scripts/analysis/alan_real_daynight_reproductive_PCNL_562_20261113.py
      - tests/test_alan_real_daynight_reproductive_PCNL_562_20261113.py
      - .github/workflows/alan-562island-daynight-experimental-PCNL.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 geopandas==1.1.2 shapely==2.1.2 requests==2.32.3
          python -m py_compile scripts/analysis/alan_real_daynight_reproductive_PCNL_562_20261113.py
          python -m unittest discover -s tests -p test_alan_real_daynight_reproductive_PCNL_562_20261113.py -v
  actual-source-macro:
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore 85,318 original 33-year PCNL eligible island sites, exact immutable GloBI
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          mkdir -p source/pcnl source/globi original_batches raw groups
          gh run download 42624285048 --repo zuizui0223/alan --name alan-full93m-actual-PCNL1992-2024-moth-positive-macro --dir source/pcnl
          echo '440a8313d71168e0a4dfd2f41a7bef45623abb068b07e3282026f1c35dccbd2c  source/pcnl/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz' | sha256sum -c -
          gh run download 41976552977 --repo zuizui0223/mois --name mois-ALAN-GloBI-stage2-actual-records-2019-2024-supported-source --dir source/globi
          echo 'a6b97aa0941215d2f645e4c4fbf19490492b93680a7d7c0502814c7a66902994  source/globi/GloBI_stage2_signed_extension.csv.gz' | sha256sum -c -
          gh run download 42616279235 --repo zuizui0223/alan --pattern 'alan-93m-fullflora-moth-island-group-*' --dir original_batches
          test "$(find original_batches -name 'allflora-island-group-??.sqlite' | wc -l)" -eq 16
          test "$(find original_batches -name 'allflora-island-group-??.json' | wc -l)" -eq 16
          find original_batches -name 'allflora-island-group-??.sqlite' -exec cp {} groups/ \;
          find original_batches -name 'allflora-island-group-??.json' -exec cp {} groups/ \;
      - name: Restore original independently published day/night exclusion experimental data
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/liamkendall/bumble-bat.git original_diel
          test "$(git -C original_diel hash-object data/DvN_LiteratureDataClean_2024-09-13.csv)" = 39a82d966afcdde670603add1c881ace8791ffe9
          test "$(git -C original_diel hash-object data/SppTraitData_clean.csv)" = 18381e550a7e405fe4f198909f0bb381bbecf1e0
          echo 'ORIGINAL_DIEL_AUTHOR_BLOBS_VERIFIED'
      - name: Source-back original reproductive day versus night treatment effects and island light
        timeout-minutes: 65
        run: |
          set -euo pipefail
          mkdir -p verified_function
          python -m scripts.analysis.alan_real_daynight_reproductive_PCNL_562_20261113 \
            --sites source/pcnl/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz \
            --globi source/globi/GloBI_stage2_signed_extension.csv.gz \
            --groups groups \
            --study original_diel/data/DvN_LiteratureDataClean_2024-09-13.csv \
            --traits original_diel/data/SppTraitData_clean.csv \
            --out verified_function/alan_562island_diel_reproduction_priorPCNL_20261113.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('verified_function/alan_562island_diel_reproduction_priorPCNL_20261113.json')
          x=json.loads(p.read_text())
          assert x["source"]["islands"] == 562
          assert x["source"]["observed_site_years"] == 77647
          assert x["source"]["photo_species_site_years"] == 2012925
          assert x["study_source"]["original_day_night_study_species_metric_pairs"]==262
          assert x["no_causal_or_moth_claim"]["night_day_exclusion_not_specific_to_moths"]
          print("ALAN_REAL_SOURCE_DIEL_REPRODUCTIVE_FUNCTION_PCNL_562_COMPLETE",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-global562-real-daynight-functional-PriorPCNL-20261113
          path: verified_function/
          retention-days: 90
          if-no-files-found: warn
