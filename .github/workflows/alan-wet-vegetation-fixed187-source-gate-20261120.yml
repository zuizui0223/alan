name: ALAN fixed wetland vegetation source-coverage gate
on:
  push:
    branches: [analysis/alan-light-vs-development-overlap-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-vegetation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned analysis requirements
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
      - name: Run synthetic source and no-rematching tests
        run: python -m unittest discover -s tests -p test_alan_wet_vegetation_identical_pairs_20261120.py -v
      - name: Execute fixed-187 original wetland vegetation coverage
        run: python scripts/analysis/alan_wet_vegetation_identical_pairs_20261120.py --out /tmp/wet_vegetation.json
      - name: Archive signed vegetation support report
        uses: actions/upload-artifact@v4
        with:
          name: alan-wet-vegetation-original-source-gate
          path: /tmp/wet_vegetation.json
          retention-days: 30
