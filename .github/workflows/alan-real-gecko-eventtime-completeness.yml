name: ALAN genuine 2026-08 gecko skink event-time completeness source audit
on:
  push:
    branches: [analysis/alan-gecko-reptile-detection-controlled-20261110]
    paths:
      - scripts/acquisition/alan_gbif_reptile_actual_eventtime_completeness_20261110.py
      - .github/workflows/alan-real-gecko-eventtime-completeness.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-authenticated-reptile-diel-metadata-availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source original schema and read only time/date/taxon quality
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==21.0.0 \
            scipy==1.15.2 rasterio==1.4.3 geopandas==1.1.2 \
            shapely==2.1.2 pyproj==3.7.2 statsmodels==0.14.5
          python -m py_compile scripts/acquisition/alan_gbif_reptile_actual_eventtime_completeness_20261110.py
          mkdir -p source
          gh run download 42790214757 --repo zuizui0223/alan \
            --name alan-original-202608-gecko-reptile-Parquet-partition-manifest \
            --dir source
          python -m scripts.acquisition.alan_gbif_reptile_actual_eventtime_completeness_20261110 \
            --manifest source/gbif_202608_reptile_gecko_partition_manifest.json \
            --out original-clock/ALAN_original_gecko_scink_actual_record_eventtime_support.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('original-clock/ALAN_original_gecko_scink_actual_record_eventtime_support.json').read_text())
          assert d['source_Squamata_all_basis_all_year_rows_read']==11634053
          assert d['field_completeness_is_NOT_gecko_lamp_visitation_or_predation']
          assert d['event_time_hhmm_without_timezone_is_not_verified_local_solar_time']
          print('ALAN_REAL_GECKO_TIMESTAMPS_UNVERIFIED_LOCAL_TIME',json.dumps(
             d['source_family_and_genus_photo_eventtime_completeness'],sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-real-gecko-and-skink-GBIF-202608-eventTime-completeness
          path: original-clock/ALAN_original_gecko_scink_actual_record_eventtime_support.json
          retention-days: 90
          if-no-files-found: warn
