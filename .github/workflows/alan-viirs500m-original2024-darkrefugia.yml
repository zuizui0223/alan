name: ALAN authentic 500m VIIRS 2024 versus 1km PCNL dark refuge spatial audit
on:
  push:
    branches: [analysis/alan-viirs500m-darkrefugia-resolution-20261110]
    paths:
      - scripts/analysis/alan_viirs2024_500m_darkrefugia_source_20261110.py
      - tests/test_alan_viirs500m_dark_refugia_20261110.py
      - .github/workflows/alan-viirs500m-original2024-darkrefugia.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-original-VIIRS500m-landmasked-photo-island-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GDAL_CACHEMAX: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Unit tests for sub-kilometer geometry and original source contracts
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 \
            rasterio==1.4.3 geopandas==1.1.2 shapely==2.1.2 pyproj==3.7.2 statsmodels==0.14.5
          python -m py_compile scripts/analysis/alan_viirs2024_500m_darkrefugia_source_20261110.py
          python -m unittest discover -s tests -p test_alan_viirs500m_dark_refugia_20261110.py -v
          python -m unittest discover -s tests -p test_alan_dark_refugia_local_pcnl_20261110.py -v
      - name: Restore true old PCNL site coordinates and original GSHHG SHA-verified polygons
        run: |
          set -euo pipefail
          mkdir -p source/old source/coast source/viirs
          gh run download 42764291562 --repo zuizui0223/alan \
            --name alan-2025-true-island-2024PCNL-dark-refugia-landmasked-pilot \
            --dir source/old
          gh run download 42175243391 --repo zuizui0223/mois \
            --name mois-GSHHG-2.3.7-high-L1-L2-SHA-source-no-images \
            --dir source/coast
          test -s source/old/real_original_island_dark_refugia_2025_photo_sites_PCNL2024.csv.gz
          test -s source/old/dark_refugia_original_real_source_receipt.json
          test -s source/coast/source_receipt.json
          test -s source/coast/GSHHS_h_L1.shp
          test -s source/coast/GSHHS_h_L2.shp
          echo '32327abb37ee85f3d1d9e7446d9d742fb5adf1457dab60fae1aae791c29f7837  source/old/real_original_island_dark_refugia_2025_photo_sites_PCNL2024.csv.gz' | sha256sum -c -
      - name: Acquire one published actual 2024 OpenGeoHub 500m VIIRS VNL V2.2 COG
        timeout-minutes: 20
        run: |
          set -euo pipefail
          FILE='nightlights.average_viirs.v21_m_500m_s_20240101_20241231_go_epsg4326_v20250904.tif'
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 35 --max-time 650 \
            "https://zenodo.org/records/17294744/files/nightlights.average_viirs.v21_m_500m_s_20240101_20241231_go_epsg4326_v20250904.tif?download=1" \
            --output "source/viirs/nightlights.average_viirs.v21_m_500m_s_20240101_20241231_go_epsg4326_v20250904.tif"
          echo "0b976892d40c2d0d99177c727289eaf2  source/viirs/nightlights.average_viirs.v21_m_500m_s_20240101_20241231_go_epsg4326_v20250904.tif" | md5sum -c -
          python - <<'PY'
          import rasterio
          from pathlib import Path
          p=next(Path('source/viirs').glob("*.tif"))
          with rasterio.open(p) as s:
              assert s.crs.to_epsg()==4326 and s.count==1
              assert 0<abs(s.res[0])<=.007 and 0<abs(s.res[1])<=.007
              print("ALAN_TRUE_2024_VIIRS_500M_ORIGINAL_PIXEL_GEOMETRY", s.width,s.height,
                    s.res,s.scales,s.offsets,s.nodata,s.tags(),flush=True)
          PY
      - name: Compare original 2025 island 5km satellite pixel landscapes at 500m and ~1km
        timeout-minutes: 55
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_viirs2024_500m_darkrefugia_source_20261110 \
            --coarse source/old/real_original_island_dark_refugia_2025_photo_sites_PCNL2024.csv.gz \
            --coarse-receipt source/old/dark_refugia_original_real_source_receipt.json \
            --coast source/coast \
            --raster source/viirs/nightlights.average_viirs.v21_m_500m_s_20240101_20241231_go_epsg4326_v20250904.tif \
            --out genuine_viirs500m_original_island_source
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('genuine_viirs500m_original_island_source/viirs500m_vs_pcnl1km_actual_source_receipt.json')
          d=json.loads(p.read_text())
          assert d['source_original_photo_sites_attempted']==4728
          assert d['source_original_2024_PCNL_valid_sites']==3543
          assert d['2024_VIIRS500m_threshold_results']['0.0']['n_valid_original_500m_sites']>0
          assert d['no_genuine_moth_abundance_pollen_delivery_plant_seed_set_effect_tested']
          assert d['coarse_and_fine_different_satellite_products_not_resolution_only']
          print("ALAN_GENUINE_VIIRS500M_ACTUAL_ORIGINAL_ISLAND_SOURCE_VERIFIED",
                json.dumps(d,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-genuine-2024-viirs500m-vs-1km-PCNL-island-dark-refugia-sites
          path: genuine_viirs500m_original_island_source/
          if-no-files-found: warn
          retention-days: 90
