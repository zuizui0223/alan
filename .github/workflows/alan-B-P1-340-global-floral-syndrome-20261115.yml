name: ALAN B global 340 real diel functional dependence vs bloom time and flower shape
on:
  push:
    branches:
      - analysis/alan-floral-timing-dependence-20261115
    paths:
      - scripts/analysis/alan_B_P1_original_syndrome_functional_20261115.py
      - tests/test_alan_B_P1_original_syndrome_functional_20261115.py
      - .github/workflows/alan-B-P1-340-global-floral-syndrome-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source exploration dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Verify source matching and stage-comparison guards
        run: python -m unittest discover -s tests -p 'test_alan_B_P1_original_syndrome_functional_20261115.py' -v
      - name: Reanalyse author SHA-pinned 1652 treatment rows with source floral traits
        run: python scripts/analysis/alan_B_P1_original_syndrome_functional_20261115.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-B-P1-340-global-original-floral-syndrome-source
          path: results/alan_B_P1_global_floral_syndrome_functional_v_20261115.json
          retention-days: 30
