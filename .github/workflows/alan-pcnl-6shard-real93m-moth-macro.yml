name: ALAN verified 33-year PCNL source recovery and within-island moth-flora macro
on:
  pull_request:
    branches: [analysis/alan-island-pollinator-shift-gated-20261109]
    paths:
      - .github/workflows/alan-pcnl-6shard-real93m-moth-macro.yml
      - scripts/analysis/alan_pcnl_verified_sharded_join_20261109.py
      - tests/test_alan_pcnl_verified_sharded_join_20261109.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 rasterio==1.4.3 scipy==1.15.2
          python -m unittest discover -s tests -p test_alan_pcnl_verified_sharded_join_20261109.py -v
          python -m unittest discover -s tests -p test_alan_full93m_moth_PCNLPrior_two_way_FE_20261109.py -v
  year-shard:
    needs: source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      GDAL_CACHEMAX: '512'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 rasterio==1.4.3 scipy==1.15.2
          mkdir -p source
          gh run download 42617624954 --repo zuizui0223/alan --name alan-full93m-moth-fullflora-33year-PCNL-prior-light --dir source
          echo 'e7800476ae6d35acb9ef71525f32521596f884733e2e8ee9f87fda7acb8e9eab  source/valid_original_photo_site_years.csv' | sha256sum -c -
      - name: Download and source-check only five or six annual PCNL rasters; sample real island cells
        timeout-minutes: 85
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_pcnl_verified_sharded_join_20261109 worker \
            --source source/valid_original_photo_site_years.csv \
            --manifest config/alan_pcnl_1992_2024_zenodo_v3_md5.json \
            --shard ${{ matrix.shard }} --raster-dir annual --out partial
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: alan-pcnl-real-year-shard-${{ matrix.shard }}
          path: partial/
          retention-days: 90
          if-no-files-found: error
  real-model:
    needs: [source-tests, year-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          mkdir -p source downloads shardparts
          gh run download 42617624954 --repo zuizui0223/alan --name alan-full93m-moth-fullflora-33year-PCNL-prior-light --dir source
          echo 'e7800476ae6d35acb9ef71525f32521596f884733e2e8ee9f87fda7acb8e9eab  source/valid_original_photo_site_years.csv' | sha256sum -c -
          gh run download "$GITHUB_RUN_ID" --repo zuizui0223/alan --pattern 'alan-pcnl-real-year-shard-*' --dir downloads
          test "$(find downloads -name 'pcnl_shard_?.json' | wc -l)" -eq 6
          find downloads -name 'pcnl_shard_?.json' -exec cp {} shardparts/ \;
          find downloads -name 'pcnl_shard_?.csv.gz' -exec cp {} shardparts/ \;
          python -m scripts.analysis.alan_pcnl_verified_sharded_join_20261109 collect \
            --source source/valid_original_photo_site_years.csv \
            --parts shardparts --out joined
          python -m scripts.analysis.alan_full93m_moth_PCNLPrior_two_way_FE_20261109 \
            --joined joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz \
            --out observed-model
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('joined/real_pcnl_join_receipt.json').read_text())
          r=json.loads(Path('observed-model/ALAN_full93m_moth_GloBI_prior_PCNL_two_way_FE_result.json').read_text())
          assert s['raster_years_verified']==33 and s['source_site_year_rows']==85318
          assert r['source_rows_before_support']==85318 and r['colour_ROI_not_used']
          print('ALAN_ACTUAL_ALL93M_PCNL33YEAR_MACRO_RESULT',
                json.dumps({'source':s,'model':r},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-full93m-actual-PCNL1992-2024-moth-positive-macro
          path: |
            joined/
            observed-model/
          retention-days: 90
          if-no-files-found: warn
