name: ALAN global moth predator and flower dual-role GloBI v0.11 (source locked)

on:
  push:
    branches: [research/moth-gecko-flora-feasibility-20261111]
    paths: [.github/workflows/alan-globi-v011-predator-flower-roles.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-globi-all-roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze source scanner and test inverse relations
        run: |
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m py_compile scripts/analysis/alan_globi_v011_predator_flower_multirole.py
          python -m unittest discover -s tests -p 'test_alan_globi_v011_predator_flower_multirole.py' -v
      - name: Download SHA-pinned COMPLETE stable v0.11 GloBI interpreted source
        run: |
          mkdir -p full_source
          curl -fL --retry 4 --retry-delay 10 --connect-timeout 30 \
            'https://zenodo.org/records/22691479/files/interactions.csv.gz?download=1' \
            -o full_source/interactions.csv.gz
          echo '670c34b667f0a13d2bfd99edf7a3aa1518b92fa5493614f9dbbcaa0c6821e0c3  full_source/interactions.csv.gz' | sha256sum -c -
      - name: Scan ALL GloBI relations across predator and flower functions
        run: |
          python scripts/analysis/alan_globi_v011_predator_flower_multirole.py \
            --source full_source/interactions.csv.gz \
            --out predator_pollinator_source
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('predator_pollinator_source/summary.json').read_text())
          assert x['source_sha256']=='670c34b667f0a13d2bfd99edf7a3aa1518b92fa5493614f9dbbcaa0c6821e0c3'
          assert x['all_interaction_rows']==24453954
          assert x['source_positive_only_no_absence_inferred']
          assert x['same_species_name_dual_role_not_same_site_or_behavior_event']
          assert x['predation_moth_larva_vs_adult_UNRESOLVED']
          print('GLOBI_V011_PREDATOR_AND_FLOWER_ALL_RELATIONS_SUCCEEDED',json.dumps(
            x['grouped_positive_species_counts'],sort_keys=True))
          PY
      - name: Upload source-limited positive evidence and aggregate counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan-GloBI-v011-predator-moth-flower-multirole-source-verified
          path: predator_pollinator_source/
          retention-days: 60
          if-no-files-found: warn
