name: ALAN independent Sullivan-Ogbeide Chironomidae emergence k2 source meta

on:
  push:
    branches: [analysis/alan-arthropod-search-expansion-20261122]
    paths:
      - 'scripts/analysis/alan_sullivan_ogbeide_chironomid_emergence_meta_20261124.py'
      - 'tests/test_alan_sullivan_ogbeide_chironomid_emergence_meta_20261124.py'
      - 'database/alan_experiments/arthropod_expansion_20261122/chironomid_emergence_20261124/chironomid_emergence_k2_frozen_20261124.json'
      - '.github/workflows/alan-sullivan-ogbeide-chironomid-emergence-k2-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-locked-independent-family-emergence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set identical numerical source parser dependencies
        run: python -m pip install 'numpy==2.2.6' 'scipy==1.15.3'
      - name: Enforce original study boundaries without internet
        run: |
          python -m unittest discover -s tests -p 'test_alan_sullivan2019_chironomid_source_gate_20261124.py' -v
          python -m unittest discover -s tests -p 'test_alan_sullivan_ogbeide_chironomid_emergence_meta_20261124.py' -v
      - name: Source-authenticate 2013 original Dryad TSV and 2022 original RDS-derived flumes, then fit k2
        run: |
          python scripts/analysis/alan_sullivan_ogbeide_chironomid_emergence_meta_20261124.py \
            --frozen database/alan_experiments/arthropod_expansion_20261122/chironomid_emergence_20261124/chironomid_emergence_k2_frozen_20261124.json \
            --output results/alan_sullivan_ogbeide_chironomid_emergence_k2_20261124.json
      - name: Publish only family/block summaries and programme meta, not original author rows
        uses: actions/upload-artifact@v4
        with:
          name: alan-sullivan-ogbeide-chironomid-emergence-source-meta-k2
          path: results/alan_sullivan_ogbeide_chironomid_emergence_k2_20261124.json
