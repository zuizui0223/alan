name: ALAN wet-mechanism candidate evidence gate

on:
  push:
    branches:
      - analysis/alan-wet-mechanism-candidate-triage-20261117
  pull_request:
    paths:
      - 'scripts/analysis/alan_wet_candidate_triage_20261117.py'
      - 'scripts/analysis/alan_wet_species_support_20261117.py'
      - 'scripts/analysis/alan_wet_moisture_missingness_tipping_20261117.py'
      - 'tests/test_alan_wet_candidate_triage_20261117.py'
      - 'tests/test_alan_wet_species_support_20261117.py'
      - 'tests/test_alan_wet_missingness_tipping_20261117.py'
      - 'results/all_species_forest/**'
      - 'docs/ALAN_WET_MECHANISM_CANDIDATE_TRIAGE_20261117.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-source-derived-mechanism-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute fixed source four-species and region summaries
        run: python scripts/analysis/alan_wet_candidate_triage_20261117.py
      - name: Recompute all-3901 species coverage and stratified wetness sensitivity
        run: |
          mkdir -p /tmp/alan_wet_audit
          python scripts/analysis/alan_wet_species_support_20261117.py | tee /tmp/alan_wet_audit/moisture_species_support.json
      - name: Evaluate hypothetical MOIST-missingness sensitivity
        run: python scripts/analysis/alan_wet_moisture_missingness_tipping_20261117.py | tee /tmp/alan_wet_audit/moisture_missingness_tipping.json
      - name: Check all preselected-source, grouping and nonpromotion gates
        run: |
          python -m unittest discover -s tests -p 'test_alan_wet_candidate_triage_20261117.py' -v
          python -m unittest discover -s tests -p 'test_alan_wet_species_support_20261117.py' -v
          python -m unittest discover -s tests -p 'test_alan_wet_missingness_tipping_20261117.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: alan-wet-all3901-species-support
          path: /tmp/alan_wet_audit/*.json
          if-no-files-found: error
          retention-days: 30

  true-original-NPMS-cover-wetness-light:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies and test actual high-dimensional FWL estimator with synthetic fixtures
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          python -m unittest discover -s tests -p test_alan_npms_independent_moisture_priorlight_20261117.py -v
      - name: Restore byte-verified original NPMS 2015-25 positive vegetation cover at repeated plot-years
        run: |
          set -euo pipefail
          mkdir -p /tmp/alan_npms_source
          gh run download 42815428180 --repo zuizui0223/alan --name alan-real-NPMS-sameplot-sameprotocol-positive-cover-pastlight-source --dir /tmp/alan_npms_source
          test -s /tmp/alan_npms_source/NPMS_source_positive_comparable_plant_cover_plot_method_season_year.csv.gz
          test -s /tmp/alan_npms_source/NPMS_2015to2025_repeated_plot_method_season_alanchanging_cover_source_receipt.json
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('/tmp/alan_npms_source')
          z=p/'NPMS_source_positive_comparable_plant_cover_plot_method_season_year.csv.gz'
          r=json.loads((p/'NPMS_2015to2025_repeated_plot_method_season_alanchanging_cover_source_receipt.json').read_text())
          assert hashlib.sha256(z.read_bytes()).hexdigest()==r['source_original_positive_cover_table_SHA256']
          assert r['source_2015to2025_same_surveyID_season_eligible_unique_plots']==1203
          print('NPMS_ORIGINAL_SOURCE_CRC_SHALOCK_CONFIRMED',flush=True)
          PY
      - name: Obtain original European plant moisture indicator data, reject any source drift
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 360 'https://www.sci.muni.cz/botany/juice/NET/sources/EIV_Europe.csv' -o /tmp/alan_npms_source/EIV_Europe.csv
          echo 'ffeb2a5f45c95886625f970734e431098587c65baad7def786d35364a761dbba  /tmp/alan_npms_source/EIV_Europe.csv' | sha256sum -c -
      - name: Fit cohort-blind MOIST × previous-year PCNL positive-cover models with true plot and species-year effects
        timeout-minutes: 40
        run: |
          set -euo pipefail
          python scripts/analysis/alan_npms_independent_moisture_priorlight_20261117.py \
            --source /tmp/alan_npms_source/NPMS_source_positive_comparable_plant_cover_plot_method_season_year.csv.gz \
            --receipt /tmp/alan_npms_source/NPMS_2015to2025_repeated_plot_method_season_alanchanging_cover_source_receipt.json \
            --eiv /tmp/alan_npms_source/EIV_Europe.csv \
            --out /tmp/alan_npms_source/alan_npms_moisture_20261117_aggregate.json
      - name: Inspect supported and unsupported results without selecting coefficient signs
        if: success()
        run: |
          python - <<'PY'
          import json
          p='/tmp/alan_npms_source/alan_npms_moisture_20261117_aggregate.json'
          r=json.load(open(p))
          assert r['schema']=='alan_npms_moisture_alan_independent_plant_cover_v1'
          assert r['source']['original_source_rows']==61555
          assert r['endpoint'].startswith('DOMIN measured positive cover')
          print('ALAN_NPMS_MOISTURE_FULL_SOURCE_MODEL_AUDIT',json.dumps({
            'source':r['source'],
            'eligibility':r['eligibility'],
            'primary':r.get('primary_continuous_moisture',{}).get('coefficients',{}),
            'strict':r.get('strict_moisture',{}).get('coefficients',{}),
            'stops':{k:v for k,v in r.items() if 'stop_reason' in k}
          },sort_keys=True),flush=True)
          PY
      - name: Upload aggregate-only original-model support and results (no NPMS protected plot/plant coordinates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan-npms-true-positive-cover-macro-wetness-original
          path: /tmp/alan_npms_source/alan_npms_moisture_20261117_aggregate.json
          if-no-files-found: warn
          retention-days: 30

  grognuz-source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch original Mendeley dataset metadata and size-limited source files
        run: |
          mkdir -p /tmp/alan_grognuz
          python scripts/acquisition/alan_grognuz2025_original_source_gate.py \
            --inspect-small-public-files --output /tmp/alan_grognuz/original_source_gate.json
      - name: Report genuine published source access or fail-closed missingness
        run: |
          python - <<'PY'
          import json
          p='/tmp/alan_grognuz/original_source_gate.json'
          d=json.load(open(p))
          assert d['schema']=='alan_grognuz2025_original_source_gate_v1'
          assert d['independent_light_installations_are_not_images_or_species']
          print('GROGNUZ_ORIGINAL_SOURCE_GATES',d['status'])
          for r in d.get('source_files',[]):
              print('SOURCE_FILE',r.get('filename'),r.get('source_size_bytes'),
                    r.get('status'),r.get('layout',{}).get('type'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-grognuz-2025-original-flowering-public-source-gate
          path: /tmp/alan_grognuz/original_source_gate.json
          if-no-files-found: warn
          retention-days: 45
