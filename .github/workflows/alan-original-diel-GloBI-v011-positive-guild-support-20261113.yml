name: ALAN original day night reproductive experiment versus full GloBI documented moth butterfly positive evidence
on:
  push:
    branches: [analysis/alan-real-diel-guild-evidence-gate-20261113]
    paths:
      - scripts/analysis/alan_genuine_diel_GloBI_v011_flower_guild_overlap_20261113.py
      - scripts/analysis/alan_original_diel_study_visitor_observation_coverage_20261113.py
      - tests/test_alan_genuine_diel_GloBI_v011_flower_guild_overlap_20261113.py
      - .github/workflows/alan-original-diel-GloBI-v011-positive-guild-support-20261113.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5 scikit-learn==1.6.1
          python -m py_compile scripts/analysis/alan_genuine_diel_GloBI_v011_flower_guild_overlap_20261113.py scripts/analysis/alan_original_diel_study_visitor_observation_coverage_20261113.py
          python -m unittest discover -s tests -p test_alan_genuine_diel_GloBI_v011_flower_guild_overlap_20261113.py -v
  genuine-original-published-experiment-model:
    needs: source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore already MD5-authenticated original 301 field site×year and six REAL annual PCNL shards
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5 scikit-learn==1.6.1
          mkdir -p original_study downloads parts
          gh run download 43379308366 --repo zuizui0223/alan \
            --name alan-true-daynight-study-site-year-experiment-source-20261113 \
            --dir original_study
          echo '21b1fef1beb9e6238cfa47101b991815d4c0f33787b9737f834426dc3bab15af  original_study/original_DvN_field_site_year_outcome_pre_PCNLP.csv.gz' | sha256sum -c -
          gh run download 43380089481 --repo zuizui0223/alan \
            --pattern 'alan-original-DvN-PCNL1992_2021-year-shard-*' \
            --dir downloads
          test "$(find downloads -name 'diel_annual_shard_?.csv.gz' | wc -l)" -eq 6
          test "$(find downloads -name 'diel_annual_shard_?.json' | wc -l)" -eq 6
          find downloads -name 'diel_annual_shard_?.csv.gz' -exec cp {} parts/ \;
          find downloads -name 'diel_annual_shard_?.json' -exec cp {} parts/ \;
          git clone -q --depth 1 https://github.com/liamkendall/bumble-bat.git original_author
          test "$(git -C original_author hash-object data/SppTraitData_clean.csv)" = 18381e550a7e405fe4f198909f0bb381bbecf1e0
      - name: Rejoin the 30 exact original annual PCNL samples without redownloading 30 original GeoTIFFs
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_authentic_diel_siteyear_PCNL_6shards_20261113 collect \
            --source original_study/original_DvN_field_site_year_outcome_pre_PCNLP.csv.gz \
            --receipt original_study/original_DvN_source_year_geo_repro_audit.json \
            --partialdir parts --out original_rejoined
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          file=Path('original_rejoined/Diel_original_daynight_reproductive_1993_2022_priorPCNL1992_2021.csv.gz')
          receipt=json.loads(Path('original_rejoined/Diel_original_priorPCNL_source_receipt.json').read_text())
          actual=hashlib.sha256(file.read_bytes()).hexdigest()
          assert receipt['joined_file_sha256']==actual
          assert receipt['original_source_sha256']=='21b1fef1beb9e6238cfa47101b991815d4c0f33787b9737f834426dc3bab15af'
          assert receipt['annual_rasters_MD5_source_verified']==30 and receipt['source_pairs_full_pre_experiment_PCNL']==301
          print('ORIGINAL_EXPOSURE_CONTENT_IDENTICAL_BY_SOURCE_AND_30_YEAR_MANIFEST',actual)
          PY
      - name: Restore original 24.45-million GloBI v0.11 complete flower-interaction positive source
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p original_GloBI
          gh run download 42924993614 --repo zuizui0223/alan \
            --name alan-GloBI-v011-full-source-moth-plant-positive-flags \
            --dir original_GloBI
          echo 'cf750192b4d641a2d904f4f74d5b87d41fc97e04822a67c513d9bad74ece8e01  original_GloBI/GloBI_v011_positive_species_flags.csv.gz' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('original_GloBI/source_receipt.json').read_text())
          assert x['status']=='FULL_GLOBI_V011_SOURCE_COMPLETE'
          assert x['sha256']=='670c34b667f0a13d2bfd99edf7a3aa1518b92fa5493614f9dbbcaa0c6821e0c3'
          assert x['all_interaction_rows']==24453954
          assert x['qualified_flower_interaction_rows']==64316
          assert x['georeferenced_and_dated_rows']=={'moth':0,'butterfly':0}
          assert x['missing_GloBI_not_pollinator_absence']
          print('ORIGINAL_V011_COMPLETE_LEPIDOPTERA_POSITIVE_SOURCE_NONLOCAL_CANNOT_BE_SITE_YEAR_POLLINATION')
          PY
      - name: Audit original SAME field year nighttime reproductive function and independent guild positive evidence
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p audited_source_guilds
          python -m scripts.analysis.alan_genuine_diel_GloBI_v011_flower_guild_overlap_20261113 \
            --joined original_rejoined/Diel_original_daynight_reproductive_1993_2022_priorPCNL1992_2021.csv.gz \
            --receipt original_rejoined/Diel_original_priorPCNL_source_receipt.json \
            --author_trait original_author/data/SppTraitData_clean.csv \
            --globi_flags original_GloBI/GloBI_v011_positive_species_flags.csv.gz \
            --globi_receipt original_GloBI/source_receipt.json \
            --out audited_source_guilds/ALAN_original301_diel_reproduction_GloBI_full_v011_guild_support_20261113.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('audited_source_guilds/ALAN_original301_diel_reproduction_GloBI_full_v011_guild_support_20261113.json').read_text())
          assert x['status']=='REAL_301_EXPERIMENT_GLOBI_24M_SOURCE_GUILD_OVERLAP_AUDITED_NOT_CAUSAL'
          assert x['source']['original_paired_day_night_reproductive_site_year_metrics']==301
          assert x['source']['real_source_plant_species_exactly_matched_visitor_positive_GloBI']==23
          assert x['source']['original_GloBI_source_georeferenced_AND_event_dated_moth_flower_rows']==0
          assert x['source']['original_GloBI_source_georeferenced_AND_event_dated_butterfly_flower_rows']==0
          assert x['strict_functional_conclusion']['no_biological_absence_from_missing_source']
          print('ACTUAL_ORIGINAL_301_MOTH_BUTTERFLY_SOURCE_FUNCTION_SUPPORT_VERIFIED')
          PY
      - name: Original study included actual field pollinator observation? Audit author source flag independently
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(git -C original_author hash-object data/DvN_LiteratureDataClean_2024-09-13.csv)" = 39a82d966afcdde670603add1c881ace8791ffe9
          python -m scripts.analysis.alan_original_diel_study_visitor_observation_coverage_20261113 \
            --joined original_rejoined/Diel_original_daynight_reproductive_1993_2022_priorPCNL1992_2021.csv.gz \
            --receipt original_rejoined/Diel_original_priorPCNL_source_receipt.json \
            --author_study original_author/data/DvN_LiteratureDataClean_2024-09-13.csv \
            --globi_flags original_GloBI/GloBI_v011_positive_species_flags.csv.gz \
            --globi_receipt original_GloBI/source_receipt.json \
            --out audited_source_guilds/ALAN_original301_study_pollinator_observation_coverage_20261113.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('audited_source_guilds/ALAN_original301_study_pollinator_observation_coverage_20261113.json').read_text())
          assert x['status']=='AUTHENTIC_PUBLISHED_STUDY_POLLINATOR_OBSERVATION_AVAILABILITY_SCREEN_ONLY'
          assert x['sources']['original_real_field_experiment_pairs']==301
          assert x['sources']['original_140_published_studies_observation_status']=={
            'included_some_observations':111,
            'not_included_in_author_study_source':27,
            'unknown_or_mixed':2}
          assert x['what_is_not_identified']['original_observer_observation_inclusion_does_not_encode_visitor_taxonomic_guild']
          print('ACTUAL_AUTHORS_140_PAPERS_VISITOR_OBSERVATION_INCLUSION_GUILD_TRIAGE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-original301-GloBI-v011-visitor-guild-original-data-gate-20261113
          path: audited_source_guilds/
          retention-days: 90
          if-no-files-found: warn
