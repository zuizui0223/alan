name: ALAN source verified five original-island ROI9 batch reconciliation QA
on:
  push:
    branches: [analysis/alan-batches02to05-originalROI9-20261108]
    paths:
      - .github/workflows/alan-original-island-fivebatch-merge-synthetic-QA.yml
      - scripts/analysis/alan_merge_genuine_new_island_ROI9_first5_batches_20261108.py
      - tests/test_alan_merge_genuine_new_island_ROI9_first5_batches_20261108.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_photo_UUID_and_trueROI9_merge_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify source-original photo UUID and true 3-accepted-taxon ROI9 site thresholds
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m unittest discover -s tests \
            -p test_alan_merge_genuine_new_island_ROI9_first5_batches_20261108.py -v
          python -m py_compile scripts/analysis/alan_merge_genuine_new_island_ROI9_first5_batches_20261108.py
          echo 'ALAN_FIVE_BATCH_GENUINE_ORIGINAL_SOURCE_MERGE_QA_TESTED'
