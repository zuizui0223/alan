name: ALAN species-level nightlight source-support and trait overlap
on:
  push:
    branches: [analysis/alan-species-slope-support-count-20261115]
    paths:
      - scripts/analysis/alan_species_slope_support_count_20261115.py
      - .github/workflows/alan-species-slope-support-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  synthetic-source-support-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          python -m py_compile scripts/analysis/alan_species_slope_support_count_20261115.py
          python - <<'PY'
          import pandas as pd
          from scripts.analysis.alan_species_slope_support_count_20261115 import count_at_threshold
          s=[]; f=[]
          for island in ('A','B'):
              for year in (2019,2021):
                  for j in range(10):
                      site=dict(island=island,year=year,latbin=j,lonbin=j)
                      s.append(dict(**site,pcnl_1992_to_previous_year_mean_log1p=.02*j))
                      f.append(dict(**site,species='always'))
                      if j<=5: f.append(dict(**site,species='dark'))
                      if j>=6: f.append(dict(**site,species='lit'))
          taxa=pd.DataFrame({'species':['always','dark','lit'],
              'selfing_hm':['autonomous','absent','autonomous'],
              'selfing_high':['autonomous','absent','autonomous'],
              'diel':['night','day',None]})
          v=count_at_threshold(pd.DataFrame(s),pd.DataFrame(f),taxa,.02)
          assert v['eligible_island_year_strata']==4, v
          assert v['distinct_species_in_eligible_strata']==3, v
          assert v['by_trait_evidence']['all_observed']['matched_species']==3
          assert v['by_trait_evidence']['experimental_diel']['matched_species']==2
          assert v['by_trait_evidence']['all_observed']['screen']==2, v
          assert v['by_trait_evidence']['all_observed']['core']==0, v
          print('ALAN_SYNTHETIC_SUPPORT_GATES_PASS')
          PY
  authentic-source-census:
    needs: synthetic-source-support-test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: \${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original signed historical-light and full floral source
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          mkdir -p source/pcnl source/globi original_batches groups direct_traits original_diel
          gh run download 42624285048 --repo zuizui0223/alan --name alan-full93m-actual-PCNL1992-2024-moth-positive-macro --dir source/pcnl
          echo '440a8313d71168e0a4dfd2f41a7bef45623abb068b07e3282026f1c35dccbd2c  source/pcnl/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz' | sha256sum -c -
          gh run download 41976552977 --repo zuizui0223/mois --name mois-ALAN-GloBI-stage2-actual-records-2019-2024-supported-source --dir source/globi
          echo 'a6b97aa0941215d2f645e4c4fbf19490492b93680a7d7c0502814c7a66902994  source/globi/GloBI_stage2_signed_extension.csv.gz' | sha256sum -c -
          gh run download 42616279235 --repo zuizui0223/alan --pattern 'alan-93m-fullflora-moth-island-group-*' --dir original_batches
          test "$(find original_batches -name 'allflora-island-group-??.sqlite' | wc -l)" -eq 16
          test "$(find original_batches -name 'allflora-island-group-??.json' | wc -l)" -eq 16
          find original_batches -name 'allflora-island-group-??.sqlite' -exec cp {} groups/ \;
          find original_batches -name 'allflora-island-group-??.json' -exec cp {} groups/ \;
      - name: Restore independent measured botanical selfing and day/night outcome labels
        run: |
          set -euo pipefail
          gh run download 34191508045 --repo zuizui0223/island --name source-scale-batch-integration-34191508045 --dir direct_traits
          echo '7e86170218814abe2845da9a0282aecfdc930819b9d0c439bae8df4a0679c577  direct_traits/direct_species_trait_ledger.csv.gz' | sha256sum -c -
          git clone -q --depth 1 https://github.com/liamkendall/bumble-bat.git original_diel_author
          test "$(git -C original_diel_author hash-object data/DvN_LiteratureDataClean_2024-09-13.csv)" = 39a82d966afcdde670603add1c881ace8791ffe9
          test "$(git -C original_diel_author hash-object data/SppTraitData_clean.csv)" = 18381e550a7e405fe4f198909f0bb381bbecf1e0
      - name: Count source-backed species with genuine within-island/year light gradients
        run: |
          set -euo pipefail
          mkdir -p verified
          python -m scripts.analysis.alan_species_slope_support_count_20261115 \
            --sites source/pcnl/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz \
            --globi source/globi/GloBI_stage2_signed_extension.csv.gz \
            --groups groups \
            --ledger direct_traits/direct_species_trait_ledger.csv.gz \
            --study original_diel_author/data/DvN_LiteratureDataClean_2024-09-13.csv \
            --study_traits original_diel_author/data/SppTraitData_clean.csv \
            --out verified/alan_species_slope_source_support_20261115.json
          python - <<'PY'
          import json
          x=json.load(open('verified/alan_species_slope_source_support_20261115.json'))
          assert x['source']['accepted_species']==14330
          assert x['source']['source_species_site_years']==2012925
          assert x['status']=='SOURCE_CENSUS_ONLY_SPECIES_SLOPES_NOT_YET_FITTED'
          assert x['light_gradient_gates']['0.02']['eligible_islands'] <= 562
          assert x['light_gradient_gates']['0.10']['eligible_island_year_strata'] <= x['light_gradient_gates']['0.02']['eligible_island_year_strata']
          print('ALAN_AUTHENTIC_SOURCE_SPECIES_COUNT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-species-slope-support-original-20261115
          path: verified/
          retention-days: 90
          if-no-files-found: warn
