name: ALAN Anic 13 plants Kew PLANTATT moisture x source light code falsification
on:
  push:
    branches: [analysis/alan-predator-guild-switch-edi-20261118]
    paths:
      - "scripts/analysis/alan_anic2022_13species_kew_plantatt_20261120.py"
      - "tests/test_alan_anic2022_13species_kew_plantatt_20261120.py"
      - ".github/workflows/alan-anic13-kew-plantatt-20261120.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-anon-13-plant-humidity:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact statistical package versions
        run: python -m pip install -q numpy==2.1.3 scipy==1.15.2
      - name: Run original trait source mathematics and stop-gate tests
        run: python -m unittest discover -s tests -p test_alan_anic2022_13species_kew_plantatt_20261120.py -v
      - name: Verify original Kew Git blob exact SHA and run trait x original biomass maximum-rho analysis
        run: |
          python -m scripts.analysis.alan_anic2022_13species_kew_plantatt_20261120 \
            --out /tmp/alan_anic2022_13species_kew_PLANTATT_source_results.json
      - name: Fail closed if original 13 species, one high-wet or original code boundaries drift
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/alan_anic2022_13species_kew_PLANTATT_source_results.json'))
          assert r["schema"]=="alan_anic2022_13species_PLANTATT_F_original_lightcode_source_v1"
          assert r["source_Kew_GitBlob_SHA1"]=="e6a1da929af81f370d2a1b79177b489e3e573a06"
          x=r["inference_and_support"]
          assert x["original_plant_names"]==13
          assert x["source_F_nonmissing"]==13
          assert x["moisture_above_7_original_plant_names"]==1
          assert x["source_all_three_code_complete_plant_names"]==12
          assert not x["binary_wet_moisture_test_supported"]
          assert not x["original_source_figshare_lightcode_to_color_mapping_verified"]
          assert not x["no_ALAN_causal_moisture_moderator_identified"]==False
          print("ORIGINAL_13_F_PLANTATT_SOURCE_AND_MECHANISM_LIMIT_GATE_PASS")
          print("PLANTATT_TRAIT_CONTINUOUS_SPEARMAN",x["source_spearman_rho"])
          print("PRE_SPECIFIED_MAX3_P",x["max_three_preplanned_comparisons_adjusted_p"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-Anic13-original-biomass-Kew-plantatt-trait-20261120
          path: /tmp/alan_anic2022_13species_kew_PLANTATT_source_results.json
          retention-days: 90
          if-no-files-found: error
