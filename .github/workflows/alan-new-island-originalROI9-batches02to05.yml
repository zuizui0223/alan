name: ALAN four new original island ROI9 batches 02 through 05 (1024 photos)
on:
  push:
    branches: [analysis/alan-batches02to05-originalROI9-20261108]
    paths:
      - .github/workflows/alan-new-island-originalROI9-batches02to05.yml
      - scripts/acquisition/alan_measure_progressive_island_original_roi9_20261108.py
      - tests/test_alan_measure_progressive_island_original_roi9_20261108.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-original-image-ROI9-new-batches:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      TORCH_NUM_THREADS: '1'
      SOURCE_BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unique observation source and synthetic ROI9 contracts
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          python -m unittest discover -s tests -p test_alan_measure_progressive_island_original_roi9_20261108.py -v
          python -m py_compile scripts/acquisition/alan_measure_progressive_island_original_roi9_20261108.py
          python -m py_compile scripts/acquisition/mois_warm_original_roi.py
      - name: Recover 8942 signed source original photo IDs and freeze this genuine 256-photo batch
        timeout-minutes: 9
        run: |
          set -euo pipefail
          mkdir -p frozen
          gh run download 42447983019 --repo zuizui0223/alan \
            --name alan-source-8942-novel-island-UUID-disjoint256-batches --dir frozen
          echo 'e64f77d91ab9c19db7e38861baf96753395de5f1189f2599a1ac5cf1f55d8acd  frozen/progressive_8942_new_island_source_schedule.csv.gz' | sha256sum -c -
          python -m scripts.acquisition.alan_measure_progressive_island_original_roi9_20261108 prepare \
            --schedule frozen/progressive_8942_new_island_source_schedule.csv.gz \
            --receipt frozen/progressive_island_original_photo_schedule_receipt.json \
            --batch "$SOURCE_BATCH" --out source
          test -f source/shards/shard-000.csv
          test -f source/shards/shard-001.csv
      - name: Restore unchanged YOLO11 and EfficientSAM frozen FCP ROI-v4 runtime
        timeout-minutes: 12
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q pyarrow==19.0.1 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          (cd "$RUNNER_TEMP/fcp" && bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam")
          test -f "$RUNNER_TEMP/fcp/scripts/analysis/measure_random_photo_first_blind_partition.py"
          test -f "$RUNNER_TEMP/fcp/data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt"
      - name: True original RGB acquisition and flower ROI-v4 inference on 256 novel island observations
        timeout-minutes: 48
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          python -m scripts.acquisition.mois_warm_original_roi \
            --source source --runtime "$RUNNER_TEMP/fcp" \
            --sam "$RUNNER_TEMP/sam" --group 0 --output measured
          test -f measured/shard_000/photos.csv
          test -f measured/shard_001/photos.csv
          test -f measured/warm_roi_group_000_diagnostic.json
          echo 'ALAN_256_NOVEL_ISLAND_REAL_ORIGINAL_PIXELS_INFERRED'
      - name: Independently authenticate the 256 genuinely acquired novel island ROI9 colour outcomes
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python -m scripts.acquisition.alan_measure_progressive_island_original_roi9_20261108 collect \
            --source source --measured measured --batch "$SOURCE_BATCH" --out finished
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('finished/ALAN_original_novel_island_ROI9_batch_receipt.json').read_text())
          assert r['schema']=='ALAN_novel_source_island_original256_FCP_ROI9_batch_v1'
          assert r['source_batch']==int(os.environ['SOURCE_BATCH'])
          assert r['original_images_downloaded_and_measured']==256
          assert r['new_distinct_observation_UUIDs']==256
          assert r['numeric_original_nine_palette_success']+r['technically_unknown_original_ROI9']==256
          assert r['image_acquisition_failures']<=r['technically_unknown_original_ROI9']
          assert r['source_images_retained_in_artifact'] is False
          assert r['technical_unknown_photo_not_assigned_an_ROI9_colour']
          print('ALAN_NEW_ISLAND_GENUINE_ROI9_BATCH_SUCCESS',r['source_batch'],r['numeric_original_nine_palette_success'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-original-novel-island-ROI9-batch-${{ matrix.batch }}
          path: |
            finished/
            measured/shard_000/photos.csv
            measured/shard_000/receipt.json
            measured/shard_001/photos.csv
            measured/shard_001/receipt.json
            measured/warm_roi_group_000_diagnostic.json
            source/manifest.json
          retention-days: 90
          if-no-files-found: warn
