name: Penryn complete-species covariance and trophic contrasts

on:
  push:
    branches: [analysis/alan-penryn-complete-species-trophic-20261121]
    paths:
      - database/alan_experiments/plant_sources/**
      - tests/test_alan_penryn_complete_species.py
      - .github/workflows/alan-penryn-complete-species.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-unit-covariance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - name: Physical-unit and existing DB tests
        run: |
          python -m unittest discover -s tests -p test_alan_penryn_complete_species.py
          python -m unittest discover -s tests -p test_alan_experiment_db.py
      - name: Independent arm-mean and Jacobian verification
        run: python database/alan_experiments/plant_sources/verify_complete_species_covariance.py --analysis-dir database/alan_experiments/plant_sources/complete_species_trophic --out "$RUNNER_TEMP/penryn_independent_verification.json"
      - name: Recompute without replacing stored results
        run: |
          python database/alan_experiments/plant_sources/analyze_complete_species.py --out "$RUNNER_TEMP/penryn_complete"
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          expected = Path('database/alan_experiments/plant_sources/complete_species_trophic')
          actual = Path(os.environ['RUNNER_TEMP']) / 'penryn_complete'
          files = sorted(actual.glob('*.csv'))
          assert len(files) == 11, [p.name for p in files]
          for p in files:
              pd.testing.assert_frame_equal(pd.read_csv(expected/p.name), pd.read_csv(p),
                                            check_exact=False, rtol=1e-11, atol=1e-12)
          print('All 11 recomputed CSV tables agree with stored results.')
          PY
