name: ALAN Page 2021 Figshare single-visit effectiveness source gate
on:
  push:
    branches:
      - analysis/alan-biotic-aquatic-spider-original-20261118
    paths:
      - 'scripts/acquisition/alan_page2021_original_1564_sve_figshare.py'
      - 'scripts/analysis/alan_page2021_original_623_moth_fly_sameplant.py'
      - 'scripts/analysis/alan_page2021_363wet_plant_case_coverage.py'
      - 'scripts/analysis/alan_page2021_original_macro_functional_network_mismatch.py'
      - 'scripts/analysis/alan_page2021_source_functional_bottlenecks_20261118.py'
      - 'tests/test_alan_page2021_source_functional_bottlenecks.py'
      - 'tests/test_alan_page2021_macro_functional_network_mismatch.py'
      - 'tests/test_alan_page2021_original_623_moth_fly.py'
      - '.github/workflows/alan-page2021-original-figshare-source.yml'
  pull_request:
    paths:
      - 'scripts/acquisition/alan_page2021_original_1564_sve_figshare.py'
      - '.github/workflows/alan-page2021-original-figshare-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page2021-original-project-article-file-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve original publicly released project article and file schemas
        run: |
          set -euo pipefail
          mkdir -p /tmp/alan_page2021
          python -m scripts.acquisition.alan_page2021_original_1564_sve_figshare \
            --out /tmp/alan_page2021/source.json
      - name: Report original effects without inventing moth versus fly or ALAN treatment
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/alan_page2021/source.json'))
          assert x['schema']=='alan_page2021_single_visit_pollen_1564_figshare_source_gate_v1'
          assert x['original_abstract_reported_studies']==168
          assert x['original_abstract_reported_single_visit_effects']==1564
          assert x['moth_vs_fly_same_plant_original_contrasts_estimated'] is False
          print('PAGE2021_ACTUAL_SOURCE_AUDIT',x['status'], x.get('source_article_count'),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-page2021-original-figshare-120921-file-audit
          path: /tmp/alan_page2021/source.json
          retention-days: 60
          if-no-files-found: warn

  real-original-623-plant-taxon-moth-fly-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure same study, same plant, same pollination measure and visitation units are enforced
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_alan_page2021_original_623_moth_fly.py -v
      - name: Recompute actual downloaded 623 author records for any strict moth and fly comparator
        run: |
          set -euo pipefail
          mkdir -p /tmp/alan_page_mothfly
          python -m scripts.analysis.alan_page2021_original_623_moth_fly_sameplant \
            --out /tmp/alan_page_mothfly/strict_sameplant_original_moth_fly.json
      - name: Preserve source scope and prohibit cross-study functional compensation
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/alan_page_mothfly/strict_sameplant_original_moth_fly.json'))
          assert r['schema']=='alan_page2021_623_original_taxonlevel_moth_fly_comparator_gate_v1'
          assert r['source_taxonlevel_rows']==623
          assert r['author_original_CSV_SHA256']=='e28ebe99e0dfb27b73fbe6638e568bf98fa95b92c920e1d3d981e8eaea27519a'
          assert 'fly' in r['source_pollinator_group_counts']
          assert 'moth' in r['source_pollinator_group_counts']
          assert not r['no_ALAN_lighting_manipulation']==False
          assert r['no_crossstudy_fly_moth_ratio_constructed']
          print('PAGE_SOURCE_UNIT_AND_BIOTIC_GUILD_GATE_PASS',
                r['STRICT_same_study_plant_year_effect_metric_unit_and_visit_metric']['original_moth_fly_matched_cells'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-page2021-623-taxa-moth-fly-same-study-plant-SVE-source
          path: /tmp/alan_page_mothfly/strict_sameplant_original_moth_fly.json
          retention-days: 90
          if-no-files-found: warn

  original-sve-to-363-frozen-wet-flora-source-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compute actual exact-match source overlap and absence gates
        run: |
          set -euo pipefail
          mkdir -p /tmp/alan_page_wet
          python -m scripts.analysis.alan_page2021_363wet_plant_case_coverage \
            --out /tmp/alan_page_wet/page_original_case_species_coverage.json
      - name: Verify frozen alan/main wet flora and strict no-effect transport
        run: |
          python - <<'PY'
          import json
          s=json.load(open('/tmp/alan_page_wet/page_original_case_species_coverage.json'))
          assert s['schema']=='alan_page2021_original_sve_source_versus_363_wet_plant_coverage_v1'
          assert s['original_main_wet_species']==363
          assert s['original_main_selected_ALAN_recording_rate_decline_cases']==58
          assert s['original_main_other_high_MOIST_species']==305
          assert s['source_same_study_plant_moth_and_fly_pairs']==5
          assert not s['no_pollen_efficiency_transferred_between_nonidentical_species']==False
          print('PAGE_623_SOURCE_WET_FLORA_EXACT_TAXON_OVERLAP_PASS',s['Page_source_wet_candidate_cases_matched'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-page2021-sve-623-vs-frozen-wet-flora-363-coverage
          path: /tmp/alan_page_wet/page_original_case_species_coverage.json
          retention-days: 90
          if-no-files-found: warn

  original-69studies-102plants-pollen-function-vs-visitor-rate-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure only same plant/measurement source strata and true study clusters
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_alan_page2021_macro_functional_network_mismatch.py -v
      - name: Reconstruct original Page 623 taxon visit-rate and conspecific pollen network from source SHA
        run: |
          set -euo pipefail
          mkdir -p /tmp/page_macro
          python -m scripts.analysis.alan_page2021_original_macro_functional_network_mismatch \
            --out /tmp/page_macro/page_source_functional_rank_mismatch.json
      - name: Check 623 original effects and explicit no-ALAN/other-endpoint inference
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/page_macro/page_source_functional_rank_mismatch.json'))
          assert r['schema']=='alan_page2021_original_pollinator_rank_vs_stigma_pollen_flux_macro_v1'
          assert r['original_Page_taxonlevel_source_n']==623
          for n in ('source_original_no_taxon_change',
                    'excluding_independently_verified_Vanessa_mislabeled_moth'):
              z=r[n]
              assert z['eligible_comparable_functional_pollen_plant_groups']<=z['original_source_study_plant_period_metric_visitation_cells']
              assert z['no_page_study_used_ALAN_lighting_intervention']
          assert r['source_no_pollen_SDs_or_ALAN_treatments']
          print('PAGE2021_ACTUAL_MACRO_POLLEN_VISIT_RANK_COHORT_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-page2021-original-plant-visitor-functional-importance-69study
          path: /tmp/page_macro/page_source_functional_rank_mismatch.json
          retention-days: 90
          if-no-files-found: warn

  original-72-plant-study-functional-bottleneck-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic-only tests of pollen vs visit compositional divergence and cluster units
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_alan_page2021_source_functional_bottlenecks.py -v
      - name: Recompute from Page Figshare original SHA-locked 623 taxa, 72 comparable networks and 33 studies
        run: |
          set -euo pipefail
          mkdir -p /tmp/alan_page_function
          python -m scripts.analysis.alan_page2021_source_functional_bottlenecks_20261118 \
            --out /tmp/alan_page_function/source_visitation_vs_true_pollen_network.json
      - name: Gate true study count, source taxon audit and observational not causal outcomes
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/alan_page_function/source_visitation_vs_true_pollen_network.json'))
          assert d['schema']=='alan_page2021_33study_72plant_network_functional_tv_and_loss_v1'
          assert d['source_original_taxon_rows']==623
          assert d['original_csv_sha256']=='e28ebe99e0dfb27b73fbe6638e568bf98fa95b92c920e1d3d981e8eaea27519a'
          for name,v in d['source_sensitivity_versions'].items():
              assert v['source_matched_eligible_plant_networks']==72
              assert v['source_matched_original_studies']==33
              a=v['subsets_and_source_study_bootstrap']['all_source_comparable_networks']['source_summary']
              assert a['source_plant_network_cells']==72
              assert a['source_studies']==33
              assert a['frequent_visitor_proxy_abs_pollen_share_error_mean']>=0
              assert a['functional_weight_vs_visitation_weight_TV_mean']<=1
          assert d['no_experimental_ALAN_light_treatment']
          assert d['no_targeted_pollinator_removal_or_predator_intervention']
          assert d['cannot_infer_stigma_to_seed_fitness']
          print('PAGE2021_TRUE_FUNCTIONAL_VISITOR_BOTTLENECK_SOURCE_GATE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-page2021-33study-72-network-visitation-vs-pollen-bottleneck
          path: /tmp/alan_page_function/source_visitation_vs_true_pollen_network.json
          retention-days: 90
          if-no-files-found: warn
