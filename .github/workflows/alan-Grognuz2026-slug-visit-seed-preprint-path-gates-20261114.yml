name: ALAN direct and herbivore-mediated day-visitation and seed preprint path evidence audit
on:
  push:
    branches: [analysis/alan-grognuz-herbivory-daypollination-seed-pathgate-20261114]
    paths:
      - config/alan_public_Grognuz2026_herbivory_daypollination_seed_preprint_20261114.json
      - scripts/analysis/alan_Grognuz2026_preprint_ALAN_slug_visitor_seed_evidence_gates_20261114.py
      - tests/test_alan_Grognuz2026_preprint_ALAN_slug_visitor_seed_evidence_gates_20261114.py
      - .github/workflows/alan-Grognuz2026-slug-visit-seed-preprint-path-gates-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-preprint-report-only-source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify experimental design and reported numeric source CI logic
        run: |
          set -euo pipefail
          python -m py_compile scripts/analysis/alan_Grognuz2026_preprint_ALAN_slug_visitor_seed_evidence_gates_20261114.py
          python -m unittest discover -s tests -p 'test_alan_Grognuz2026_preprint_ALAN_slug_visitor_seed_evidence_gates_20261114.py' -v
      - name: Preserve reported path coefficients without fabricating raw factorial mediation
        run: |
          set -euo pipefail
          mkdir -p preprint_source_path_gates
          python -m scripts.analysis.alan_Grognuz2026_preprint_ALAN_slug_visitor_seed_evidence_gates_20261114 \
            --repo . --out preprint_source_path_gates/ALAN_2026_light_slug_flower_leaf_visits_seeds_preprint_path_QA.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("preprint_source_path_gates/ALAN_2026_light_slug_flower_leaf_visits_seeds_preprint_path_QA.json").read_text())
          assert q["status"]=="ACTUAL_PREPRINT_REPORTED_RESULT_PATH_AUDIT_NO_RAW_DATA_REANALYSIS"
          assert q["source_version_and_inference_tier"]["raw_experiment_records_recomputed"] is False
          assert q["source_foliar_damage_mediation_requirements"]["complete_positive_pollination_mediation_established"] is False
          assert q["source_floral_damage_mediation_requirements"]["complete_positive_pollination_mediation_established"] is False
          assert q["seed_set"]["NO_actual_seed_assurance_buffering_by_herbivore_state_demonstrated"]
          print("ALAN_GROGNUZ_2026_LITERATURE_REPORTED_CI_SOURCE_NO_INVENTED_CAUSAL_MEDIATION",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-Grognuz2026-preprint-light-herbivore-pollinator-seed-pathgates-20261114
          path: preprint_source_path_gates/
          if-no-files-found: warn
          retention-days: 90
