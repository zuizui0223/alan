name: ALAN Giavi 2021 six-meadow UK moisture and original daytime visitor source
on:
  push:
    branches: [analysis/alan-predator-guild-switch-edi-20261118]
    paths:
      - "scripts/analysis/alan_giavi2021_plantatt_moisture_dayvisits_20261120.py"
      - "tests/test_alan_giavi2021_plantatt_dayvisits_20261120.py"
      - ".github/workflows/alan-giavi-six-meadow-kew-traits-20261120.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-six-meadows-trait:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified original-source rank statistic
        run: python -m pip install -q numpy==2.1.3 scipy==1.15.2
      - name: Test true plant naming, missingness and exact null mathematics
        run: python -m unittest discover -s tests -p test_alan_giavi2021_plantatt_dayvisits_20261120.py -v
      - name: Compute true 6 meadow source traits and complete exact rank label permutations
        run: |
          python -m scripts.analysis.alan_giavi2021_plantatt_moisture_dayvisits_20261120 \
            --out /tmp/alan_Giavi2021_plantatt_F_original_source.json
      - name: Confirm source study unit and separate original taxonomy-sensitivity gates
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/alan_Giavi2021_plantatt_F_original_source.json'))
          assert x["schema"]=="alan_Giavi2021_6meadow_planttaxa_Kew_PLANTATT_F_original_source_support_v1"
          assert x["source_original_six_physical_meadow_pairs"]==6
          assert x["source_original_plant_taxon_labels"]==21
          assert x["source_true_named_species"]==10
          assert x["source_original_meadow_by_plant_covariance_not_recovered"]
          assert x["moist_species_bias_causal_mechanism_not_estimated"]
          print("GIAVI_SOURCE_Kew_F_EXACT_NULL_GATE_SUCCESS")
          for key,val in x["two_independent_UK_F_score_sensitivities"].items():
            print("GIAVI_ORIGINAL_TRAIT",key, val["all_names_matched_source_exact"],
                  val["strict_2plus_meadow_pairs"],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-Giavi2021-original-6meadow-KewF-source
          path: /tmp/alan_Giavi2021_plantatt_F_original_source.json
          if-no-files-found: error
          retention-days: 90
