name: ALAN source-frozen four-order omission diagnostics

on:
  push:
    branches: [analysis/alan-arthropod-search-expansion-20261122]
    paths:
      - 'scripts/analysis/alan_drift_four_order_leaveoneout_20261124.py'
      - 'tests/test_alan_drift_four_order_leaveoneout_20261124.py'
      - 'database/alan_experiments/arthropod_expansion_20261122/stream_drift_20261124/four_order_omission_frozen_20261124.json'
      - '.github/workflows/alan-henn-eeres-four-order-omission-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-order-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin workbook reader
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Reproduce Henn 5 river variants and source-paired two-programme baseline
        run: python -m unittest discover -s tests -p test_alan_drift_four_order_leaveoneout_20261124.py -v
      - name: Reacquire public Dryad original EERES XLSX by SHA and compute all five compositional comparisons
        run: python scripts/analysis/alan_drift_four_order_leaveoneout_20261124.py --frozen database/alan_experiments/arthropod_expansion_20261122/stream_drift_20261124/four_order_omission_frozen_20261124.json --out results/alan_drift_four_order_leaveoneout_20261124.json
      - name: Archive only derived study summaries
        uses: actions/upload-artifact@v4
        with:
          name: alan-source-frozen-four-order-omission
          path: results/alan_drift_four_order_leaveoneout_20261124.json
