name: ALAN 13-year actual GBIF reptile/photo effort reliability × prior ALAN

on:
  push:
    branches: [analysis/alan-multichannel-light-island-20261112]
    paths:
      - .github/workflows/alan-gbif-13yr-reptile-photo-effort.yml
      - scripts/analysis/alan_13year_guild_photo_effort_20261112.py
      - tests/test_alan_13year_guild_photo_effort_20261112.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-original-source-photo-effort-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned dependencies and validate weighted FE math
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5
          python -m py_compile scripts/analysis/alan_13year_guild_photo_effort_20261112.py
          python -m unittest discover -s tests -p test_alan_13year_guild_photo_effort_20261112.py -v
      - name: Restore 13-year original-source moth/butterfly and gecko/skink photo records
        run: |
          set -euo pipefail
          mkdir -p source/insects source/reptiles
          gh run download 42786502922 --repo zuizui0223/alan \
            --name alan-global-228361-islandcells-actual-13year-prior-PCNL-joined --dir source/insects
          gh run download 42796502910 --repo zuizui0223/alan \
            --name alan-original-101399-gecko-scink-photo-13year-historical-PCNL-all-islands --dir source/reptiles
          echo '64b269dd796b9095853c371909a0dd760921df2e396636a83fc59a2d659e4852  source/insects/ALAN_worldwide_GBIF_228361_island_cell_years_original_prior_PCNL_2012_2024.csv.gz' | sha256sum -c -
          echo '03aa855c9e7691855bfee4baa099f0d3a31db8d53066ec36a95afda48c3ba339  source/reptiles/gecko_scink_true_2013_2025_original_island_photo_cells_priorPCNL.csv.gz' | sha256sum -c -
      - name: Run actual 13-year photo-effort capped weights, Jeffreys smoothing and source-minimum gates
        run: |
          set -euo pipefail
          python scripts/analysis/alan_13year_guild_photo_effort_20261112.py \
            --insects source/insects/ALAN_worldwide_GBIF_228361_island_cell_years_original_prior_PCNL_2012_2024.csv.gz \
            --reptiles source/reptiles/gecko_scink_true_2013_2025_original_island_photo_cells_priorPCNL.csv.gz \
            --out aggregate/gecko_moth_photo_source_sampling_13yr.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('aggregate/gecko_moth_photo_source_sampling_13yr.json').read_text())
          m=r['models']
          b=lambda k:m[k]['effect']['beta']
          assert r['source_sampling_diagnostics']['spatial50']['site_years']==3424
          assert r['source_sampling_diagnostics']['repeat30']['site_years']==1979
          assert abs(b('spatial50__gecko__island_equal')-3.0488940194354788)<1e-8
          assert abs(b('spatial50__gecko__reptile_capped_count')-3.475828215635)<1e-4
          assert abs(b('spatial50__gecko_jeffreys__island_equal')-2.1598)<1e-3
          assert abs(b('spatial50__gecko__reptile_photo_min_5')-0.8735)<1e-3
          assert abs(b('repeat30__gecko__island_equal')+12.313532315429635)<1e-8
          assert m['repeat30__gecko__reptile_photo_min_3']['effect']['ci95'][0]<0<m['repeat30__gecko__reptile_photo_min_3']['effect']['ci95'][1]
          assert r['warnings']['no_gecko_moth_predation_or_local_moth_pollination_observed']
          print('ORIGINAL_SOURCE_RECORD_EFFORT_ROBUSTNESS_VALIDATED',
            json.dumps({k:m[k] for k in ('spatial50__gecko__island_equal',
            'spatial50__gecko__reptile_capped_count',
            'spatial50__gecko__reptile_photo_min_5',
            'repeat30__gecko__island_equal')},sort_keys=True))
          PY
      - name: Archive SOURCE AGGREGATES only; no precise photo location or species-row records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan-13yr-original-photo-effort-gecko-moth-source-robustness
          path: aggregate/gecko_moth_photo_source_sampling_13yr.json
          retention-days: 90
          if-no-files-found: warn
