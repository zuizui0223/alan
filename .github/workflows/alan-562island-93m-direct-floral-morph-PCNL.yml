name: ALAN real 562-island 33y-PCNL vs species-direct flower morphology
on:
  push:
    branches: [analysis/alan-floral-syndrome-global562-pcnl-20261113]
    paths:
      - scripts/analysis/alan_real93m_direct_flower_mothlike_PCNL_20261113.py
      - tests/test_alan_real93m_direct_flower_mothlike_PCNL_20261113.py
      - .github/workflows/alan-562island-93m-direct-floral-morph-PCNL.yml
  pull_request:
    branches: [analysis/alan-pcnl-globi-negative-controls-20261110]
    paths:
      - scripts/analysis/alan_real_genus_prevalence_bias_20261110.py
      - tests/test_alan_real93m_direct_flower_mothlike_PCNL_20261113.py
      - .github/workflows/alan-real-genus-prevalence-source-bias.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 geopandas==1.1.2 shapely==2.1.2 requests==2.32.3
          python -m py_compile scripts/analysis/alan_real93m_direct_flower_mothlike_PCNL_20261113.py
          python -m unittest discover -s tests -p test_alan_real93m_direct_flower_mothlike_PCNL_20261113.py -v
  actual-source-macro:
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore 85,318 original 33-year PCNL eligible island sites, exact immutable GloBI
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          mkdir -p source/pcnl source/globi original_batches raw groups
          gh run download 42624285048 --repo zuizui0223/alan --name alan-full93m-actual-PCNL1992-2024-moth-positive-macro --dir source/pcnl
          echo '440a8313d71168e0a4dfd2f41a7bef45623abb068b07e3282026f1c35dccbd2c  source/pcnl/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz' | sha256sum -c -
          gh run download 41976552977 --repo zuizui0223/mois --name mois-ALAN-GloBI-stage2-actual-records-2019-2024-supported-source --dir source/globi
          echo 'a6b97aa0941215d2f645e4c4fbf19490492b93680a7d7c0502814c7a66902994  source/globi/GloBI_stage2_signed_extension.csv.gz' | sha256sum -c -
          gh run download 42616279235 --repo zuizui0223/alan --pattern 'alan-93m-fullflora-moth-island-group-*' --dir original_batches
          test "$(find original_batches -name 'allflora-island-group-??.sqlite' | wc -l)" -eq 16
          test "$(find original_batches -name 'allflora-island-group-??.json' | wc -l)" -eq 16
          find original_batches -name 'allflora-island-group-??.sqlite' -exec cp {} groups/ \;
          find original_batches -name 'allflora-island-group-??.json' -exec cp {} groups/ \;
      - name: Restore source-DIRECT species morphology ledger with independent digest
        run: |
          set -euo pipefail
          mkdir -p source/traits
          gh run download 34191508045 --repo zuizui0223/island --name source-scale-batch-integration-34191508045 --dir source/traits
          echo '7e86170218814abe2845da9a0282aecfdc930819b9d0c439bae8df4a0679c577  source/traits/direct_species_trait_ledger.csv.gz' | sha256sum -c -
      - name: Actual within-island photo flora vs historic light under species-direct morphology
        timeout-minutes: 65
        run: |
          set -euo pipefail
          mkdir -p verified_morph
          python -m scripts.analysis.alan_real93m_direct_flower_mothlike_PCNL_20261113 --sites source/pcnl/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz --globi source/globi/GloBI_stage2_signed_extension.csv.gz --groups groups --ledger source/traits/direct_species_trait_ledger.csv.gz --v011 results/globi_v011_fiveyear/source_moth_species.csv --out verified_morph/original_562island_morphology_light_result.json
          python -c "import json; a=json.load(open('verified_morph/original_562island_morphology_light_result.json')); assert a['source']['matched_islands']==562 and a['source']['matched_site_years']==77647; print('SOURCE_562_MORPHOLOGY_PCNl_VERIFIED')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-global562-direct-floral-morph-PriorPCNL-20261113
          path: verified_morph/
          retention-days: 90
          if-no-files-found: warn
