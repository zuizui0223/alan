name: ALAN 562 islands direct floral morphology and historical PCNL
on:
  push:
    branches: [analysis/alan-floral-syndrome-global562-pcnl-20261113]
    paths:
      - .github/workflows/alan-562island-93m-direct-floral-morph-PCNL.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 geopandas==1.1.2 shapely==2.1.2
          python -m unittest discover -s tests -p test_alan_real93m_direct_flower_mothlike_PCNL_20261113.py -v
