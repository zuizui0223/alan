name: ALAN full93m moth-positive source-flora historical PCNL macro model source gates
on:
  pull_request:
    branches: [analysis/alan-island-pollinator-shift-gated-20261109]
    paths:
      - scripts/analysis/alan_full93m_moth_PCNLPrior_two_way_FE_20261109.py
      - tests/test_alan_full93m_moth_PCNLPrior_two_way_FE_20261109.py
      - .github/workflows/alan-moth-source-PCNL-two-way-FE-macro.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-model-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 scipy==1.15.2
          python -m py_compile scripts/analysis/alan_full93m_moth_PCNLPrior_two_way_FE_20261109.py
          python -m unittest discover -s tests -p test_alan_full93m_moth_PCNLPrior_two_way_FE_20261109.py -v
