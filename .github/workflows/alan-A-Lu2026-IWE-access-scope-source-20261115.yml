name: ALAN A correction Lu2026 access-scoped original IWE text source
on:
  push:
    branches:
      - analysis/alan-floral-timing-dependence-20261115
    paths:
      - scripts/analysis/alan_Lu2026_iwe_access_scope_sync_20261115.py
      - tests/test_alan_Lu2026_iwe_access_scope_sync_20261115.py
      - .github/workflows/alan-A-Lu2026-IWE-access-scope-source-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm scope guards do not mislabel night-only seed loss
        run: python -m unittest discover -s tests -p 'test_alan_Lu2026_iwe_access_scope_sync_20261115.py' -v
      - name: Fetch SHA-pinned original IWE source audit, not paper raw data
        run: python scripts/analysis/alan_Lu2026_iwe_access_scope_sync_20261115.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-a-Lu2026-author-text-night-only-correction
          path: results/alan_Lu2026_IWE_access_scoped_verified_20261115.json
          if-no-files-found: ignore
          retention-days: 30
