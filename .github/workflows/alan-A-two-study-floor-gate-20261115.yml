name: ALAN A true two-study source hurdle falsification gate
on:
  push:
    branches: [analysis/alan-floral-timing-dependence-20261115]
    paths:
      - scripts/analysis/alan_A_crossstudy_baseline_floor_gate_20261115.py
      - tests/test_alan_A_crossstudy_baseline_floor_gate_20261115.py
      - .github/workflows/alan-A-two-study-floor-gate-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source evaluation requirements
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Offline source integrity and algebra tests
        run: python -m unittest discover -s tests -p 'test_alan_A_crossstudy_baseline_floor_gate_20261115.py' -v
      - name: Fetch exact original Li data and source-derived Grognuz 28 blocks
        run: python -m scripts.analysis.alan_A_crossstudy_baseline_floor_gate_20261115
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-two-study-floor-gate-verified
          path: results/alan_A_crossstudy_baseline_zero_hurdle_gate_20261115.json
          retention-days: 30
