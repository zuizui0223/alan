name: ALAN island endemic nocturnal-moth lineage and day-control photo-pair feasibility
on:
  pull_request:
    branches: [analysis/alan-experimental-diel-pollination-evidence-audit-20261110]
    paths:
      - scripts/analysis/alan_island_endemic_night_moth_pair_support_20261110.py
      - tests/test_alan_island_endemic_night_moth_pair_support_20261110.py
      - .github/workflows/alan-island-nightshift-pair-source-feasibility.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3
          python -m py_compile scripts/analysis/alan_island_endemic_night_moth_pair_support_20261110.py
          python -m unittest discover -s tests -p test_alan_island_endemic_night_moth_pair_support_20261110.py -v
  genuine-photo-experiment-pair-opportunities:
    needs: source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore frozen 93.2m original-photo island plant groups, 33-year historical PCNL and independent study overlap
        timeout-minutes: 28
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3
          mkdir -p source/pcnl source/experiment batches groups
          gh run download 42624285048 --repo zuizui0223/alan --name alan-full93m-actual-PCNL1992-2024-moth-positive-macro --dir source/pcnl
          echo '440a8313d71168e0a4dfd2f41a7bef45623abb068b07e3282026f1c35dccbd2c  source/pcnl/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz' | sha256sum -c -
          gh run download 42745392510 --repo zuizui0223/alan --name alan-real93m-daynight-exclusion-independent-experiment-species-support --dir source/experiment
          test -s source/experiment/diel_experiment_accepted_plant_source_overlap.csv
          gh run download 42616279235 --repo zuizui0223/alan --pattern 'alan-93m-fullflora-moth-island-group-*' --dir batches
          test "$(find batches -name 'allflora-island-group-??.sqlite' | wc -l)" -eq 16
          test "$(find batches -name 'allflora-island-group-??.json' | wc -l)" -eq 16
          find batches -name 'allflora-island-group-??.sqlite' -exec cp {} groups/ \;
          find batches -name 'allflora-island-group-??.json' -exec cp {} groups/ \;
      - name: Restore independent author original day/night exclusion traits and verify Git blob identity
        timeout-minutes: 12
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/liamkendall/bumble-bat.git published_author
          test "$(git -C published_author hash-object data/SppTraitData_clean.csv)" = "18381e550a7e405fe4f198909f0bb381bbecf1e0"
      - name: Compute true photo IDs, UUIDs, simultaneous island sites and night/day comparator evidence
        timeout-minutes: 22
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_island_endemic_night_moth_pair_support_20261110 \
            --study source/experiment/diel_experiment_accepted_plant_source_overlap.csv \
            --traits published_author/data/SppTraitData_clean.csv \
            --pcnl source/pcnl/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz \
            --groups groups --out observed
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('observed/ALAN_actual_island_nightshift_pair_support_gate.json').read_text())
          assert x['schema']=='ALAN_island_literature_nocturnal_effective_moth_day_control_pair_support_v1'
          assert x['original_accepted_experimental_species']==54
          assert x['original_experimental_coobserved_species_pairs']==298
          assert x['coobserved_same_genus_pairs']==8
          assert x['coobserved_same_genus_strict_night_day_bloom_pairs']==0
          assert x['effective_hawkmoth_island_endemic_covered_I_habeliana_photos']==44
          assert x['effective_hawkmoth_island_endemic_covered_I_habeliana_observations']==22
          assert x['I_habeliana_562_macro_source_sites']==3
          assert x['I_habeliana_sameyear_light_contrast_islands']==0
          assert x['I_habeliana_plus_Cordia_lutea_coobserved_site_years']==8
          assert x['Brighamia_insignis_photo_source_IDs']==0
          assert not x['island_vs_mainland_3way_interaction_estimable']
          print('ALAN_TRUE_SOURCE_ISLAND_NIGHT_SHIFT_PAIRS_DATA_SUPPORT',
                json.dumps(x,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-real-island-endemic-nocturnal-effective-pollination-pair-support
          path: observed/
          retention-days: 90
          if-no-files-found: warn
