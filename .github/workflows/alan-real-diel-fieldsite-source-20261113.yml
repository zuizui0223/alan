name: ALAN real author day-night reproductive field site and year source preflight
on:
  push:
    branches: [analysis/alan-authentic-diel-reproduction-priorPCNL-20261113]
    paths:
      - .github/workflows/alan-real-diel-fieldsite-source-20261113.yml
      - scripts/analysis/alan_original_DvN_fieldsite_year_source_20261113.py
      - tests/test_alan_original_DvN_fieldsite_year_source_20261113.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-author-experiment-year-and-location:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test true treatment/year/location record and restore published raw original
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          python -m py_compile scripts/analysis/alan_original_DvN_fieldsite_year_source_20261113.py
          python -m unittest discover -s tests -p test_alan_original_DvN_fieldsite_year_source_20261113.py -v
          git clone -q --depth 1 https://github.com/liamkendall/bumble-bat.git independent_author_source
          test "$(git -C independent_author_source hash-object data/DvN_LiteratureDataClean_2024-09-13.csv)" = 39a82d966afcdde670603add1c881ace8791ffe9
          test "$(git -C independent_author_source hash-object data/SppTraitData_clean.csv)" = 18381e550a7e405fe4f198909f0bb381bbecf1e0
      - name: Build authentic same study-species-method-location-true experiment-year reproductive outcome pairs
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_original_DvN_fieldsite_year_source_20261113 \
            --study independent_author_source/data/DvN_LiteratureDataClean_2024-09-13.csv \
            --traits independent_author_source/data/SppTraitData_clean.csv \
            --elevation independent_author_source/data/DvN_Sites_elevation.csv \
            --output original_diel_source
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('original_diel_source/original_DvN_source_year_geo_repro_audit.json').read_text())
          assert s['original_study_species_metric_paired_reproductive_groups']==231
          assert s['n_independent_original_studies']>=100
          assert s['n_original_plant_species']>=100
          assert s['actual_original_site_year_reproductive_pairs']>=190
          assert s['year_start_min']>=1993
          assert s['future_light_never_sampled']
          print('REAL_INDEPENDENT_FIELD_YEAR_SITE_SOURCE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-true-daynight-study-site-year-experiment-source-20261113
          path: original_diel_source/
          retention-days: 90
          if-no-files-found: warn
