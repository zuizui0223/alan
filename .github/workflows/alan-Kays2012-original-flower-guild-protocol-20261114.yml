name: ALAN original Kays Gamboa 2010 vertebrate same-flower and exclusion source audit
on:
  push:
    branches: [analysis/alan-kays-vertebrate-sameflower-exclusion-audit-20261114]
    paths:
      - scripts/analysis/alan_original_Kays2012_sameflower_vertebrate_protocol_20261114.py
      - tests/test_alan_original_Kays2012_sameflower_vertebrate_protocol_20261114.py
      - .github/workflows/alan-Kays2012-original-flower-guild-protocol-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  safety-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5 scikit-learn==1.6.1
          python -m unittest discover -s tests -p test_alan_original_Kays2012_sameflower_vertebrate_protocol_20261114.py -v
          python -m py_compile scripts/analysis/alan_original_Kays2012_sameflower_vertebrate_protocol_20261114.py
  true-primary-study-original-source:
    needs: safety-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore exact authors' 1652 treatment source and SHA original 301 prelight source
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5 scikit-learn==1.6.1
          mkdir -p original_source
          gh run download 43379308366 --repo zuizui0223/alan \
            --name alan-true-daynight-study-site-year-experiment-source-20261113 \
            --dir original_source
          echo '21b1fef1beb9e6238cfa47101b991815d4c0f33787b9737f834426dc3bab15af  original_source/original_DvN_field_site_year_outcome_pre_PCNLP.csv.gz' | sha256sum -c -
          git clone -q --depth 1 https://github.com/liamkendall/bumble-bat.git original_author
          test "$(git -C original_author hash-object data/DvN_LiteratureDataClean_2024-09-13.csv)" = 39a82d966afcdde670603add1c881ace8791ffe9
      - name: Reconstruct genuine Kays same-flower original protocol and 153 study-level sensitivity
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p original_kays_source
          python -m scripts.analysis.alan_original_Kays2012_sameflower_vertebrate_protocol_20261114 \
            --author original_author/data/DvN_LiteratureDataClean_2024-09-13.csv \
            --preflight original_source/original_DvN_field_site_year_outcome_pre_PCNLP.csv.gz \
            --out original_kays_source/ALAN_originalKays2012_primary_sameflower_2010_exclusion_20261114.json
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path("original_kays_source/ALAN_originalKays2012_primary_sameflower_2010_exclusion_20261114.json").read_text())
          assert z["status"]=="SOURCE_VERIFIED_GAMBOA_2010_SAME_FLOWER_VISIT_FRUIT_ORIGINAL_4ARM"
          assert z["original_source"]["source_pre_light_real_pairs"]==301
          assert z["original_source"]["source_authentic_four_arm_pairs"]==153
          assert z["independently_published_primary_factual_protocol"]["original_source_Gamboa_distance_km"]<.05
          assert z["independently_published_primary_factual_protocol"]["original_global_label_complete_exclusion_IS_semantically_incomplete"]
          assert z["fourarm_result"]["original_single_balsa_I"]>0
          print("ALAN_ORIGINAL_KAYS2012_VETTED_SAME_FLOWER_PROTOCOL_SUCCESS",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-original301-Kays2012-mammal-sameflower-exclusion-audit-20261114
          path: original_kays_source/
          if-no-files-found: warn
          retention-days: 90
