name: ALAN Giavi same-meadow wet/drier cover vs original missing-arm audit

on:
  push:
    branches: [analysis/alan-predator-guild-switch-edi-20261118]
    paths:
      - "scripts/analysis/alan_giavi2021_same_meadow_wetdry_floral_20261120.py"
      - "tests/test_alan_giavi2021_same_meadow_wetdry_floral_20261120.py"
      - ".github/workflows/alan-giavi-same-meadow-wetdry-20261120.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-physical-meadow-true-wetdry-support:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original RData and source coefficient dependencies
        run: python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 pyreadr==0.5.2
      - name: Test same-meadow and same-event paired wet-dry floral arithmetic
        run: python -m unittest discover -s tests -p test_alan_giavi2021_same_meadow_wetdry_floral_20261120.py -v
      - name: Recompute original true wet and drier taxa within physical sampling events
        run: |
          python -m scripts.analysis.alan_giavi2021_same_meadow_wetdry_floral_20261120 \
            --out /tmp/alan_Giavi2021_original_same_meadow_wetdry_flower.json
      - name: Protect biological experimental units and no fabricated zeros
        run: |
          python - <<'PY'
          import json
          p='/tmp/alan_Giavi2021_original_same_meadow_wetdry_flower.json'
          x=json.load(open(p))
          assert x["schema"]=="alan_Giavi2021_same_meadow_same_event_wet_drier_flower_source_gate_v1"
          assert x["source_original_experimental_meadow_pairs"]==6
          assert x["source_sampling_meadow_pair_events"]==37
          assert x["source_plant_matched_daytime_flower_visits"]==193
          assert x["source_actual_physical_sites_not_193_independent_treatments"]
          assert x["source_no_pretreatment_flower_cover_assessed"]
          assert not x["wet_macro_recording_bias_mechanism_identified"]
          for t,d in x["results"].items():
              assert d["within_meadow_event_matched_wet_drier_flower"]["independent_original_meadow_site_pairs_with_qualifying_event"]<=2
              assert d["original_single_arm_plant_recording_selection"]["original_unpaired_plant_is_not_assumed_absent_biomass"]
              assert d["no_general_wet_specific_moderator_estimated"]
          print("GIAVI_SAME_SITE_SOURCE_OVERLAP_STOP_AND_ORIGINAL_DATA_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-Giavi2021-source-wetdry-same-meadow-event-and-arm-coverage
          path: /tmp/alan_Giavi2021_original_same_meadow_wetdry_flower.json
          retention-days: 60
          if-no-files-found: error
