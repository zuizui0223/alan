name: ALAN GloBI island-mainland source logic tests (NO real data download)

on:
  push:
    branches:
      - research/moth-gecko-flora-feasibility-20261111
    paths:
      - .github/workflows/alan-globi-source-synthetic-ci.yml
      - scripts/analysis/alan_globi_crossland_light_robust_20261111.py
      - scripts/analysis/alan_globi_full_v011_extract.py
      - tests/test_alan_globi_crossland_light_robust_20261111.py
      - tests/test_alan_globi_full_v011_extract.py
  pull_request:
    paths:
      - .github/workflows/alan-globi-source-synthetic-ci.yml
      - scripts/analysis/alan_globi_crossland_light_robust_20261111.py
      - scripts/analysis/alan_globi_full_v011_extract.py
      - tests/test_alan_globi_crossland_light_robust_20261111.py
      - tests/test_alan_globi_full_v011_extract.py

permissions:
  contents: read

jobs:
  verified-synthetic-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen computational dependencies
        run: |
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
      - name: Verify source code compiles
        run: |
          python -m py_compile scripts/analysis/alan_globi_crossland_light_robust_20261111.py scripts/analysis/alan_globi_full_v011_extract.py
      - name: Recheck geographic class overlap and GloBI source guards
        run: |
          python -m unittest discover -s tests -p 'test_alan_globi_crossland_light_robust_20261111.py' -v
          python -m unittest discover -s tests -p 'test_alan_globi_full_v011_extract.py' -v
      - name: Do not make an empirical claim from synthetic tests
        run: echo 'Synthetic behavior validated only; full GloBI source and ALAN coefficients are separately verified.'
