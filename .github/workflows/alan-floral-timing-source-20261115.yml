name: ALAN floral timing public source intake
on:
  push:
    branches: [analysis/alan-floral-timing-dependence-20261115]
    paths:
      - .github/workflows/alan-floral-timing-source-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Retrieve public metadata, primary tables and immutable diel-pollination source
        run: |
          python - <<'PY'
          import urllib.request, json, hashlib
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          out=Path('floral_source'); out.mkdir(exist_ok=True)
          urls={
            'mendeley_v1_page.html':'https://data.mendeley.com/datasets/xjmn5jhxyn/1',
            'mendeley_v1_files.json':'https://data.mendeley.com/public-api/datasets/xjmn5jhxyn/files?folder_id=root&version=1',
            'mendeley_v2_files.json':'https://data.mendeley.com/public-api/datasets/xjmn5jhxyn/files?folder_id=root&version=2',
            'mendeley_metadata.json':'https://data.mendeley.com/public-api/datasets/xjmn5jhxyn',
            'diel_original.csv':'https://raw.githubusercontent.com/liamkendall/bumble-bat/1945b7c114ad87000608ce6018d0280001c04ef1/data/DvN_LiteratureDataClean_2024-09-13.csv',
            'diel_traits.csv':'https://raw.githubusercontent.com/liamkendall/bumble-bat/1945b7c114ad87000608ce6018d0280001c04ef1/data/SppTraitData_clean.csv'
          }
          def fetch(item):
              name,url=item; result={'name':name,'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ALAN-primary-floral-source/1.0','Accept':'*/*'})
                  with urllib.request.urlopen(req,timeout=35) as r:
                      raw=r.read(15000001); result.update(http_status=r.status,content_type=r.headers.get('Content-Type'),final_url=r.url)
                  if len(raw)>15000000: raise ValueError('source_exceeds_15MB_bound')
                  if name.endswith('.json'):
                      data=json.loads(raw)
                      result['top_keys']=list(data)[:30] if isinstance(data,dict) else {'list_length':len(data)}
                  if name=='diel_original.csv':
                      sha=hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
                      assert sha=='39a82d966afcdde670603add1c881ace8791ffe9',sha
                      result['verified_git_blob_sha1']=sha
                  if name=='diel_traits.csv':
                      sha=hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
                      assert sha=='18381e550a7e405fe4f198909f0bb381bbecf1e0',sha
                      result['verified_git_blob_sha1']=sha
                  out.joinpath(name).write_bytes(raw)
                  result.update(status='ACQUIRED',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
              except Exception as e:
                  result.update(status='UNAVAILABLE',error=type(e).__name__,detail=str(e)[:200])
              return result
          with ThreadPoolExecutor(max_workers=4) as pool: receipt=list(pool.map(fetch,urls.items()))
          for x in receipt: print('SOURCE_RECEIPT',json.dumps(x))
          out.joinpath('source_receipts.json').write_text(json.dumps(receipt,indent=2))
          print('SOURCE_INTAKE_ONLY_NO_BIOLOGICAL_MODEL_FITTED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-floral-timing-public-source-20261115
          path: floral_source/
          retention-days: 90
          if-no-files-found: error
