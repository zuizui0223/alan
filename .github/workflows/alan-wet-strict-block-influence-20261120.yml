name: ALAN fixed-source wet-habitat spatial block influence and components
on:
  push:
    branches: [analysis/alan-wet-strict-block-influence-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-spatial-influence:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
      - name: Verify original source, no-replacement matching and block-influence methods
        run: python -m unittest discover -s tests -p test_alan_wet_strict_block_influence_20261120.py -v
      - name: Evaluate 187/133/128 cohorts with matched components and block bootstrap
        run: python scripts/analysis/alan_wet_strict_block_influence_20261120.py --out /tmp/alan_wet_strict_block_components.json
      - name: Preserve source-authenticated numerical audit
        uses: actions/upload-artifact@v4
        with:
          name: alan-wet-strict-block-and-components-original
          path: /tmp/alan_wet_strict_block_components.json
          retention-days: 30
