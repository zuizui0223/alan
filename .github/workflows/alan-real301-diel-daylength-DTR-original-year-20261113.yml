name: ALAN night day reproductive function conditional on true original site daylength and DTR
on:
  push:
    branches: [analysis/alan-diel-daylength-DTR-functional-transfer-20261113]
    paths:
      - scripts/analysis/alan_original_daylength_DTR_diel_repro_function_macro_20261113.py
      - tests/test_alan_original_daylength_DTR_diel_repro_function_macro_20261113.py
      - .github/workflows/alan-real301-diel-daylength-DTR-original-year-20261113.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5 scikit-learn==1.6.1
          python -m py_compile scripts/analysis/alan_original_daylength_DTR_diel_repro_function_macro_20261113.py
          python -m unittest discover -s tests -p test_alan_original_daylength_DTR_diel_repro_function_macro_20261113.py -v
  genuine-original-published-experiment-model:
    needs: source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore already MD5-authenticated original 301 field site×year and six REAL annual PCNL shards
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5 scikit-learn==1.6.1
          mkdir -p original_study downloads parts
          gh run download 43379308366 --repo zuizui0223/alan \
            --name alan-true-daynight-study-site-year-experiment-source-20261113 \
            --dir original_study
          echo '21b1fef1beb9e6238cfa47101b991815d4c0f33787b9737f834426dc3bab15af  original_study/original_DvN_field_site_year_outcome_pre_PCNLP.csv.gz' | sha256sum -c -
          gh run download 43380089481 --repo zuizui0223/alan \
            --pattern 'alan-original-DvN-PCNL1992_2021-year-shard-*' \
            --dir downloads
          test "$(find downloads -name 'diel_annual_shard_?.csv.gz' | wc -l)" -eq 6
          test "$(find downloads -name 'diel_annual_shard_?.json' | wc -l)" -eq 6
          find downloads -name 'diel_annual_shard_?.csv.gz' -exec cp {} parts/ \;
          find downloads -name 'diel_annual_shard_?.json' -exec cp {} parts/ \;
          git clone -q --depth 1 https://github.com/liamkendall/bumble-bat.git original_author
          test "$(git -C original_author hash-object data/SppTraitData_clean.csv)" = 18381e550a7e405fe4f198909f0bb381bbecf1e0
      - name: Rejoin the 30 exact original annual PCNL samples without redownloading 30 original GeoTIFFs
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_authentic_diel_siteyear_PCNL_6shards_20261113 collect \
            --source original_study/original_DvN_field_site_year_outcome_pre_PCNLP.csv.gz \
            --receipt original_study/original_DvN_source_year_geo_repro_audit.json \
            --partialdir parts --out original_rejoined
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          file=Path('original_rejoined/Diel_original_daynight_reproductive_1993_2022_priorPCNL1992_2021.csv.gz')
          receipt=json.loads(Path('original_rejoined/Diel_original_priorPCNL_source_receipt.json').read_text())
          actual=hashlib.sha256(file.read_bytes()).hexdigest()
          assert receipt['joined_file_sha256']==actual
          assert receipt['original_source_sha256']=='21b1fef1beb9e6238cfa47101b991815d4c0f33787b9737f834426dc3bab15af'
          assert receipt['annual_rasters_MD5_source_verified']==30 and receipt['source_pairs_full_pre_experiment_PCNL']==301
          print('ORIGINAL_EXPOSURE_CONTENT_IDENTICAL_BY_SOURCE_AND_30_YEAR_MANIFEST',actual)
          PY
      - name: Audit original author climate Git blobs and join field study site year month
        run: |
          set -euo pipefail
          test "$(git -C original_author hash-object data/DvN_Site_Daylength.csv)" = 97ace3708bc356d87ce4fcd2e00fc4f1987be949
          test "$(git -C original_author hash-object data/DvN_Site_DailyTemperatureRange.csv)" = f2f16164e96570e6acd5e6ab975295d2bcc6bd1f
      - name: True original field study bloom timing x daylength daily temperature range x prior PCNL
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p verified_natural_diel_environment
          python -m scripts.analysis.alan_original_daylength_DTR_diel_repro_function_macro_20261113 \
            --joined original_rejoined/Diel_original_daynight_reproductive_1993_2022_priorPCNL1992_2021.csv.gz \
            --receipt original_rejoined/Diel_original_priorPCNL_source_receipt.json \
            --trait original_author/data/SppTraitData_clean.csv \
            --day original_author/data/DvN_Site_Daylength.csv \
            --dtr original_author/data/DvN_Site_DailyTemperatureRange.csv \
            --out verified_natural_diel_environment/ALAN_301_OriginalDaylength_DTR_BloomNightFunction_PriorPCNL_20261113.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("verified_natural_diel_environment/ALAN_301_OriginalDaylength_DTR_BloomNightFunction_PriorPCNL_20261113.json").read_text())
          assert x["status"]=="AUTHENTIC_INDEPENDENT_PUBLISHED_ENVIRONMENT_PAIRS_GLOBAL_FIELD_BLOOM_ANALYSIS"
          assert x["base"]["original_complete_flower_bloom_pairs"]==196
          assert x["environmental_source_support"]["source_original_bloom_complete_pairs"]==196
          assert x["conclusion_limits"]["light_exposure_is_not_randomized_and_not_at_flower_lux"]
          print("TRUE_ORIGINAL_DIEL_DAYLENGTH_DTR_AUTHOR_SOURCE_AND_PRIORLIGHT_COMPLETED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-original301-daylength-DTR-bloom-functional-environment-20261113
          path: verified_natural_diel_environment/
          retention-days: 90
          if-no-files-found: warn
