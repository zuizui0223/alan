name: ALAN B global original 340 matched reproductive stages
on:
  push:
    branches: [analysis/alan-floral-timing-dependence-20261115]
    paths:
      - scripts/analysis/alan_B_global340_paired_stages_20261115.py
      - tests/test_alan_B_global340_paired_stages_20261115.py
      - .github/workflows/alan-B-global340-stage-pairs-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source replay dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Source inclusion and denominator safeguards
        run: python -m unittest discover -s tests -p 'test_alan_B_global340_paired_stages_20261115.py' -v
      - name: Retrieve original author 1652 treatment source and compute exact-matched stages
        run: python -m scripts.analysis.alan_B_global340_paired_stages_20261115
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-B-global-original340-stage-matched-20261115
          path: results/alan_B_global340_original_paired_reproductive_stages_20261115.json
          retention-days: 30
