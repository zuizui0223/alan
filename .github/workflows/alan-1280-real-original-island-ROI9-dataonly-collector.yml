name: ALAN 1280 genuine new island ROI9 photo IDs source-only collector
on:
  push:
    branches: [analysis/alan-batches02to05-originalROI9-20261108]
    paths:
      - .github/workflows/alan-1280-real-original-island-ROI9-dataonly-collector.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-original-1280-photos-without-reinference:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check true measurement and 3-distinct-taxon source reconciliation contracts
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          python -m unittest discover -s tests -p test_alan_merge_genuine_new_island_ROI9_first5_batches_20261108.py -v
          python -m py_compile scripts/analysis/alan_merge_genuine_new_island_ROI9_first5_batches_20261108.py
      - name: Download ONLY previous SOURCE-SIGNED original photo terminal CSV artifacts
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p first source
          gh run download 42447983019 --repo zuizui0223/alan \
            --name alan-source-8942-novel-island-UUID-disjoint256-batches --dir source
          gh run download 42447120685 --repo zuizui0223/alan \
            --name alan-256-genuine-new-independent-island-original-image-ROI9 --dir first
          for batch in 2 3 4 5; do
            mkdir -p "batch$batch"
            gh run download 42454468186 --repo zuizui0223/alan \
              --name "alan-original-novel-island-ROI9-batch-$batch" --dir "batch$batch"
          done
          echo 'e64f77d91ab9c19db7e38861baf96753395de5f1189f2599a1ac5cf1f55d8acd  source/progressive_8942_new_island_source_schedule.csv.gz' | sha256sum -c -
          echo '7789c5aa1916e5b1ff915d217744a80b990795cb24e362cff20007dda96ee94b  first/finished/new256_independent_island_actual_original_ROI9.csv.gz' | sha256sum -c -
      - name: Audit 1280 genuinely independent source photo IDs and their actual original nine-fraction ROIs
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_merge_genuine_new_island_ROI9_first5_batches_20261108 \
            --schedule source/progressive_8942_new_island_source_schedule.csv.gz \
            --source-receipt source/progressive_island_original_photo_schedule_receipt.json \
            --first first --batch2 batch2 --batch3 batch3 --batch4 batch4 --batch5 batch5 \
            --out results
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/ALAN_1280_actual_original_photo_ROI9_source_receipt.json').read_text())
          assert r['schema']=='ALAN_real1280_new_island_originalROI9_five_batch_merge_v1'
          assert r['new_distinct_photo_attempts']==1280
          assert r['independent_original_observation_UUIDs']==1280
          assert r['genuinely_measured_nine_palette_source_photos']==492
          assert r['original_photo_technical_unknowns']==788
          assert r['original_numerical_ROI9_5photo_3success_3accepted_site_support']['source_cell_years_with_5plus_attempts_3plus_real_WCVP_taxa']==3
          assert r['strict_photo_cell_support_not_added_to_historical_main']
          assert r['no_original_photo_image_bytes_saved']
          print('ALAN_TRUE_SOURCE_FIRST1280_NUMERICAL_ROI9_SIGNED',r['original_numerical_ROI9_5photo_3success_3accepted_site_support'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-real-first1280-original-island-numericROI9-signed-aggregate
          path: results/
          retention-days: 90
          if-no-files-found: warn
