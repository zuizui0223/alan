name: ALAN signed wetland vegetation 2000–2023 source comparison
on:
  push:
    branches: [analysis/alan-signed-wetland-greenness-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-ndvi-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original numerical requirements
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
      - name: Test NDVI signs, temporal QA and original source pins
        run: python -m unittest discover -s tests -p test_alan_signed_wetland_ndvi_20261120.py -v
      - name: Recompute actual signed growing-season vegetation changes
        run: python scripts/analysis/alan_signed_wetland_ndvi_20261120.py --out /tmp/alan_wetland_signed_ndvi_20261120.json
      - name: Archive independent numerical source evidence
        uses: actions/upload-artifact@v4
        with:
          name: alan-17wetland-signed-ndvi-source
          path: /tmp/alan_wetland_signed_ndvi_20261120.json
          retention-days: 30
