name: ALAN original GloPL experiment pollen limitation x directly observed autonomous selfing x preceding-year nightlight
on:
  push:
    branches: [analysis/alan-glopl-autonomous-selfing-priorlight-20261113]
    paths:
      - .github/workflows/alan-glopl-autonomous-selfing-priorPCNL-original-20261113.yml
      - scripts/analysis/alan_glopl_direct_autonomous_selfing_PCNLPrior_20261113.py
      - tests/test_alan_glopl_direct_autonomous_selfing_PCNLPrior_20261113.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-inference-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5
          python -m py_compile scripts/analysis/alan_glopl_direct_autonomous_selfing_PCNLPrior_20261113.py
          python -m unittest discover -s tests -p test_alan_glopl_direct_autonomous_selfing_PCNLPrior_20261113.py -v
  true-reproductive-experiment-source:
    needs: source-inference-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore 1419 original pollen-supplementation experiment-year-linked real PCNL and species-DIRECT reproductive traits
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5
          mkdir -p original/glopl original/traits
          gh run download 42754948691 --repo zuizui0223/alan --name alan-realGloPL-1419-experiments-1992-2014-true-priorPCNL-exposure --dir original/glopl
          test -s original/glopl/joined/GloPL_experimental_PL1993_2015_priorPCNL1992_2014.csv.gz
          test -s original/glopl/joined/original_GloPL_PCNLPrior_join_receipt.json
          gh run download 34191508045 --repo zuizui0223/island --name source-scale-batch-integration-34191508045 --dir original/traits
          echo '7e86170218814abe2845da9a0282aecfdc930819b9d0c439bae8df4a0679c577  original/traits/direct_species_trait_ledger.csv.gz' | sha256sum -c -
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('original/glopl/joined/GloPL_experimental_PL1993_2015_priorPCNL1992_2014.csv.gz')
          r=json.loads(Path('original/glopl/joined/original_GloPL_PCNLPrior_join_receipt.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['output_sha256']
          assert r['source_experiment_rows']==1419
          assert r['original_PCNLP_years_verified']==23
          assert r['historical_light_never_future_experiment']
          print('REAL_GLOPL_PL_PRIORLIGHT_YEAR_AND_SOURCE_SHA_VERIFIED')
          PY
      - name: Restore published independent daytime/nighttime exclusion experiment data
        run: |
          set -euo pipefail
          git clone --depth 1 -q https://github.com/liamkendall/bumble-bat.git original_daynight
          test "$(git -C original_daynight hash-object data/DvN_LiteratureDataClean_2024-09-13.csv)" = 39a82d966afcdde670603add1c881ace8791ffe9
          test "$(git -C original_daynight hash-object data/SppTraitData_clean.csv)" = 18381e550a7e405fe4f198909f0bb381bbecf1e0
      - name: Fit actual GloPL reproductive response and every recorded alternative provenance/trait-sensitivity
        timeout-minutes: 50
        run: |
          set -euo pipefail
          mkdir -p original_aggregate
          python -m scripts.analysis.alan_glopl_direct_autonomous_selfing_PCNLPrior_20261113 \
            --joined original/glopl/joined/GloPL_experimental_PL1993_2015_priorPCNL1992_2014.csv.gz \
            --receipt original/glopl/joined/original_GloPL_PCNLPrior_join_receipt.json \
            --ledger original/traits/direct_species_trait_ledger.csv.gz \
            --author_study original_daynight/data/DvN_LiteratureDataClean_2024-09-13.csv \
            --author_trait original_daynight/data/SppTraitData_clean.csv \
            --out original_aggregate/alan_glopl_selfing_moderation_source_20261113.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("original_aggregate/alan_glopl_selfing_moderation_source_20261113.json").read_text())
          assert a["status"]=="VERIFIED_ORIGINAL_EXPERIMENT_OUTCOME_PRIOR_PCNL_TRAIT_EXPLORATORY"
          assert abs(a["source"]["original_benchmark_beta"]-0.010715792632233193)<1e-8
          s=a["cohort_support"]["high_medium"]
          assert s["original_experiment_cases"]==725 and s["plant_species"]==242
          assert s["independent_original_publications"]==179
          assert a["source"]["excluded_multistate_and_unmeasured_selfing_as_unknown"]
          print("ALAN_TRUE_ORIGINAL_725_GLOPL_SELFING_PCNL_EXPERIMENT_MODELS_AUDITED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-original-GloPL-725-selfing-experiments-priorPCNL-20261113
          path: original_aggregate/alan_glopl_selfing_moderation_source_20261113.json
          retention-days: 90
          if-no-files-found: warn
