name: ALAN true riparian aquatic-origin insects and spider interception evidence

on:
  push:
    branches:
      - analysis/alan-biotic-aquatic-spider-original-20261118
  pull_request:
    paths:
      - 'scripts/analysis/alan_true_parkinson2020_aquatic_spider_20261118.py'
      - 'scripts/analysis/alan_wet_biotic_multiguild_source_20261118.py'
      - 'scripts/acquisition/alan_lu2026_pollination_supplement_source_gate.py'
      - 'scripts/acquisition/alan_lu2026_original_workbook_schema.py'
      - 'tests/test_alan_wet_biotic_multiguild_source_20261118.py'
      - 'tests/test_alan_true_parkinson2020_aquatic_spider_20261118.py'
      - '.github/workflows/alan-true-riparian-insect-spider-source-20261118.yml'
      - 'docs/ALAN_BIOTIC_INTERACTION_SOURCE_20261118.md'
      - 'results/all_species_forest/biotic_interactions/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-twenty-mesocosms-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original statistical source guards and install NumPy
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3
          python -m unittest discover -s tests -p test_alan_true_parkinson2020_aquatic_spider_20261118.py -v
      - name: Download only original-author source at immutable Git commit
        run: |
          set -euo pipefail
          mkdir -p /tmp/alan_original_biotic
          BASE="https://raw.githubusercontent.com/LizzParkinson/ALAN_Data/6985359fd29dfe321c740691bf97ea9d564db769"
          curl -fL --retry 3 --max-time 180 "$BASE/Spider%20and%20Prey%20Insect%20Abundance.csv" -o "/tmp/alan_original_biotic/Spider and Prey Insect Abundance.csv"
          curl -fL --retry 3 --max-time 180 "$BASE/Aquatic%20and%20Terrestrial%20Invertebrate%20Inputs.csv" -o "/tmp/alan_original_biotic/Aquatic and Terrestrial Invertebrate Inputs.csv"
          curl -fL --retry 3 --max-time 180 "$BASE/Spider%20Body%20Mass.csv" -o "/tmp/alan_original_biotic/Spider Body Mass.csv"
          test "$(git hash-object '/tmp/alan_original_biotic/Spider and Prey Insect Abundance.csv')" = "63965aaedae5254ea0064b9346a7fc2a8f7b610a"
          test "$(git hash-object '/tmp/alan_original_biotic/Aquatic and Terrestrial Invertebrate Inputs.csv')" = "4e2b7065d67e0604ca121ea26c96b5db6d64de94"
          test "$(git hash-object '/tmp/alan_original_biotic/Spider Body Mass.csv')" = "8ff2eefe6ff365e2b0f6eed038ed7b6db74247fc"
          echo "SOURCE_AUTHENTIC_THREE_ORIGINAL_GIT_BLOBS_OK"
      - name: Reanalyze aquatic-origin prey, terrestrial-origin prey, spider numbers and spider web captures
        run: |
          set -euo pipefail
          python scripts/analysis/alan_true_parkinson2020_aquatic_spider_20261118.py \
            --spider-source "/tmp/alan_original_biotic/Spider and Prey Insect Abundance.csv" \
            --aquatic-source "/tmp/alan_original_biotic/Aquatic and Terrestrial Invertebrate Inputs.csv" \
            --mass-source "/tmp/alan_original_biotic/Spider Body Mass.csv" \
            --out /tmp/alan_original_biotic/stage_separated_source_fit_20261118.json
      - name: Assert no invented treatment replication, moth pollination or plant fitness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/alan_original_biotic/stage_separated_source_fit_20261118.json').read_text())
          assert a['schema']=='alan_true_original_parkinson2020_riparian_predators_aquatic_insect_stage_sep_v1'
          assert a['source_units']['independent_original_mesocosms']==20
          assert a['source_units']['spider_csv_rows']==60
          assert a['source_units']['lit_mesocosms']==10
          assert a['source_units']['control_mesocosms']==10
          assert a['source_units']['raw_pan_invertebrate_total']==1992
          assert a['source_units']['spider_body_mass_has_no_mesocosm_ID_so_not_analysed_as_independent_unit']
          assert a['stage_effects']['Noctuidae_terrestrial_moth_insufficient']['moth_pollination_ALAN_effect']=='NOT ESTIMABLE'
          assert not a['moth_pollen_to_plant_reproduction_identified']
          print('ALAN_SOURCE_INTERACTION_STAGES_PASS',list(a['stage_effects']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-true-original-20mesocosm-aquatic-prey-spider-20261118
          path: /tmp/alan_original_biotic/stage_separated_source_fit_20261118.json
          if-no-files-found: warn
          retention-days: 90

  original-wet-flora-cross-guild-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute exact frozen wet plant and source-matched insect-predator guild inventory
        run: |
          set -euo pipefail
          python scripts/analysis/alan_wet_biotic_multiguild_source_20261118.py \
            --base results/all_species_forest \
            --out /tmp/alan_wet_biotic_multiguild_source_20261118.json
      - name: Guard source fidelity and nonpromotion of iNaturalist-linked hypothetical food webs
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_alan_wet_biotic_multiguild_source_20261118.py -v
          python - <<'PY'
          import json
          a=json.load(open('/tmp/alan_wet_biotic_multiguild_source_20261118.json'))
          assert a['schema']=='alan_wet_flora_adult_visitor_predator_multiguild_source_audit_20261118_v1'
          assert a['two_step_biotic_graph_support']['chains_with_at_least_one_non_iNaturalist_source_pair']==2
          assert a['documented_riparian_moth_adult_spider_chains']['original_moth_to_spider_source_rows']==8
          print('ALAN_BIOTIC_363_WET_PLANT_SOURCE_PROVENANCE_GATE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-363-wet-flora-adult-visitor-predator-guild-source-20261118
          path: /tmp/alan_wet_biotic_multiguild_source_20261118.json
          retention-days: 90
          if-no-files-found: error

  lu2026-five-block-pollination-original-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile exact published source gate to block invented or malformed data results
        run: python -m py_compile scripts/acquisition/alan_lu2026_pollination_supplement_source_gate.py
      - name: Source only actual 2026 Lu et al five paired-block DataS1 from official publication hosts
        run: |
          set -euo pipefail
          mkdir -p /tmp/alan_lu2026
          python scripts/acquisition/alan_lu2026_pollination_supplement_source_gate.py --out /tmp/alan_lu2026/original_data_availability.json
      - name: Report availability separately from actual biological effects
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/alan_lu2026/original_data_availability.json'))
          assert d['schema']=='alan_lu2026_alpine_pollination_real_DataS1_source_gate_v1'
          assert d['source_paper_original_independent_treatment_control_pairs']==5
          assert not d['meta_pollinator_replacement_coefficient_fitted']
          print('LU2026_ORIGINAL_DATA_AVAILABILITY_AND_WORKBOOK_STRUCTURE',d['status'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-lu2026-official-fiveblock-original-plant-pollinator-data-gate
          path: /tmp/alan_lu2026/original_data_availability.json
          retention-days: 90
          if-no-files-found: warn

  lu2026-actual-data-excel-readme-source-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only parse original five paired-block workbook
        run: |
          set -euo pipefail
          mkdir -p /tmp/alan_lu2026_original
          python scripts/acquisition/alan_lu2026_original_workbook_schema.py \
            --out /tmp/alan_lu2026_original/source_schema.json
      - name: Verify original EuropePMC hosted XLSX exact sha and block-aware inference STOP
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/alan_lu2026_original/source_schema.json'))
          assert a['schema']=='alan_lu2026_original_fiveblock_plant_pollinator_sheet_schema_v1'
          assert a['source_workbook_sha256']=='ba7e15e66986f64943a38fd294e49d7128cf7719d318578f6b805d29cde8f98f'
          assert a['original_independent_lit_dark_site_pairs']==5
          assert not a['source_plant_visitor_effects_fitted']
          print('LU2026_AUTHENTIC_README_AND_BLOCK_SCHEMA_PASS',[(k,v['source_rows_nonempty']) for k,v in a['raw_original_sheets'].items()])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-lu2026-author-original-DataS1-fiveblock-excel-source-schema
          path: /tmp/alan_lu2026_original/source_schema.json
          retention-days: 90
          if-no-files-found: warn
