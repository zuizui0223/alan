          a=json.load(open('/tmp/alan_wet_biotic_multiguild_source_20261118.json'))
          assert a['schema']=='alan_wet_flora_adult_visitor_predator_multiguild_source_audit_20261118_v1'
          assert a['two_step_biotic_graph_support']['chains_with_at_least_one_non_iNaturalist_source_pair']==2
          assert a['documented_riparian_moth_adult_spider_chains']['original_moth_to_spider_source_rows']==8
          print('ALAN_BIOTIC_363_WET_PLANT_SOURCE_PROVENANCE_GATE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-363-wet-flora-adult-visitor-predator-guild-source-20261118
          path: /tmp/alan_wet_biotic_multiguild_source_20261118.json
          retention-days: 90
          if-no-files-found: error

