name: ALAN authenticated 703-species first-stage slopes, effort and island-year controls
on:
  push:
    branches: [analysis/alan-species-slopes-firststage-20261115]
    paths:
      - scripts/analysis/alan_species_effortadjusted_firststage_20261115.py
      - .github/workflows/alan-703species-firststage-original-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  synthetic-method-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic signed-source gate invariants and opposing species slopes
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          python -m py_compile scripts/analysis/alan_species_effortadjusted_firststage_20261115.py
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from scripts.analysis.alan_species_effortadjusted_firststage_20261115 import prepare_support,site_arrays,fit_one
          site=[];flora=[]
          for island in 'ABCDEF':
              for year in (2019,2021,2023):
                  for j in range(10):
                      key=dict(island=island,latbin=j,lonbin=j,year=year)
                      site.append(dict(**key,pcnl_1992_to_previous_year_mean_log1p=.02*j,log_obs=float(np.log1p(5+(j%3)))))
                      if j>=3:flora.append(dict(**key,species='lit'))
                      if j<=6:flora.append(dict(**key,species='dark'))
          taxa=pd.DataFrame([dict(species='lit',autonomy='autonomous',genus='A'),
                             dict(species='dark',autonomy='absent',genus='B')])
          site,pos,counts,selected,meta=prepare_support(pd.DataFrame(site),pd.DataFrame(flora),taxa)
          assert selected=={'lit','dark'},(selected,meta)
          site,audit=site_arrays(site)
          for species,expected in (('lit',1),('dark',-1)):
              ids=pos.loc[pos.species.eq(species),'sid'].to_numpy()
              strata=counts.loc[counts.species.eq(species),'iy'].to_numpy()
              fit=fit_one(site,strata,ids)
              assert fit['ok'],fit
              assert fit['beta_pp']*expected >0,fit
              assert fit['n_strata']==18,fit
          print('ALAN_FIRSTSTAGE_SYNTHETIC_SIGN_AND_SUPPORT_PASS')
          PY
  original-703-species:
    needs: synthetic-method-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore only actual SHA-audited source photo sites and botanical source
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          mkdir -p source/pcnl source/globi original_batches groups direct_traits verified
          gh run download 42624285048 --repo zuizui0223/alan --name alan-full93m-actual-PCNL1992-2024-moth-positive-macro --dir source/pcnl
          echo '440a8313d71168e0a4dfd2f41a7bef45623abb068b07e3282026f1c35dccbd2c  source/pcnl/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz' | sha256sum -c -
          gh run download 41976552977 --repo zuizui0223/mois --name mois-ALAN-GloBI-stage2-actual-records-2019-2024-supported-source --dir source/globi
          echo 'a6b97aa0941215d2f645e4c4fbf19490492b93680a7d7c0502814c7a66902994  source/globi/GloBI_stage2_signed_extension.csv.gz' | sha256sum -c -
          gh run download 42616279235 --repo zuizui0223/alan --pattern 'alan-93m-fullflora-moth-island-group-*' --dir original_batches
          test "$(find original_batches -name 'allflora-island-group-??.sqlite' | wc -l)" -eq 16
          test "$(find original_batches -name 'allflora-island-group-??.json' | wc -l)" -eq 16
          find original_batches -name 'allflora-island-group-??.sqlite' -exec cp {} groups/ \;
          find original_batches -name 'allflora-island-group-??.json' -exec cp {} groups/ \;
          gh run download 34191508045 --repo zuizui0223/island --name source-scale-batch-integration-34191508045 --dir direct_traits
          echo '7e86170218814abe2845da9a0282aecfdc930819b9d0c439bae8df4a0679c577  direct_traits/direct_species_trait_ledger.csv.gz' | sha256sum -c -
      - name: Real first-stage slopes and two geographically separated island folds
        timeout-minutes: 95
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_species_effortadjusted_firststage_20261115 \
            --sites source/pcnl/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz \
            --globi source/globi/GloBI_stage2_signed_extension.csv.gz \
            --groups groups \
            --ledger direct_traits/direct_species_trait_ledger.csv.gz \
            --out verified/alan_703species_effortadjusted_firststage_original.json
          python - <<'PY'
          import json
          a=json.load(open('verified/alan_703species_effortadjusted_firststage_original.json'))
          assert a['support']['strict_selfing_species']==703,a['support']
          assert a['support']['eligible_islands']==243
          assert a['support']['eligible_photo_site_years']==72472
          assert a['site_covariate_audit']['population_density_covariate'].startswith('NOT_PRESENT')
          assert a['limits']['no_true_species_absence']
          print('ALAN_AUTHENTIC_FIRSTSTAGE_SOURCE_QUALITY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-703species-firststage-original-20261115
          path: verified/
          retention-days: 90
          if-no-files-found: warn
