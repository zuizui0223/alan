name: ALAN EERES original taxonomy labels for drift comparability

on:
  push:
    branches: [analysis/alan-arthropod-search-expansion-20261122]
    paths:
      - 'scripts/analysis/alan_eeres2021_drift_taxonomy_schema_20261124.py'
      - '.github/workflows/alan-eeres2021-taxonomy-schema-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-taxonomy-schema-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read original author workbook and no source rows
        run: |
          python -m pip install 'openpyxl==3.1.5'
          python scripts/analysis/alan_eeres2021_drift_taxonomy_schema_20261124.py --output results/eeres2021_taxonomy_schema_20261124.json
      - name: Store metadata only, not the original Excel or biological observations
        uses: actions/upload-artifact@v4
        with:
          name: alan-eeres2021-source-taxonomy-schema
          path: results/eeres2021_taxonomy_schema_20261124.json
