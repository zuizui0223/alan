name: ALAN original global reproductive study x actual 2019 visitor population-year
on:
  push:
    branches: [analysis/alan-authentic-populationyear-visitor-repro-20261114]
    paths:
      - scripts/analysis/alan_real_Wenzell2019_populationyear_pollinator_reproduction_20261114.py
      - scripts/analysis/alan_primary_Marques2015_bat_bird_reproductive_table_audit_20261114.py
      - tests/test_alan_real_Wenzell2019_populationyear_pollinator_reproduction_20261114.py
      - tests/test_alan_primary_Marques2015_bat_bird_reproductive_table_audit_20261114.py
      - .github/workflows/alan-authentic-Wenzell2019-guild-reproduction-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m py_compile scripts/analysis/alan_real_Wenzell2019_populationyear_pollinator_reproduction_20261114.py
          python -m unittest discover -s tests -p test_alan_real_Wenzell2019_populationyear_pollinator_reproduction_20261114.py -v
          python -m py_compile scripts/analysis/alan_primary_Marques2015_bat_bird_reproductive_table_audit_20261114.py
          python -m unittest discover -s tests -p test_alan_primary_Marques2015_bat_bird_reproductive_table_audit_20261114.py -v
  original-source-guild-reproductive-bridge:
    needs: source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore authentic 301 original day/night field site-year source and Wenzell direct raw
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          mkdir -p fieldsource
          gh run download 43379308366 --repo zuizui0223/alan \
            --name alan-true-daynight-study-site-year-experiment-source-20261113 \
            --dir fieldsource
          echo '21b1fef1beb9e6238cfa47101b991815d4c0f33787b9737f834426dc3bab15af  fieldsource/original_DvN_field_site_year_outcome_pre_PCNLP.csv.gz' | sha256sum -c -
          git clone -q --depth 1 https://github.com/liamkendall/bumble-bat.git original_global
          git clone -q --depth 1 https://github.com/KWenzell/Castilleja_sessiliflora_exclusion.git original_direct
          test "$(git -C original_global hash-object data/DvN_LiteratureDataClean_2024-09-13.csv)" = 39a82d966afcdde670603add1c881ace8791ffe9
          test "$(git -C original_direct hash-object Cast_pollExclData_submission20240310.csv)" = 85491786cd9381120bea598b9a9d73ae08acd5ad
          test "$(git -C original_direct hash-object Cast_pollExclPop_submission20240310.csv)" = 6a620db6f3ffb4425ff48b114056ecf9907dbb5e
          test "$(git -C original_direct hash-object Cast_pollExclVisitationData_submission20240310.csv)" = 050f2db829a7ce06c7007d85fbb8c4c1010122d1
      - name: Reconstruct true population-year insect visitor versus measured day and night fruit set
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p original_match
          python -m scripts.analysis.alan_real_Wenzell2019_populationyear_pollinator_reproduction_20261114 \
            --preflight fieldsource/original_DvN_field_site_year_outcome_pre_PCNLP.csv.gz \
            --author original_global/data/DvN_LiteratureDataClean_2024-09-13.csv \
            --wraw original_direct/Cast_pollExclData_submission20240310.csv \
            --wpop original_direct/Cast_pollExclPop_submission20240310.csv \
            --wvis original_direct/Cast_pollExclVisitationData_submission20240310.csv \
            --output original_match/ALAN_Wenzell2019_true_populationyear_visitor_and_fruitset_SOURCE_20261114.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("original_match/ALAN_Wenzell2019_true_populationyear_visitor_and_fruitset_SOURCE_20261114.json").read_text())
          assert s["status"]=="AUTHENTIC_ONE_PAPER_2019_POPULATION_YEAR_VISITOR_REPRODUCTIVE_LINK"
          q=s["ecological_units"]
          assert q["original_direct_2019_population_years"]==7
          assert q["original_direct_2019_individual_treatment_plants"]==204
          assert q["original_301_original_global_meta_rows_siteyear_matched"]==6
          assert q["distance_strict_at_most_1km_source_matches"]==5
          assert q["distance_extra_1_to_2km_provisional_source_matches"]==1
          assert q["meta_source_and_direct_fruitset_sign_agreement"]==6
          assert s["epistemic_limits"]["one_independent_original_published_study_not_seven_studies"]
          print("ORIGINAL_GLOBAL_META_TO_DIRECT_SAME_POPULATION_YEAR_GUILD_REPRODUCTION_VERIFIED",flush=True)
          PY
      - name: Verify second independent study bat-versus-bird published direct fruit and seed source table
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_primary_Marques2015_bat_bird_reproductive_table_audit_20261114 \
            --author original_global/data/DvN_LiteratureDataClean_2024-09-13.csv \
            --output original_match/ALAN_Marques2015_primary_table_bat_hummingbird_fruitseed_20261114.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("original_match/ALAN_Marques2015_primary_table_bat_hummingbird_fruitseed_20261114.json").read_text())
          assert q["status"]=="AUTHENTIC_PUBLIC_PRIMARY_FRUIT_SEED_TABLE_VERIFIED_STUDY_FIELD_VISITORS_YEAR_NOT_PROVEN"
          assert q["functional_source_descriptive"]["night_reproductive_fruit_set_exceeds_day"]
          assert not q["functional_source_descriptive"]["visitor_field_year_explicitly_proved_against_secondary_year_2010"]
          assert q["provenance"]["source_global_reproductive_metric_pairs"]==2
          print("ORIGINAL_MARQUES_BAT_HUMMINGBIRD_STUDY_SOURCE_TABLE_VERIFIED",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-genuine-Wenzell2019-populationyear-visitors-fruitset-20261114
          path: original_match/
          if-no-files-found: warn
          retention-days: 90
