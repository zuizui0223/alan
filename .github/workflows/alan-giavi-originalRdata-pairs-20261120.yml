name: ALAN Giavi original Zenodo RData true six meadow plant and flower support
on:
  push:
    branches: [analysis/alan-predator-guild-switch-edi-20261118]
    paths:
      - "scripts/analysis/alan_giavi2021_originalRdata_meadowpair_support_20261120.py"
      - ".github/workflows/alan-giavi-originalRdata-pairs-20261120.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-Giavi-source-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original RData reader, robust data and numerical tools
        run: python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 pyreadr==0.5.2
      - name: Recover source-original 2021 Zenodo DAT and original floral abundance / six meadow pairs
        run: |
          python -m scripts.analysis.alan_giavi2021_originalRdata_meadowpair_support_20261120 \
            --out /tmp/alan_Giavi2021_source_Rdata_6meadow_support.json
      - name: Check original experiment and no trait-moderation promotion without common source
        run: |
          python - <<'PY'
          import json
          x=json.load(open("/tmp/alan_Giavi2021_source_Rdata_6meadow_support.json"))
          assert x["schema"]=="alan_Giavi2021_true_Zenodo_original6meadow_pair_floral_resource_source_gate_v1"
          assert x["source_original_RData_md5"]=="f60b21d82c163cbb53520fda0bc61985"
          assert x["source_original_distinct_meadow_pairs"]==6
          assert x["source_original_treatment_levels"]==["C","T"]
          assert not x["within_site_wetness_response_model_fitted"]
          assert not x["source_original_ALAN_plant_moisture_mechanism_causal_mediation_fitted"]
          assert x["no_assumed_zero_for_unreported_plants"]
          print("GIAVI_AUTHOR_ORIGINAL_RDATA_TRUE_6_MEADOW_SOURCE_GATE_SUCCESS",flush=True)
          print("GIAVI_COMMON_SUPPORT",x["source_meadow_moisture_support"],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-Giavi2021-original-Zenodo-RData-6meadow-source-support
          path: /tmp/alan_Giavi2021_source_Rdata_6meadow_support.json
          if-no-files-found: error
          retention-days: 90
