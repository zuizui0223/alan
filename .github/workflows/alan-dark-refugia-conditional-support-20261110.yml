name: ALAN real dark-refuge conditional overlap support

on:
  push:
    branches: [analysis/alan-dark-refugia-spatial-metrics-20261110]
    paths:
      - scripts/analysis/alan_dark_refugia_conditional_support_20261110.py
      - .github/workflows/alan-dark-refugia-conditional-support-20261110.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-conditional-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m py_compile scripts/analysis/alan_dark_refugia_conditional_support_20261110.py
      - name: Restore signed real PCNL2024 GSHHG landmask source output
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download 42764291562 --repo zuizui0223/alan \
            --name alan-2025-true-island-2024PCNL-dark-refugia-landmasked-pilot \
            --dir source
          test -s source/real_original_island_dark_refugia_2025_photo_sites_PCNL2024.csv.gz
          test -s source/dark_refugia_original_real_source_receipt.json
          echo '32327abb37ee85f3d1d9e7446d9d742fb5adf1457dab60fae1aae791c29f7837  source/real_original_island_dark_refugia_2025_photo_sites_PCNL2024.csv.gz' | sha256sum -c -
      - name: Test whether real island-level fragmentation contrasts are identifiable
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_dark_refugia_conditional_support_20261110 \
            --source source/real_original_island_dark_refugia_2025_photo_sites_PCNL2024.csv.gz \
            --receipt source/dark_refugia_original_real_source_receipt.json \
            --out audit/real_2025_dark_refugia_conditional_support.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-2025-real-dark-refugia-independent-contrast-positivity
          path: audit/real_2025_dark_refugia_conditional_support.json
          if-no-files-found: warn
          retention-days: 90
