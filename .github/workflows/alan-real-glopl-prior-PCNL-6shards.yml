name: ALAN true GloPL experimental pollen limitation x 1992-2014 prior PCNL source join
on:
  push:
    branches: [analysis/alan-npms-glopl-pl-observation-support-20261110]
    paths:
      - .github/workflows/alan-real-glopl-prior-PCNL-6shards.yml
      - scripts/analysis/alan_glopl_prior_PCNL_6year_shard_20261110.py
      - tests/test_alan_glopl_prior_PCNL_6year_shard_20261110.py
  pull_request:
    branches: [analysis/alan-island-nightshift-species-pair-feasibility-20261110]
    paths:
      - .github/workflows/alan-real-glopl-prior-PCNL-6shards.yml
      - scripts/analysis/alan_glopl_prior_PCNL_6year_shard_20261110.py
      - tests/test_alan_glopl_prior_PCNL_6year_shard_20261110.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 rasterio==1.4.3 scipy==1.15.2
          python -m py_compile scripts/analysis/alan_glopl_prior_PCNL_6year_shard_20261110.py
          python -m unittest discover -s tests -p test_alan_glopl_prior_PCNL_6year_shard_20261110.py -v
  actual-pcnl-annual-groups:
    needs: source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      GDAL_CACHEMAX: '512'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore original year_of_study only source and exact published PCNL hashes
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 rasterio==1.4.3 scipy==1.15.2
          mkdir -p source
          gh run download 42753594112 --repo zuizui0223/alan \
            --name alan-GloPL-actual-experiment-year-georeferenced-prior1992-PCNL-support \
            --dir source
          echo 'ac8e8d191edbe175fa0f72cb61387eece986d31487ae2db9cdf3619c58d80930  source/original_GloPL_experiment_year_georeferenced_1993_2015.csv.gz' | sha256sum -c -
      - name: Acquire only this disjoint PCNL year shard and sample true GloPL original experimental coordinates
        timeout-minutes: 72
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_glopl_prior_PCNL_6year_shard_20261110 worker \
            --source source/original_GloPL_experiment_year_georeferenced_1993_2015.csv.gz \
            --manifest config/alan_pcnl_1992_2024_zenodo_v3_md5.json \
            --shard ${{ matrix.shard }} --raster-dir original_annual_rasters --out verified_year_shard
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: alan-realGloPL-priorPCNL-originalyear-shard-${{ matrix.shard }}
          path: verified_year_shard/
          retention-days: 90
          if-no-files-found: error
  actual-GloPL-prior-ALAN-source-collector:
    needs: [source-tests,actual-pcnl-annual-groups]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 scipy==1.15.2
          mkdir -p source/downloads source/annualparts
          gh run download 42753594112 --repo zuizui0223/alan \
            --name alan-GloPL-actual-experiment-year-georeferenced-prior1992-PCNL-support \
            --dir source
          echo 'ac8e8d191edbe175fa0f72cb61387eece986d31487ae2db9cdf3619c58d80930  source/original_GloPL_experiment_year_georeferenced_1993_2015.csv.gz' | sha256sum -c -
          gh run download "$GITHUB_RUN_ID" --repo zuizui0223/alan \
            --pattern 'alan-realGloPL-priorPCNL-originalyear-shard-*' --dir source/downloads
          test "$(find source/downloads -name 'glopl_pcnl_shard_?.csv.gz' | wc -l)" -eq 6
          test "$(find source/downloads -name 'glopl_pcnl_shard_?.json' | wc -l)" -eq 6
          find source/downloads -name 'glopl_pcnl_shard_?.csv.gz' -exec cp {} source/annualparts/ \;
          find source/downloads -name 'glopl_pcnl_shard_?.json' -exec cp {} source/annualparts/ \;
          python -m scripts.analysis.alan_glopl_prior_PCNL_6year_shard_20261110 collect \
            --source source/original_GloPL_experiment_year_georeferenced_1993_2015.csv.gz \
            --partials source/annualparts --out joined
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('joined/original_GloPL_PCNLPrior_join_receipt.json').read_text())
          assert d['source_experiment_rows']==1419
          assert d['original_PCNLP_years_verified']==23
          assert d['GloPL_PL_outcome_not_used_to_choose_source_cohort']
          assert d['historical_light_never_future_experiment']
          print('ALAN_REAL_GLOPL_1993_2015_PL_VS_PRIOR_SATELLITE_LIGHT_SUPPORT',json.dumps(d,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: alan-realGloPL-1419-experiments-1992-2014-true-priorPCNL-exposure
          path: joined/
          retention-days: 90
          if-no-files-found: error
