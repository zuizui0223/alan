name: ALAN source-only 512 novel island observations concentrated into genuine site-year opportunities
on:
  push:
    branches: [analysis/alan-site-densification-20261108]
    paths:
      - .github/workflows/alan-source-island-site-densification-512.yml
      - scripts/acquisition/alan_site_densification_from_8942_20261108.py
      - tests/test_alan_site_densification_from_8942_20261108.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authentic-new-photo-site-year-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no hue inference and original observation UUID/site threshold contracts
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3
          python -m unittest discover -s tests -p test_alan_site_densification_from_8942_20261108.py -v
          python -m py_compile scripts/acquisition/alan_site_densification_from_8942_20261108.py
      - name: Retrieve exact signed 8942 source-only UUID photo schedule, never obtain source images
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download 42447983019 --repo zuizui0223/alan \
            --name alan-source-8942-novel-island-UUID-disjoint256-batches --dir source
          echo 'e64f77d91ab9c19db7e38861baf96753395de5f1189f2599a1ac5cf1f55d8acd  source/progressive_8942_new_island_source_schedule.csv.gz' | sha256sum -c -
      - name: Freeze 512 genuinely new photo UUIDs after first 1280 as site-focused independent source
        run: |
          set -euo pipefail
          python -m scripts.acquisition.alan_site_densification_from_8942_20261108 \
            --schedule source/progressive_8942_new_island_source_schedule.csv.gz \
            --receipt source/progressive_island_original_photo_schedule_receipt.json \
            --out site_density
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('site_density/alan_512_site_densification_original_source_receipt.json')
          r=json.loads(p.read_text())
          assert r['schema']=='ALAN_new_original_island_site_densification_512_source_v1'
          assert r['new_original_photo_observation_UUIDs_in_source']==512
          assert r['new_actual_source_GSHHG_islands']==20
          assert r['new_actual_source_photo_cell_years']==61
          assert r['preselected_source_first5_original_1280_not_reused']
          assert r['two_disjoint_256photo_source_work_waves']==2
          counts=r['potential_5plus_attempt_3plus_accepted_site_counts']
          assert counts['prior_original_five_batches']==3
          assert counts['original_breadth_first_seven_batches']==6
          assert counts['with_512_new_site_targeted_photographs']==60
          assert r['no_photo_pixels_obtained_or_colour_relabelled']
          assert r['color_photo_measurements_from_previous_five_batches_were_NOT_used_to_select_targets']
          print('ALAN_NEW_SITE_DENSE512_GENUINE_SOURCE_ONLY_AUDIT_SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-original-observation-512-site-densification-source-no-colour
          path: site_density/
          retention-days: 90
          if-no-files-found: error
