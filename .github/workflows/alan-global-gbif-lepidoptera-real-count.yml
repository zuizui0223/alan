name: ALAN source-verified global Lepidoptera moth and butterfly human observation scale
on:
  push:
    branches: [analysis/alan-global-moth-source-census-20261110]
    paths:
      - scripts/acquisition/alan_gbif_global_lepidoptera_source_count_20261110.py
      - .github/workflows/alan-global-gbif-lepidoptera-real-count.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-GBIF-global-taxon-and-country-counts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify executable syntax and inspect real worldwide GBIF occurrence count API
        run: |
          set -euo pipefail
          python -m py_compile scripts/acquisition/alan_gbif_global_lepidoptera_source_count_20261110.py
          python -m scripts.acquisition.alan_gbif_global_lepidoptera_source_count_20261110 \
            --out audit/alan_real_global_moth_butterfly_source_count.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit/alan_real_global_moth_butterfly_source_count.json')
          r=json.loads(p.read_text())
          assert r['source_human_observations_only'] and r['source_hasCoordinates']
          assert r['moth_paraphyletic_not_distinguishable_by_taxon_remainder']
          assert len(r['preselected_country_source_counts'])==20
          assert r['global_source_counts']['lepidoptera_all']['n_actual_GBIF_occurrence_records']>0
          print('ALAN_TRUE_GLOBAL_GBIF_LEPIDOPTERA_COUNTS_VERIFIED',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-GBIF-global2013to2025-genuine-moth-butterfly-observer-source-count
          path: audit/alan_real_global_moth_butterfly_source_count.json
          retention-days: 90
          if-no-files-found: warn
