name: ALAN original two-region insect-guild light response and measured Swiss floral cover
on:
  push:
    branches: [analysis/alan-twofield-measured-guild-light-flowercover-20261114]
    paths:
      - scripts/analysis/alan_two_region_original_guild_flowercover_20261114.py
      - tests/test_alan_two_region_original_guild_flowercover_20261114.py
      - .github/workflows/alan-two-original-regions-guild-flowercover-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-real-two-region-experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check original field study source mathematical and biological guards
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 openpyxl==3.1.5 pyreadr==0.5.2 scipy==1.15.2
          python -m py_compile scripts/analysis/alan_two_region_original_guild_flowercover_20261114.py
          python -m unittest discover -s tests -p test_alan_two_region_original_guild_flowercover_20261114.py -v
      - name: Restore author SHA-pinned Swiss 2016 and Tibetan 2024 true lit-unlit guild data
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p actual_two_region
          python -m scripts.analysis.alan_two_region_original_guild_flowercover_20261114 \
            --out actual_two_region/ALAN_original_Tibet_Swiss_light_guild_flowercover_twofield_20261114.json
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path("actual_two_region/ALAN_original_Tibet_Swiss_light_guild_flowercover_twofield_20261114.json").read_text())
          assert z["status"]=="REAL_ORIGINAL_TWO_STUDIES_SITE_BLOCK_HARMONIZED_VISITS_NO_EFFECTIVE_POLLEN_META"
          s=z["sources"]
          assert s["Swiss_Giavi2021"]["field_experiments"]==6
          assert s["Swiss_Giavi2021"]["original_record_rows"]==1884
          assert s["Tibet_Lu2026"]["field_experimental_blocks"]==5
          assert s["Tibet_Lu2026"]["original_record_rows"]==400
          assert s["published_independent_original_papers"]==2
          assert all(x["two_primary_studies_only"] for x in z["cross_field_difference_NOT_meta"].values())
          assert z["source_methodological_caveats"]["no_island_mainland_experiment"]
          print("ALAN_REAL_ORIGINAL_TWO_FIELD_REGION_GUILD_FLOWER_COVER_AND_DIEL_SOURCE_VERIFIED",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-original-swiss-tibet-twofield-guild-plantcover-20261114
          path: actual_two_region/
          retention-days: 90
          if-no-files-found: warn
