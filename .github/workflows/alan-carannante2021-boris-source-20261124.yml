name: ALAN Carannante 2021 Bern public aquatic-insect data source gate

on:
  push:
    branches: [analysis/alan-arthropod-search-expansion-20261122]
    paths:
      - 'scripts/acquisition/alan_carannante2021_boris_source_gate_20261124.py'
      - 'tests/test_alan_carannante2021_boris_source_gate_20261124.py'
      - '.github/workflows/alan-carannante2021-boris-source-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-official-university-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source identity and official domains, no success by article text
        run: python -m unittest discover -s tests -p 'test_alan_carannante2021_boris_source_gate_20261124.py' -v
      - name: Probe legacy BORIS and new BORIS Portal public metadata for source file leads
        run: |
          python scripts/acquisition/alan_carannante2021_boris_source_gate_20261124.py \
            --output results/alan_carannante2021_boris_source_gate_20261124.json
      - name: Archive metadata receipt only, never guessed original data
        uses: actions/upload-artifact@v4
        with:
          name: alan-carannante2021-bern-boris-public-source-receipt
          path: results/alan_carannante2021_boris_source_gate_20261124.json
