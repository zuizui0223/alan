name: ALAN actual Korean moth source negative slope cross-year and leave-island-out checks
on:
  push:
    branches: [analysis/alan-korean-island-real-moth-nightlight-20261110]
    paths:
      - scripts/analysis/alan_korean_moth_priorpcnl_robustness_20261110.py
      - .github/workflows/alan-korean-moth-historical-robustness.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-prior-light-sampling-robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 \
            statsmodels==0.14.5 rasterio==1.4.3 openpyxl==3.1.5
          python -m py_compile scripts/analysis/alan_korean_moth_priorpcnl_robustness_20261110.py
          python -m unittest discover -s tests -p test_alan_korean_moth_count_rarefied_priorpcnl_20261110.py -v
      - name: Use exact genuine 377 source site-years and previously MD5-confirmed 17 raster years
        run: |
          set -euo pipefail
          mkdir -p signed
          gh run download 42773386737 --repo zuizui0223/alan \
            --name alan-korea-moths-377siteyears-authentic-prior-PCNL-complete --dir signed
          echo '8a790f57024c93e486f957f15454339896ed9cfd967fff43ef77d24085a18a72  signed/korean_30island_377_actual_moth_siteyear_prior_PCNL_yearminus1.csv.gz' | sha256sum -c -
          python -m scripts.analysis.alan_korean_moth_priorpcnl_robustness_20261110 \
            --source signed/korean_30island_377_actual_moth_siteyear_prior_PCNL_yearminus1.csv.gz \
            --receipt signed/korean_30island_prior_PCNL_complete_source_receipt.json \
            --out real_robust/alan_real_korean_moth_light_island_sensitivity.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('real_robust/alan_real_korean_moth_light_island_sensitivity.json').read_text())
          assert r["source_observed_moth_survey_site_years"]==377
          assert r["source_actual_moth_specimens"]==30442
          assert r["original_primary_20individual_result_preserved"]
          assert r["no_multiple_test_significance_selected"]
          print("ALAN_REAL_KOREA_MOTH_SOURCE_FDR_LOIO_CHECKS_SUCCESS",
                json.dumps(r,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-30island-original-moths-prior-ALAN-leaveisland-FDR-and-eras
          path: real_robust/alan_real_korean_moth_light_island_sensitivity.json
          retention-days: 90
          if-no-files-found: warn
