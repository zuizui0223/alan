name: ALAN genuine same-site dawn flower-resource window
on:
  push:
    branches: [analysis/alan-floral-timing-dependence-20261115]
    paths:
      - scripts/analysis/alan_Grognuz2026_same_date_flower_resource_window_20261115.py
      - tests/test_alan_Grognuz2026_same_date_flower_resource_window_20261115.py
      - docs/ALAN_H3_SAME_SITE_DAWN_COFLOWERING_20261115.md
      - .github/workflows/alan-Grognuz2026-dawn-coavailability-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-dawn-coavailability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate actual circular-time and site-grain source guards
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m unittest discover -s tests -p 'test_alan_Grognuz2026_same_date_flower_resource_window_20261115.py' -v
      - name: Download exact original public Mendeley v1 flower movement file
        run: |
          set -euo pipefail
          mkdir -p dawn_original
          python - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          u='https://data.mendeley.com/public-files/datasets/xjmn5jhxyn/files/1a9786c3-4471-4cad-87d9-dba823747cbe/file_downloaded'
          request=urllib.request.Request(u,headers={'User-Agent':'ALAN-real-H3-dawn-source/1.0'})
          with urllib.request.urlopen(request,timeout=60) as r: raw=r.read(54774)
          assert len(raw)==54773,'official source size changed'
          assert hashlib.sha256(raw).hexdigest()=='887d6f4b2a22216a9f08988c0eb30f03ed6a3d3476c1e5f6e7192a06579505a0'
          Path('dawn_original/original_240820_CICY_RESULTS.csv').write_bytes(raw)
          print('REAL_DAWN_SRC_SHA',hashlib.sha256(raw).hexdigest())
          PY
      - name: Compute all four petal transition bounds and inspect sign-sensitivity
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_Grognuz2026_same_date_flower_resource_window_20261115 \
            --source dawn_original/original_240820_CICY_RESULTS.csv \
            --out dawn_original/ALAN_H3_crossflower_dawn_stage_bounded_aggregate.json
          python - <<'PY'
          import json,math
          from pathlib import Path
          z=json.loads(Path('dawn_original/ALAN_H3_crossflower_dawn_stage_bounded_aggregate.json').read_text())
          assert z['matched_true_site_date_pairs']==46
          assert z['actual_silene_close_event_count']==137
          assert z['actual_malva_open_event_count']==82
          q=z['site_equal_stage_window_sensitivity']
          begin=q['both_transition_begun']['150']
          lower=q['conservative_both_fully_open']['150']
          upper=q['permissive_partially_open']['150']
          assert math.isclose(begin['lit_site_equal_mean_minutes'],44.44444444444444)
          assert math.isclose(begin['dark_site_equal_mean_minutes'],34.1875)
          assert math.isclose(begin['lit_minus_dark_minutes'],10.256944444444443)
          assert math.isclose(upper['lit_minus_dark_minutes'],-4.883333333333326)
          assert math.isclose(lower['lit_minus_dark_minutes'],.625)
          restrict=z['early_closure_selection_sensitivity']['started_transitions_only_5hour_window']
          assert restrict['observed_site_days']==42
          assert restrict['lit_minus_dark_minutes']<0
          assert z['H3_true_plant_pollinator_timing_mismatch_estimable'] is False
          assert z['no_preferred_effect_sign_claimed']
          print('ALAN_H3_TRUE_SITE_DATE_OPEN_CLOSE_STAGE_SIGN_UNCERTAINTY_PASS')
          PY
          # Original per-flower timestamps and site identities are not redistributed.
          rm dawn_original/original_240820_CICY_RESULTS.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-Grognuz2026-real-dawn-flower-coavailability-gates
          path: dawn_original/*.json
          retention-days: 90
          if-no-files-found: warn
