name: ALAN Sanders original 126-paper Keep Delete and stage AB DOI fulltext evidence census

on:
  push:
    branches:
      - analysis/alan-three-stage-prisma-meta-protocol-20261119
    paths:
      - scripts/analysis/alan_sanders2020_keep_delete_stageAB_primary_screen_20261119.py
      - tests/test_alan_sanders2020_keep_delete_stageAB_primary_screen_20261119.py
      - .github/workflows/alan-sanders2020-keep-delete-stageAB-source-20261119.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-authors-original-CSV-source-keep-delete-and-stageAB:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test true original source Keep Delete field/lab, numerical cells and PRISMA no-meta guards
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_alan_sanders2020_keep_delete_stageAB_primary_screen_20261119.py -v
      - name: Re-download checksum verified 126-paper author CSV and segregate real 195 excluded original effects
        run: |
          set -euo pipefail
          mkdir -p /tmp/alan_three_stage_sanders_source
          python -m scripts.analysis.alan_sanders2020_keep_delete_stageAB_primary_screen_20261119 \
            --out /tmp/alan_three_stage_sanders_source/sanders_original_Keep_Delete_stageAB_source_fulltext_census.json
      - name: Stop pseudo-replication of effect rows as independent experiments, source-data controls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('/tmp/alan_three_stage_sanders_source/sanders_original_Keep_Delete_stageAB_source_fulltext_census.json'))
          assert d['schema']=='alan_original_sanders_1304_Keep_Delete_stageAB_experimental_unit_gate_v1'
          assert d['published_1304_original_rows']==1304
          assert d['original_Sanders_author_CSV_SHA256']=='d11d1e29c05826f2b4a5c1c2d63b9c195dc2effbedd1ff531afa7b6bdf497693'
          assert d['author_original_keep_delete']=={'Keep':1109,'Delete':195}
          assert d['author_original_Field_Lab']=={'Field':770,'Laboratory':534}
          assert not d['no_random_effect_meta_fitted']==False
          assert d['source_original_Study_IDs_hidden']
          assert d['no_verified_aquatic_vs_terrestrial_meta_moderator']
          assert d['no_verified_plant_habitat_moisture_meta_moderator']
          assert d['original_source_effect_rows_not_redistributed']
          print('SANDERS_ORIGINAL_2020_S1_S2_AUTHOR_KEEP_DELETE_REPORT_VALIDATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alan-Sanders126-original-keep1109-delete195-stageA-stageB-source-bibliography
          path: /tmp/alan_three_stage_sanders_source/sanders_original_Keep_Delete_stageAB_source_fulltext_census.json
          if-no-files-found: error
          retention-days: 90
