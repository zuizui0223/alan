name: ALAN true island effective moth bird gecko pollination exposure census
on:
  push:
    branches: [analysis/alan-island-nightshift-species-pair-feasibility-20261110]
    paths:
      - scripts/analysis/alan_island_endemic_night_moth_pair_support_20261110.py
      - scripts/analysis/alan_island_functional_pollination_5species_exposure_census_20261110.py
      - tests/test_alan_island_functional_pollination_exposure_20261110.py
      - .github/workflows/alan-island-verified-functional-pollinator-exposure.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-island-guild-exposure-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 scipy==1.15.2 \
            geopandas==1.1.2 shapely==2.1.2 pyproj==3.7.2 statsmodels==0.14.5
          python -m py_compile scripts/analysis/alan_island_functional_pollination_5species_exposure_census_20261110.py
          python -m unittest discover -s tests -p test_alan_island_functional_pollination_exposure_20261110.py -v
  authentic-source-island-pollinator-exposure:
    needs: original-island-guild-exposure-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore original 93m accepted plants, original historic light, Kew WCVP regional-native reference
        timeout-minutes: 38
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 scipy==1.15.2 \
            geopandas==1.1.2 shapely==2.1.2 pyproj==3.7.2 statsmodels==0.14.5
          mkdir -p original/photos original/experiments original/native original/gecko batches groups
          gh run download 42624285048 --repo zuizui0223/alan \
            --name alan-full93m-actual-PCNL1992-2024-moth-positive-macro \
            --dir original/photos
          echo '440a8313d71168e0a4dfd2f41a7bef45623abb068b07e3282026f1c35dccbd2c  original/photos/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz' | sha256sum -c -
          gh run download 42745392510 --repo zuizui0223/alan \
            --name alan-real93m-daynight-exclusion-independent-experiment-species-support \
            --dir original/experiments
          gh run download 42741492213 --repo zuizui0223/alan \
            --name alan-93m-WCVP-regional-native-introduced-PCNL-island-origin \
            --dir original/native
          echo '2f30984f627425c7dff96d7502c30bb1d28d8291835961fc059e8956204bc457  original/native/ALAN_real_PCNL_WCVP_TDWG3_regional_status_island_site_year.csv.gz' | sha256sum -c -
          gh run download 42791325209 --repo zuizui0223/alan \
            --name alan-global-202608-true-gecko-scincidae-GSHHG-island-year-source \
            --dir original/gecko
          echo 'c2e0c823ee9fcf61182b920724e488d9130b1d1ca9d53266511c2da8873983c9  original/gecko/GBIF_202608_actual_gecko_skink_island_geo_cells2013_2025.csv.gz' | sha256sum -c -
          echo '91d09507f84e062632feed8aef18f09c1fbf7797c812ed3ab147b5e32851b9e2  original/gecko/GBIF_202608_actual_gecko_genera_island_geo_cells2013_2025.csv.gz' | sha256sum -c -
          gh run download 42616279235 --repo zuizui0223/alan \
            --pattern 'alan-93m-fullflora-moth-island-group-*' --dir batches
          test "$(find batches -name 'allflora-island-group-??.sqlite' | wc -l)" -eq 16
          test "$(find batches -name 'allflora-island-group-??.json' | wc -l)" -eq 16
          find batches -name 'allflora-island-group-??.sqlite' -exec cp {} groups/ \;
          find batches -name 'allflora-island-group-??.json' -exec cp {} groups/ \;
      - name: Independently confirm published day-night exclusion author traits blob
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/liamkendall/bumble-bat.git original/published_author
          test "$(git -C original/published_author hash-object data/SppTraitData_clean.csv)" = '18381e550a7e405fe4f198909f0bb381bbecf1e0'
      - name: Measure genuine 8 independently screened focal plants across 3 archipelagos and historical PCNL/gecko source
        timeout-minutes: 65
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_island_functional_pollination_5species_exposure_census_20261110 \
            --study original/experiments/diel_experiment_accepted_plant_source_overlap.csv \
            --traits original/published_author/data/SppTraitData_clean.csv \
            --pcnl original/photos/joined/ALAN_real_93m_flora_island_2019_2025_PCNLPrior1992_2024.csv.gz \
            --groups groups \
            --native original/native/ALAN_real_PCNL_WCVP_TDWG3_regional_status_island_site_year.csv.gz \
            --gecko original/gecko/GBIF_202608_actual_gecko_skink_island_geo_cells2013_2025.csv.gz \
            --genus original/gecko/GBIF_202608_actual_gecko_genera_island_geo_cells2013_2025.csv.gz \
            --out source-audit/ALAN_global_literature_functional_native_archipelagos_PCNl_gecko_exposure.json
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("source-audit/ALAN_global_literature_functional_native_archipelagos_PCNl_gecko_exposure.json")
          d=json.loads(f.read_text())
          assert d['literature_verified_functional_pollination_species_n']==8
          assert d['independent_evolutionary_ancestral_pollinator_shifts_verified']==0
          assert d['original_original_photo_site_year_population']==85318
          assert d['original_within_island_fullflora_GSHHG_islands']==562
          assert d['no_critically_endangered_species_precise_coordinates_released']
          assert d['source_independent_diel_exclosure_study_evidence_tier']['independent_author_daynight_exclusion_exact_WCVP_names']==54
          assert d['source_independent_diel_exclosure_study_evidence_tier']['study_did_not_collect_identity_of_nocturnal_pollinator_taxa']
          assert len(d['source_candidate_species_exposure'])==8
          print("ALAN_REAL_ISLAND_INDEPENDENT_EFFECTIVE_POLLINATOR_EXPOSURE_VERIFIED",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-real-island-effective-moth-bird-daygecko-PCNL-gecko-native-regional-exposure-census
          path: source-audit/ALAN_global_literature_functional_native_archipelagos_PCNl_gecko_exposure.json
          retention-days: 90
          if-no-files-found: warn
