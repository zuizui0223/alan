name: ALAN full 27507-photo source ROI9 strict site-year collector QA
on:
  push:
    branches: [analysis/alan-tier07-bulk26483-realROI9-20261109]
    paths:
      - .github/workflows/alan-tier07-27507-complete-originalROI9-QA.yml
      - scripts/analysis/alan_tier07_collect_full27507_actual_originalROI9.py
      - tests/test_alan_tier07_collect_full27507_actual_originalROI9.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-observation-UUID-site-photo-contract-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run independent original photo source strict-site and unknown ROI9 tests
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2
          python -m unittest discover -s tests -p test_alan_tier07_collect_full27507_actual_originalROI9.py -v
          python -m py_compile scripts/analysis/alan_tier07_collect_full27507_actual_originalROI9.py
          echo 'ALAN_REAL27507_ORIGINAL_PHOTO_SOURCE_ROI9_MERGE_QA_SUCCESS'
