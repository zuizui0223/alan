name: ALAN GloBI v0.11 moth predators and dual-role pollinators (SHA pinned)

on:
  push:
    branches:
      - research/moth-gecko-flora-feasibility-20261111
    paths:
      - .github/workflows/alan-globi-v011-predator-pollinator-roles.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-source-logic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned processing dependencies
        run: python -m pip install -q pandas==2.2.3 numpy==2.1.3
      - name: Source-contract and biological-role invariant tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/analysis/alan_globi_predator_pollinator_multilayer_v011.py
          python -m unittest discover -s tests -p test_alan_globi_predator_pollinator_multilayer_v011.py -v

  real-v011-full-source:
    needs: [check-source-logic]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned processing dependencies
        run: python -m pip install -q pandas==2.2.3 numpy==2.1.3
      - name: Retrieve actual complete versioned 2026-09-10 GloBI source
        run: |
          set -euo pipefail
          mkdir -p original_full_globi
          curl -fL --retry 5 --retry-delay 10 --connect-timeout 30 \
            'https://zenodo.org/records/22691479/files/interactions.csv.gz?download=1' \
            -o original_full_globi/interactions.csv.gz
          echo '670c34b667f0a13d2bfd99edf7a3aa1518b92fa5493614f9dbbcaa0c6821e0c3  original_full_globi/interactions.csv.gz' | sha256sum -c -
      - name: Scan ALL 24,453,954 records; separate moth prey and plant service edges
        run: |
          set -euo pipefail
          python scripts/analysis/alan_globi_predator_pollinator_multilayer_v011.py \
            --source original_full_globi/interactions.csv.gz \
            --out GloBI_v011_predator_pollinator_multilayer \
            --chunk-size 120000
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('GloBI_v011_predator_pollinator_multilayer')
          r=json.loads((p/'source_receipt.json').read_text())
          assert r['status']=='FULL_GLOBI_V011_VERIFIED'
          assert r['source_sha256']=='670c34b667f0a13d2bfd99edf7a3aa1518b92fa5493614f9dbbcaa0c6821e0c3'
          assert r['all_original_interaction_rows']==24453954
          assert len(r['guild_summary'])==36
          assert r['limitations']['caterpillar_predation_not_equal_to_adult_moth_predation']
          assert r['limitations']['one_species_dual_role_not_same_place_or_same_time']
          assert (p/'guild_summary.csv').is_file()
          assert (p/'animal_species_role_flags.csv.gz').is_file()
          assert (p/'animal_flower_plant_positive_flags.csv.gz').is_file()
          print('FULL_GLOBI_PREDATOR_DUAL_ROLE_SOURCE_VERIFIED',json.dumps({
            'n_records':r['all_original_interaction_rows'],
            'roles':r['qualified_role_counts'],
            'groups':[x for x in r['guild_summary'] if x['scope']=='all']
          },sort_keys=True))
          PY
      - name: Store source-derived positive-only role tables and SHA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan-full-GloBI-v011-moth-predator-floral-pollinator-source-roles
          path: GloBI_v011_predator_pollinator_multilayer/
          retention-days: 60
          if-no-files-found: warn
