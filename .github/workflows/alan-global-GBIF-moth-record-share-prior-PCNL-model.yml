name: ALAN genuine global island moth-butterfly source composition vs 13 preyear PCNL
on:
  push:
    branches: [analysis/alan-global-moth-priorlight-20261110]
    paths:
      - scripts/analysis/alan_global_GBIF_moth_record_fraction_within_island_FE_20261110.py
      - tests/test_alan_global_GBIF_moth_record_fraction_FE_20261110.py
      - .github/workflows/alan-global-GBIF-moth-record-share-prior-PCNL-model.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  true-global-obs-source-13year-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate original within-island actual-source fixed effect and detection control design
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 \
            rasterio==1.4.3 geopandas==1.1.2 shapely==2.1.2 pyproj==3.7.2 \
            statsmodels==0.14.5
          python -m py_compile scripts/analysis/alan_global_GBIF_moth_record_fraction_within_island_FE_20261110.py
          python -m unittest discover -s tests -p test_alan_global_GBIF_moth_record_fraction_FE_20261110.py -v
      - name: Restore true global source 228361 source site-years and 13 original PCNL years
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42786502922 --repo zuizui0223/alan \
            --name alan-global-228361-islandcells-actual-13year-prior-PCNL-joined \
            --dir verified
          test -s verified/ALAN_worldwide_GBIF_228361_island_cell_years_original_prior_PCNL_2012_2024.csv.gz
          test -s verified/ALAN_2026_11_global_fourfamily_prior_PCNL_real_source_receipt.json
          echo '64b269dd796b9095853c371909a0dd760921df2e396636a83fc59a2d659e4852  verified/ALAN_worldwide_GBIF_228361_island_cell_years_original_prior_PCNL_2012_2024.csv.gz' | sha256sum -c -
      - name: Estimate global island-year source-supported moth record fraction and negative controls
        timeout-minutes: 32
        run: |
          set -euo pipefail
          python -m scripts.analysis.alan_global_GBIF_moth_record_fraction_within_island_FE_20261110 \
            --source verified/ALAN_worldwide_GBIF_228361_island_cell_years_original_prior_PCNL_2012_2024.csv.gz \
            --receipt verified/ALAN_2026_11_global_fourfamily_prior_PCNL_real_source_receipt.json \
            --out real_model/world_GBIF_four_family_true_photorecord_share_vs_priorPCNL_20261110.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('real_model/world_GBIF_four_family_true_photorecord_share_vs_priorPCNL_20261110.json')
          r=json.loads(p.read_text())
          assert r['real_global_original_source_record_count']==22713063
          assert r['real_global_original_site_year_cells']==228361
          assert r['source_descriptive_postexploratory_nominal_CI_not_confirmatory']
          assert r['no_true_absent_moth_or_butterfly_species_inferred']
          print('ALAN_REAL_WORLDWIDE_MOTH_SOURCE_FRACTION_PCNL_MODEL_VERIFIED',
                json.dumps({
                'primary':r['all_prespecified_source_model_sensitivities']['island_equal_primary_recorded_guild_fraction'],
                'negative_observation_effort_control':r['all_prespecified_source_model_sensitivities']['all_family_record_count_negative_control'],
                'area_modifier':r['all_prespecified_source_model_sensitivities']['extra_island_area_moderation']},
                sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-real-worldwide-island-moth-butterfly-record-share-13year-PCNL-model
          path: real_model/world_GBIF_four_family_true_photorecord_share_vs_priorPCNL_20261110.json
          retention-days: 90
          if-no-files-found: warn
