name: ALAN A null shared-control moderator bias synthetic diagnosis
on:
  push:
    branches:
      - analysis/alan-floral-timing-dependence-20261115
    paths:
      - scripts/analysis/alan_A_shared_control_null_20261115.py
      - tests/test_alan_A_shared_control_null_20261115.py
      - .github/workflows/alan-A-shared-control-null-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned simulation dependency
        run: python -m pip install numpy==2.1.3
      - name: Test analytical covariance and simulation
        run: python -m unittest discover -s tests -p 'test_alan_A_shared_control_null_20261115.py' -v
      - name: Simulate null across three sizes
        run: python scripts/analysis/alan_A_shared_control_null_20261115.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alan-a-shared-control-null-simulation
          path: results/alan_A_shared_control_null_simulation_20261115.json
          if-no-files-found: ignore
          retention-days: 30
