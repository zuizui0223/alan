name: Dual-role 80 species, adult moth prey and direct pollination
on:
  push:
    branches: [analysis/gecko-primary-fiveyear-20261111]
    paths:
      - results/dual_role_80/cohort.csv
      - .github/workflows/alan-dual-role-80.yml
permissions:
  contents: read
jobs:
  identify-prey:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas==2.2.3 pyarrow==18.1.0
      - name: Retrieve pinned interaction archive
        run: curl -fL --retry 3 --connect-timeout 30 'https://zenodo.org/records/22691479/files/interactions.csv.gz?download=1' -o interactions.csv.gz
      - run: python scripts/analysis/alan_gecko_moth_species_edges.py interactions.csv.gz result --cohort results/dual_role_80/cohort.csv
      - uses: actions/upload-artifact@v4
        with:
          name: dual-role-80-edges
          path: result/
          if-no-files-found: error
