name: ALAN 13-year real GBIF moth × gecko same-island light interaction

on:
  push:
    branches: [analysis/alan-multichannel-light-island-20261112]
    paths: [.github/workflows/alan-13yr-real-moth-gecko-island-light.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  true-same-island-observation-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned model dependencies and check script
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 scipy==1.15.2
          python -m py_compile scripts/analysis/alan_13year_moth_gecko_same_island_source_ALAN_20261112.py
      - name: Restore actual original island-year insect and reptile photo/PCNL sources
        run: |
          set -euo pipefail
          mkdir -p source/insect source/reptile
          gh run download 42786502922 --repo zuizui0223/alan \
            --name alan-global-228361-islandcells-actual-13year-prior-PCNL-joined \
            --dir source/insect
          gh run download 42796502910 --repo zuizui0223/alan \
            --name alan-original-101399-gecko-scink-photo-13year-historical-PCNL-all-islands \
            --dir source/reptile
          echo '64b269dd796b9095853c371909a0dd760921df2e396636a83fc59a2d659e4852  source/insect/ALAN_worldwide_GBIF_228361_island_cell_years_original_prior_PCNL_2012_2024.csv.gz' | sha256sum -c -
          echo '03aa855c9e7691855bfee4baa099f0d3a31db8d53066ec36a95afda48c3ba339  source/reptile/gecko_scink_true_2013_2025_original_island_photo_cells_priorPCNL.csv.gz' | sha256sum -c -
      - name: Compute real 2013-2025 moth/photo × gecko/photo × original prior-year ALAN
        run: |
          set -euo pipefail
          python scripts/analysis/alan_13year_moth_gecko_same_island_source_ALAN_20261112.py \
            --insects source/insect/ALAN_worldwide_GBIF_228361_island_cell_years_original_prior_PCNL_2012_2024.csv.gz \
            --reptiles source/reptile/gecko_scink_true_2013_2025_original_island_photo_cells_priorPCNL.csv.gz \
            --output output/ALAN_13yr_true_moth_gecko_photo_priorlight.json
      - name: Verify source cohort/point estimate independently of display
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/ALAN_13yr_true_moth_gecko_photo_priorlight.json').read_text())
          assert r['source_valid_same_cell_prior_PCNL_matches']==15255
          assert r['real_exact_geo_year_cell_matches']==17944
          m=r['model_estimates']['primary_island_equal']
          assert (m['photo_cell_years'],m['independent_islands'],m['island_year_fixed_effects'])==(3424,50,209)
          assert abs(m['coefficient']['cross']['beta']-(-1.3858744682098092))<1e-8
          assert m['coefficient']['cross']['ci95'][0]<0<m['coefficient']['cross']['ci95'][1]
          assert r['biological_limits']['no_original_sensitive_site_coordinates_exported']
          print('REAL_SAME_ISLAND_GBIF_MOTH_GECKO_PRIORPCNL_VERIFIED',json.dumps(m))
          PY
      - name: Archive public aggregates ONLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan-13year-moth-gecko-original-priorPCNL-same-island-aggregate
          path: output/ALAN_13yr_true_moth_gecko_photo_priorlight.json
          retention-days: 90
          if-no-files-found: warn
